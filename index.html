<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PET QUEST 99 - ROBLOX EDITION</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- 引入正統電玩字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --roblox-blue: #00a2ff;
      --roblox-dark: #191b26;
      --btn-gold: #ffbe00;
      --btn-gold-shadow: #c48200;
      --btn-green: #00e676;
      --btn-green-shadow: #009624;
      --panel-border: #39425b;
      --font-arcade: 'Luckiest Guy', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Noto Sans TC', sans-serif;
    }

    body {
      background-color: #0b0e17;
      background-image: 
        radial-gradient(circle at 50% 10%, #1e2846 0%, #0b0e17 80%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 20px, transparent 20px, transparent 40px);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
      color: #fff;
    }

    .roblox-viewport {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 10;
      padding-bottom: 24px;
    }

    /* 頂部 HUD (Roblox 經典厚邊框介面) */
    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, #2b354d, #1b2234);
      border: 3px solid #4a5779;
      border-bottom: 5px solid #101522;
      border-radius: 16px;
      padding: 6px 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    }

    .hud-level-tag {
      font-family: var(--font-arcade);
      font-size: 1.15rem;
      letter-spacing: 1px;
      color: #ffbe00;
      text-shadow: 2px 2px 0 #000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .energy-bar-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .energy-slots {
      display: flex;
      gap: 4px;
    }
    .slot {
      width: 18px;
      height: 22px;
      background: #111624;
      border: 2px solid #33405f;
      border-radius: 5px;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .slot.filled {
      background: linear-gradient(180deg, #00f0ff, #0070f3);
      border-color: #fff;
      box-shadow: 0 0 10px #00f0ff;
      transform: scale(1.1);
    }

    .bag-btn-3d {
      background: linear-gradient(180deg, #ff4081, #c51162);
      border: 2px solid #ff80ab;
      border-bottom: 4px solid #880e4f;
      border-radius: 12px;
      color: white;
      padding: 4px 10px;
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .bag-btn-3d:active {
      transform: translateY(3px);
      border-bottom-width: 1px;
    }

    /* 歷史關卡滾動橫條 */
    .quest-tabs-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .quest-tabs-scroll::-webkit-scrollbar { display: none; }
    .q-tab {
      background: #1e2638;
      border: 2px solid #354366;
      border-bottom: 4px solid #0f131d;
      border-radius: 10px;
      color: #8c9cb8;
      padding: 6px 12px;
      font-weight: 900;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.1s;
    }
    .q-tab.active {
      background: linear-gradient(180deg, #00e5ff, #0091ea);
      color: #0b1120;
      border-color: #e0f7fa;
      border-bottom-color: #01579b;
      transform: translateY(-1px);
    }

    /* 中央巨大扭蛋／開箱主舞台 */
    .stage-arena {
      background: radial-gradient(circle at center, #273452 0%, #151c2e 80%);
      border: 4px solid #435479;
      border-bottom: 8px solid #0d121e;
      border-radius: 28px;
      padding: 24px 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0,0,0,0.6);
    }

    /* 舞台背後旋轉射線 */
    .arena-rays {
      position: absolute;
      width: 300%;
      height: 300%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 255, 255, 0.03) 0deg 15deg,
        transparent 15deg 30deg
      );
      animation: rotateRays 30s linear infinite;
      pointer-events: none;
    }
    @keyframes rotateRays {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 3D 實體質感開箱蛋 */
    .egg-pedestal-3d {
      width: 140px;
      height: 30px;
      background: radial-gradient(ellipse at center, #00f0ff 0%, rgba(0, 240, 255, 0) 70%);
      border-radius: 50%;
      margin-top: -10px;
      filter: blur(2px);
    }

    .egg-master-3d {
      width: 130px;
      height: 165px;
      background: radial-gradient(circle at 35% 25%, #60a5fa 0%, #1d4ed8 55%, #0f172a 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      border: 5px solid #ffffff;
      box-shadow: 
        inset -12px -12px 0 rgba(0, 0, 0, 0.4),
        inset 8px 8px 0 rgba(255, 255, 255, 0.4),
        0 14px 28px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 2;
      animation: idleBob 2.6s ease-in-out infinite;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes idleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* 狂暴晃動發光態 */
    .egg-master-3d.ready {
      background: radial-gradient(circle at 35% 25%, #fef08a 0%, #f59e0b 55%, #7c2d12 100%);
      box-shadow: 
        0 0 50px #ffbe00,
        inset -12px -12px 0 rgba(0, 0, 0, 0.4),
        inset 8px 8px 0 rgba(255, 255, 255, 0.6);
      animation: hyperShake 0.25s infinite alternate;
    }
    @keyframes hyperShake {
      0% { transform: scale(1.08) rotate(-6deg); }
      100% { transform: scale(1.08) rotate(6deg); }
    }

    .stage-callout {
      margin-top: 12px;
      font-family: var(--font-arcade);
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      color: #38bdf8;
      text-shadow: 2px 2px 0 #000;
      z-index: 2;
    }

    /* 3D 街機厚按鈕清單 (Chunky Arcade Button) */
    .task-container-3d {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .arcade-card-btn {
      background: linear-gradient(180deg, #2b3752, #182236);
      border: 3px solid #4a5c85;
      border-bottom: 7px solid #0f1522;
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      position: relative;
      transition: all 0.08s ease-out;
    }
    .arcade-card-btn:active {
      transform: translateY(4px);
      border-bottom-width: 3px;
    }
    .arcade-card-btn.charged {
      background: linear-gradient(180deg, #15803d, #052e16);
      border-color: #4ade80;
      border-bottom-color: #022010;
    }

    .card-row-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-en {
      font-family: var(--font-arcade);
      font-size: 1.45rem;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000;
    }
    .card-zh {
      font-size: 0.95rem;
      font-weight: 900;
      color: #94a3b8;
    }
    .arcade-card-btn.charged .card-zh {
      color: #86efac;
    }

    .sound-badge-3d {
      width: 44px;
      height: 44px;
      background: linear-gradient(180deg, var(--btn-gold), var(--btn-gold-shadow));
      border: 2px solid #fff;
      border-bottom: 4px solid #8c5d00;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .arcade-card-btn.charged .sound-badge-3d {
      background: linear-gradient(180deg, var(--btn-green), var(--btn-green-shadow));
      border-bottom-color: #005a18;
    }

    /* 拆解抽屜 */
    .phonics-hint-btn {
      font-size: 0.78rem;
      font-weight: 900;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      width: fit-content;
    }
    .phonics-drawer {
      display: none;
      padding-top: 6px;
      border-top: 1px dashed rgba(255,255,255,0.15);
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.45;
    }
    .phonics-drawer.open { display: block; }

    /* 密碼句大按鈕 */
    .sentence-card-3d {
      background: linear-gradient(180deg, #2b3752, #182236);
      border: 3px solid #4a5c85;
      border-bottom: 7px solid #0f1522;
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all 0.08s ease-out;
    }
    .sentence-card-3d:active {
      transform: translateY(4px);
      border-bottom-width: 3px;
    }
    .sentence-card-3d.charged {
      background: linear-gradient(180deg, #854d0e, #451a03);
      border-color: #facc15;
      border-bottom-color: #240d01;
    }

    .sentence-title-tag {
      font-family: var(--font-arcade);
      font-size: 0.82rem;
      letter-spacing: 0.5px;
      color: #facc15;
      text-shadow: 1px 1px 0 #000;
    }
    .sentence-en-text {
      font-family: var(--font-arcade);
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000;
      line-height: 1.35;
    }
    .sentence-zh-text {
      font-size: 0.9rem;
      font-weight: 900;
      color: #94a3b8;
    }

    /* 長輩安心欄 (直覺顯眼) */
    .grandparent-bar-3d {
      background: linear-gradient(180deg, #134e4a, #042f2e);
      border: 3px solid #2dd4bf;
      border-bottom: 6px solid #021a19;
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    }
    .gp-headline {
      font-size: 1rem;
      font-weight: 900;
      color: #5eead4;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .gp-body {
      font-size: 0.92rem;
      font-weight: 700;
      color: #ccfbf1;
      line-height: 1.5;
    }

    /* 浮空傷害/XP 暴擊特效字 (Floating Text) */
    .floating-xp {
      position: fixed;
      font-family: var(--font-arcade);
      font-size: 1.6rem;
      color: #ffbe00;
      text-shadow: 3px 3px 0 #000, 0 0 10px #ffbe00;
      pointer-events: none;
      z-index: 9999;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.6); opacity: 1; }
      50% { transform: translateY(-30px) scale(1.2); opacity: 1; }
      100% { transform: translateY(-60px) scale(1); opacity: 0; }
    }

    /* 全螢幕彈窗 */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-gacha-card {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(180deg, #273452, #111726);
      border: 5px solid #ffbe00;
      border-bottom: 10px solid #7c5000;
      border-radius: 28px;
      padding: 24px 20px;
      text-align: center;
      position: relative;
      animation: popInCard 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popInCard {
      0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .rarity-pill-3d {
      display: inline-block;
      font-family: var(--font-arcade);
      letter-spacing: 1px;
      padding: 4px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      margin-bottom: 12px;
      border: 2px solid #fff;
    }
    .r-secret { background: linear-gradient(90deg, #ff007f, #7928ca); color: #fff; box-shadow: 0 0 20px #ff007f; }
    .r-mythic { background: linear-gradient(90deg, #ec4899, #8b5cf6); color: #fff; box-shadow: 0 0 15px #ec4899; }
    .r-legendary { background: linear-gradient(90deg, #ffbe00, #ff5722); color: #fff; }
    .r-epic { background: linear-gradient(90deg, #8b5cf6, #3b82f6); color: #fff; }
    .r-rare { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: #fff; }
    .r-common { background: #64748b; color: #fff; }

    .pet-portrait {
      width: 130px;
      height: 130px;
      margin: 8px auto 14px;
      background: radial-gradient(circle at center, rgba(255,255,255,0.15) 0%, transparent 70%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
      animation: floatPet 2s ease-in-out infinite;
    }
    @keyframes floatPet {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .pet-title-name {
      font-family: var(--font-arcade);
      font-size: 1.6rem;
      letter-spacing: 0.5px;
      color: #fff;
      text-shadow: 3px 3px 0 #000;
      line-height: 1.25;
    }
    .pet-stat-power {
      font-family: var(--font-arcade);
      font-size: 1.25rem;
      color: #ffbe00;
      text-shadow: 2px 2px 0 #000;
      margin: 6px 0 10px;
    }

    .pet-quote-box {
      background: rgba(0,0,0,0.4);
      border-radius: 12px;
      padding: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .modal-submit-btn {
      width: 100%;
      background: linear-gradient(180deg, var(--btn-green), var(--btn-green-shadow));
      border: 3px solid #bbf7d0;
      border-bottom: 6px solid #005a18;
      border-radius: 16px;
      color: #fff;
      font-family: var(--font-arcade);
      font-size: 1.2rem;
      letter-spacing: 1px;
      padding: 12px;
      cursor: pointer;
      text-shadow: 2px 2px 0 #000;
    }
    .modal-submit-btn:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    /* 圖鑑網格 */
    .bag-grid-3d {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 52vh;
      overflow-y: auto;
      margin: 14px 0;
      padding: 4px;
      scrollbar-width: thin;
    }
    .bag-cell {
      background: #151d30;
      border: 2px solid #2d3b59;
      border-bottom: 4px solid #0b0f1a;
      border-radius: 12px;
      padding: 8px 2px;
      text-align: center;
    }
    .bag-cell.unlocked {
      border-color: #ffbe00;
      background: linear-gradient(180deg, #2a3754, #151d30);
    }
    .bag-cell.locked { opacity: 0.3; filter: grayscale(1); }
    .bag-cell-icon { font-size: 1.8rem; margin-bottom: 2px; }
    .bag-cell-name {
      font-size: 0.68rem;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    #flash-bang {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.15s ease-out;
    }

    #confetti-fx {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 1001;
    }
  </style>
</head>
<body>

  <div id="flash-bang"></div>
  <canvas id="confetti-fx"></canvas>

  <div class="roblox-viewport">

    <!-- 頂部 HUD (Roblox 質感狀態列) -->
    <div class="hud-bar">
      <div class="hud-level-tag">
        <span>⚔️</span>
        <span id="level-display">WORLD 4</span>
      </div>
      <div class="energy-bar-wrap">
        <div class="energy-slots" id="slots-bar">
          <div class="slot" id="slot-0"></div>
          <div class="slot" id="slot-1"></div>
          <div class="slot" id="slot-2"></div>
          <div class="slot" id="slot-3"></div>
        </div>
      </div>
      <button class="bag-btn-3d" onclick="openBagModal()">
        🎒 圖鑑
      </button>
    </div>

    <!-- 歷史關卡滾動選單 -->
    <div class="quest-tabs-scroll" id="quest-nav-box"></div>

    <!-- 中央開箱舞台 (帶 3D 浮空光圈與裂紋神蛋) -->
    <div class="stage-arena">
      <div class="arena-rays"></div>
      <div class="egg-master-3d" id="egg-actor" onclick="crackEgg()">
        <span id="egg-status-symbol" style="font-size: 3rem;">🔒</span>
      </div>
      <div class="egg-pedestal-3d"></div>
      <div class="stage-callout" id="stage-announcement">點擊下方 3 個字 + 1 句話注入能量！</div>
    </div>

    <!-- 任務卡牌池 (3D 厚底街機按鈕) -->
    <div class="task-container-3d">
      <div id="words-deck-3d" style="display: flex; flex-direction: column; gap: 10px;"></div>

      <div class="sentence-card-3d" id="sentence-card-btn" onclick="tapSentence(event)">
        <div class="sentence-title-tag">📜 本週通關密碼句 (點擊大聲聽讀)</div>
        <div class="sentence-en-text" id="sentence-en-val"></div>
        <div class="sentence-zh-text" id="sentence-zh-val"></div>
      </div>
    </div>

    <!-- 阿公阿嬤安心專區 -->
    <div class="grandparent-bar-3d">
      <div class="gp-headline">👵👴 阿公阿嬤請看這：</div>
      <div class="gp-body">
        阿公阿嬤辛苦了！您不用管英文是什麼意思。只要看到孫子<strong>按喇叭聽完並唸出聲音 3 遍</strong>，看他點開上方大寶蛋抽到神寵，今天他就及格囉！✨
      </div>
    </div>

  </div>

  <!-- 1. 抽卡開箱 Modal -->
  <div class="modal-backdrop" id="gacha-modal">
    <div class="modal-gacha-card">
      <span class="rarity-pill-3d" id="m-rarity">MYTHIC</span>
      <div class="pet-portrait" id="m-icon">🦖</div>
      <div class="pet-title-name" id="m-name">彩虹機械霸王龍</div>
      <div class="pet-stat-power" id="m-power">⚡ POWER: 999,999</div>
      <div class="pet-quote-box" id="m-quote">全服只有 0.1% 掉落率的傳奇神獸！</div>

      <div style="background: rgba(34, 197, 94, 0.2); border: 2px dashed #4ade80; border-radius: 12px; padding: 8px; color: #86efac; font-size: 0.9rem; font-weight: 900; margin-bottom: 14px;">
        ✓ 今日任務通關！給阿嬤看換遊戲時間！
      </div>

      <button class="modal-submit-btn" onclick="closeGachaModal()">收進背包 🎮</button>
    </div>
  </div>

  <!-- 2. 圖鑑背包 Modal -->
  <div class="modal-backdrop" id="bag-modal">
    <div class="modal-gacha-card" style="max-width: 390px;">
      <div class="pet-title-name" style="font-size: 1.4rem;">🎒 寵物收藏圖鑑</div>
      <div style="font-size: 0.85rem; color: #94a3b8; font-weight: 700; margin-top: 4px;">已解鎖進度：<span id="bag-count-val">0</span> 種神獸</div>
      
      <div class="bag-grid-3d" id="bag-cells-box"></div>

      <button class="modal-submit-btn" onclick="closeBagModal()">返回任務</button>
    </div>
  </div>

  <script>
    // ========================================================
    // ⚙️ 1. 教師雲端後台設定 (若尚未設定 Google Apps Script 可先留空)
    // ========================================================
    const GOOGLE_SCRIPT_API = ""; 
    const urlParams = new URLSearchParams(window.location.search);
    const STUDENT_ID = urlParams.get('user') || "hero_student";

    // ========================================================
    // ⚙️ 2. 每週更新專區：每週只需在陣列最前面新增一筆，舊週次永遠留存！
    // ========================================================
    const ALL_QUESTS = [
      {
        id: "w4",
        label: "WORLD 4: RAINY FOREST",
        words: [
          { en: "rain", display: "R · AIN", zh: "下雨", hint: "發音拆解：ai 發長母音 [e]，拼寫拆為 r + ain 就能拼出來！" },
          { en: "weather", display: "WEA · THER", zh: "天氣", hint: "拆成兩半看：wea- (短母音 e) + -ther (th 咬舌頭濁音)！" },
          { en: "outside", display: "OUT · SIDE", zh: "外面", hint: "積木拼裝：out (出去) + side (旁邊) ＝ 外面！" }
        ],
        sentence: {
          en: "It is raining outside.",
          zh: "外面正在下雨。"
        }
      },
      {
        id: "w3",
        label: "WORLD 3: SCHOOL CAMPUS",
        words: [
          { en: "happy", display: "HAP · PY", zh: "高興的", hint: "a 發大嘴巴短母音 [æ]！" },
          { en: "school", display: "SCHOOL", zh: "學校", hint: "ch 在這裡發 [k] 的音！" },
          { en: "friend", display: "FRIEND", zh: "朋友", hint: "ie 在這裡發短母音 [e]！" }
        ],
        sentence: {
          en: "I see my friend at school.",
          zh: "我在學校看到我的朋友。"
        }
      }
    ];

    // ========================================================
    // 🌌 3. 程序化無限 RNG 圖鑑引擎 (1200+ 種獨特組合)
    // ========================================================
    const RNG_ENGINE = {
      prefixes: [
        { name: "彩虹霓虹", mult: 25, r: "MYTHIC", cls: "r-mythic" },
        { name: "純金黃金", mult: 18, r: "LEGENDARY", cls: "r-legendary" },
        { name: "黑洞虛空", mult: 50, r: "SECRET", cls: "r-secret" },
        { name: "賽博駭客", mult: 15, r: "LEGENDARY", cls: "r-legendary" },
        { name: "熔岩燃燒", mult: 12, r: "EPIC", cls: "r-epic" },
        { name: "暴風極凍", mult: 10, r: "EPIC", cls: "r-epic" },
        { name: "生鏽發霉", mult: 1, r: "COMMON", cls: "r-common" },
        { name: "發光音波", mult: 6, r: "RARE", cls: "r-rare" },
        { name: "隱形幽靈", mult: 8, r: "RARE", cls: "r-rare" },
        { name: "宇宙碎星", mult: 35, r: "MYTHIC", cls: "r-mythic" }
      ],
      bases: [
        { name: "機械霸王龍", icon: "🦖", basePow: 40000, desc: "步伐沉重，自帶咆哮音效！" },
        { name: "香蕉狗", icon: "🐕", basePow: 3500, desc: "雖然可愛，但每次轉彎都會打滑。" },
        { name: "時鐘人", icon: "⏰", basePow: 38000, desc: "能把補習班的下課鐘聲提前響起！" },
        { name: "音響巨人", icon: "🔊", basePow: 36000, desc: "胸口重低音砲一響，考卷直接被震飛！" },
        { name: "銀河飛龍", icon: "🐉", basePow: 42000, desc: "吐息自帶碎星光芒的星空巨龍。" },
        { name: "音波馬桶怪", icon: "🚽", basePow: 800, desc: "按下沖水鍵會發射超強音波攻擊！" },
        { name: "生吐司", icon: "🍞", basePow: 10, desc: "雖然戰鬥力很低，但烤一烤挺香的。" },
        { name: "臭襪子", icon: "🧦", basePow: 5, desc: "散發致命瓦斯，聞到直接倒退三步！" },
        { name: "滑板鯊魚", icon: "🦈", basePow: 2200, desc: "不在水裡游，只喜歡在陸地上溜滑板。" },
        { name: "尖叫橡皮鴨", icon: "🐥", basePow: 25, desc: "捏一下會發出極度尖銳的慘叫聲！" }
      ],
      suffixes: [
        "の破壞神", "の守護者", "の究極體", "の小跟班", "の大統領", "の支配者"
      ]
    };

    let currentQuestIdx = 0;
    let chargedSet = new Set();
    let unlockedCollection = JSON.parse(localStorage.getItem("roblox_infinite_pets") || "[]");

    function initNav() {
      const nav = document.getElementById("quest-nav-box");
      nav.innerHTML = "";
      ALL_QUESTS.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = `q-tab ${idx === 0 ? 'active' : ''}`;
        btn.innerText = q.label.split(":")[0];
        btn.onclick = () => switchQuest(idx);
        nav.appendChild(btn);
      });
    }

    function switchQuest(idx) {
      currentQuestIdx = idx;
      document.querySelectorAll(".q-tab").forEach((b, i) => {
        b.classList.toggle("active", i === idx);
      });
      loadQuest(ALL_QUESTS[idx]);
    }

    function loadQuest(quest) {
      chargedSet.clear();
      updateSlotDisplay();

      document.getElementById("level-display").innerText = quest.label.split(":")[0];

      const eggActor = document.getElementById("egg-actor");
      eggActor.classList.remove("ready");
      document.getElementById("egg-status-symbol").innerText = "🔒";
      document.getElementById("stage-announcement").innerText = "點擊下方 3 個字 + 1 句話注入能量！";
      document.getElementById("stage-announcement").style.color = "#38bdf8";

      document.getElementById("sentence-en-val").innerText = quest.sentence.en;
      document.getElementById("sentence-zh-val").innerText = quest.sentence.zh;
      document.getElementById("sentence-card-btn").classList.remove("charged");

      const wordsBox = document.getElementById("words-deck-3d");
      wordsBox.innerHTML = "";
      quest.words.forEach((item, idx) => {
        const btn = document.createElement("div");
        btn.className = "arcade-card-btn";
        btn.id = `card-${idx}`;
        btn.onclick = (e) => {
          if (e.target.closest('.phonics-hint-btn')) return;
          tapWord(idx, item.en, e);
        };

        btn.innerHTML = `
          <div class="card-row-main">
            <div>
              <div class="card-en">${item.display}</div>
              <div class="card-zh">${item.zh}</div>
            </div>
            <div class="sound-badge-3d" id="badge-${idx}">🔊</div>
          </div>
          <span class="phonics-hint-btn" onclick="toggleHint(this)">💡 自然拼讀拆解</span>
          <div class="phonics-drawer">${item.hint}</div>
        `;
        wordsBox.appendChild(btn);
      });
    }

    function toggleHint(btn) {
      const drawer = btn.nextElementSibling;
      drawer.classList.toggle("open");
      btn.innerText = drawer.classList.contains("open") ? "收合拆解" : "💡 自然拼讀拆解";
    }

    function tapWord(idx, word, event) {
      playArcadeCoin();
      speak(word);
      showFloatingXP(event.clientX, event.clientY);

      const key = `w-${idx}`;
      if (!chargedSet.has(key)) {
        chargedSet.add(key);
        document.getElementById(`card-${idx}`).classList.add("charged");
        document.getElementById(`badge-${idx}`).innerText = "⚡";
        updateSlotDisplay();
      }
    }

    function tapSentence(event) {
      playArcadeCoin();
      speak(ALL_QUESTS[currentQuestIdx].sentence.en);
      showFloatingXP(event.clientX, event.clientY);

      if (!chargedSet.has("sentence")) {
        chargedSet.add("sentence");
        document.getElementById("sentence-card-btn").classList.add("charged");
        updateSlotDisplay();
      }
    }

    function updateSlotDisplay() {
      const count = chargedSet.size;
      for (let i = 0; i < 4; i++) {
        const slot = document.getElementById(`slot-${i}`);
        if (i < count) slot.classList.add("filled");
        else slot.classList.remove("filled");
      }

      if (count === 4) {
        const eggActor = document.getElementById("egg-actor");
        eggActor.classList.add("ready");
        document.getElementById("egg-status-symbol").innerText = "✨";
        document.getElementById("stage-announcement").innerText = "🔥 能量充飽！快點擊狂暴開箱！";
        document.getElementById("stage-announcement").style.color = "#ffbe00";
        playFanfare();
      }
    }

    // 浮空暴擊 XP 數字
    function showFloatingXP(x, y) {
      const xp = document.createElement("div");
      xp.className = "floating-xp";
      xp.innerText = "+500 XP!";
      xp.style.left = `${x || window.innerWidth / 2}px`;
      xp.style.top = `${(y || window.innerHeight / 2) - 20}px`;
      document.body.appendChild(xp);
      setTimeout(() => xp.remove(), 800);
    }

    // 程序化生成寵物 (RNG Procedural Roll)
    function rollProceduralPet() {
      const p = RNG_ENGINE.prefixes[Math.floor(Math.random() * RNG_ENGINE.prefixes.length)];
      const b = RNG_ENGINE.bases[Math.floor(Math.random() * RNG_ENGINE.bases.length)];
      const s = RNG_ENGINE.suffixes[Math.floor(Math.random() * RNG_ENGINE.suffixes.length)];

      const finalName = `${p.name} · ${b.name} ${s}`;
      const finalPower = Math.floor(b.basePow * p.mult * (0.8 + Math.random() * 0.4));
      const odds = Math.floor(1000000 / (p.mult * 100));

      return {
        id: `rng_${Date.now()}_${Math.floor(Math.random()*1000)}`,
        name: finalName,
        icon: b.icon,
        rarity: `${p.r} [1 in ${odds > 1 ? odds : 2}]`,
        rClass: p.cls,
        power: `⚡ ${finalPower.toLocaleString()}`,
        desc: `${b.desc} 具備【${p.name}】特性的超強變異！`
      };
    }

    // 點擊開箱
    function crackEgg() {
      if (chargedSet.size < 4) {
        alert("請先將 3 個單字和 1 句話聽完，湊滿 4 顆能量！");
        return;
      }

      triggerFlash();
      playExplosion();
      fireConfetti();

      const pet = rollProceduralPet();

      unlockedCollection.unshift(pet);
      if (unlockedCollection.length > 80) unlockedCollection.pop();
      localStorage.setItem("roblox_infinite_pets", JSON.stringify(unlockedCollection));

      // 雲端同步
      if (GOOGLE_SCRIPT_API) {
        fetch(`${GOOGLE_SCRIPT_API}?action=save&user=${encodeURIComponent(STUDENT_ID)}&quest=${encodeURIComponent(ALL_QUESTS[currentQuestIdx].label)}&pet=${encodeURIComponent(pet.name)}`, {
          mode: 'no-cors'
        });
      }

      const badge = document.getElementById("m-rarity");
      badge.innerText = pet.rarity;
      badge.className = `rarity-pill-3d ${pet.rClass}`;
      document.getElementById("m-icon").innerText = pet.icon;
      document.getElementById("m-name").innerText = pet.name;
      document.getElementById("m-power").innerText = pet.power;
      document.getElementById("m-quote").innerText = pet.desc;

      document.getElementById("gacha-modal").style.display = "flex";
    }

    function closeGachaModal() {
      document.getElementById("gacha-modal").style.display = "none";
    }

    function openBagModal() {
      const box = document.getElementById("bag-cells-box");
      box.innerHTML = "";
      document.getElementById("bag-count-val").innerText = unlockedCollection.length;

      if (unlockedCollection.length === 0) {
        box.innerHTML = `<div style="grid-column: span 4; color: #94a3b8; font-size: 0.85rem; padding: 20px;">尚未抽到任何寵物，快去開蛋吧！</div>`;
      } else {
        unlockedCollection.forEach(p => {
          const item = document.createElement("div");
          item.className = "bag-cell unlocked";
          item.innerHTML = `
            <div class="bag-cell-icon">${p.icon}</div>
            <div class="bag-cell-name">${p.name}</div>
          `;
          box.appendChild(item);
        });
      }

      document.getElementById("bag-modal").style.display = "flex";
    }

    function closeBagModal() {
      document.getElementById("bag-modal").style.display = "none";
    }

    function speak(txt) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'en-US';
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
      }
    }

    function triggerFlash() {
      const f = document.getElementById("flash-bang");
      f.style.opacity = "0.9";
      setTimeout(() => { f.style.opacity = "0"; }, 200);
    }

    function playArcadeCoin() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(987.77, ctx.currentTime);
        osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function playFanfare() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.3);
          osc.start(ctx.currentTime + i * 0.1);
          osc.stop(ctx.currentTime + i * 0.1 + 0.3);
        });
      } catch (e) {}
    }

    function playExplosion() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [440, 554.37, 659.25, 880, 1108.73];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.07);
          gain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.07 + 0.3);
          osc.start(ctx.currentTime + idx * 0.07);
          osc.stop(ctx.currentTime + idx * 0.07 + 0.3);
        });
      } catch (e) {}
    }

    function fireConfetti() {
      const cvs = document.getElementById("confetti-fx");
      const ctx = cvs.getContext("2d");
      cvs.width = window.innerWidth;
      cvs.height = window.innerHeight;

      const p = [];
      const colors = ["#ffbe00", "#00f0ff", "#00e676", "#ff4081", "#c084fc"];
      for (let i = 0; i < 90; i++) {
        p.push({
          x: cvs.width / 2,
          y: cvs.height / 2,
          r: Math.random() * 6 + 4,
          dx: (Math.random() - 0.5) * 14,
          dy: (Math.random() - 0.8) * 16,
          c: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      let f = 0;
      function step() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        p.forEach(item => {
          item.x += item.dx;
          item.y += item.dy;
          item.dy += 0.35;
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
          ctx.fillStyle = item.c;
          ctx.fill();
        });
        f++;
        if (f < 100) requestAnimationFrame(step);
        else ctx.clearRect(0, 0, cvs.width, cvs.height);
      }
      step();
    }

    window.addEventListener("DOMContentLoaded", () => {
      initNav();
      loadQuest(ALL_QUESTS[0]);
    });
  </script>
</body>
</html>
