<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ROBLOX ARCADE: 任務大冒險</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090e1a;
      --card-bg: #1e293b;
      --gold: #facc15;
      --gold-dark: #ca8a04;
      --cyan: #38bdf8;
      --green: #22c55e;
      --border-dark: #334155;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    }

    /* 鎖定全視窗，堅決不出現滾動條 */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #070a13 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-viewport {
      width: 100%;
      max-width: 420px;
      height: 98vh;
      max-height: 840px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 12px;
      position: relative;
      z-index: 10;
    }

    /* 頂部控制面板 */
    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .quest-tabs-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quest-tabs-scroll::-webkit-scrollbar { display: none; }

    .q-btn {
      background: var(--card-bg);
      border: 2px solid var(--border-dark);
      color: var(--text-sub);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .q-btn.active {
      background: var(--cyan);
      color: #0b1120;
      border-color: #0284c7;
    }

    .action-icons-group {
      display: flex;
      gap: 6px;
    }

    .pill-btn {
      background: #1e293b;
      border: 2px solid var(--border-dark);
      color: #fff;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .pill-btn.bag-btn { background: linear-gradient(180deg, #ec4899, #be185d); border-color: #831843; }
    .pill-btn.elder-btn { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; color: #86efac; }
    .pill-btn.elder-btn.active { background: #22c55e; color: #052e16; }

    /* 模式選單 */
    .game-modes-deck {
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.6);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--border-dark);
    }
    .g-mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 4px 6px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .g-mode-btn.active {
      background: var(--gold);
      color: #0b1120;
    }

    /* 長輩安心面板 */
    .elder-helper-banner {
      display: none;
      background: linear-gradient(135deg, rgba(22, 101, 52, 0.95), rgba(15, 23, 42, 0.95));
      border: 2px solid var(--green);
      border-radius: 14px;
      padding: 10px 12px;
      color: #d1fae5;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .elder-helper-banner.show { display: block; }
    .elder-helper-banner strong { color: #86efac; }

    /* 核心舞台 */
    .stage-arena {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
      border: 2px solid var(--border-dark);
      box-shadow: 0 4px 0 #000;
      border-radius: 20px;
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 185px;
    }

    .egg-box {
      width: 90px;
      height: 115px;
      background: radial-gradient(circle at 35% 30%, #93c5fd, #1d4ed8 75%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 20px rgba(29, 78, 216, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
    }
    .egg-box.ready {
      background: radial-gradient(circle at 35% 30%, #fef08a, #ea580c 75%);
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.9);
      animation: shakeEgg 0.3s infinite alternate;
    }
    @keyframes shakeEgg {
      from { transform: rotate(-6deg) scale(1.05); }
      to { transform: rotate(6deg) scale(1.05); }
    }

    .corridor-door {
      width: 55px;
      height: 95px;
      background: #1e293b;
      border: 2px solid #475569;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0.4;
    }
    .corridor-door.unlocked { opacity: 1; border-color: var(--cyan); background: #0284c7; }
    .corridor-door.current { opacity: 1; border-color: var(--gold); animation: pulseDoor 0.8s infinite alternate; }
    @keyframes pulseDoor { from { transform: scale(1); } to { transform: scale(1.06); } }

    .monster-target { font-size: 4rem; }
    .slot-machine-box {
      background: #0f172a;
      border: 3px solid var(--gold);
      border-radius: 16px;
      padding: 10px 16px;
      display: flex;
      gap: 8px;
    }
    .slot-reel {
      width: 44px;
      height: 58px;
      background: #1e293b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }
    .slot-reel.spinning { animation: reelSpin 0.1s infinite; }
    @keyframes reelSpin { 0% { transform: translateY(-4px); } 100% { transform: translateY(4px); } }

    .stage-title { font-size: 1rem; font-weight: 800; margin-top: 6px; }
    .stage-sub { font-size: 0.78rem; color: var(--cyan); font-weight: 700; }

    .energy-bar-wrap {
      width: 100%;
      height: 10px;
      background: #0f172a;
      border-radius: 999px;
      border: 1.5px solid var(--border-dark);
      margin-top: 8px;
      overflow: hidden;
    }
    .energy-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      transition: width 0.3s;
    }

    /* 任務牌組 */
    .tasks-deck {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-card {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 2px solid var(--border-dark);
      border-radius: 14px;
      padding: 8px 12px;
      transition: all 0.15s;
    }
    .task-card.charged {
      border-color: var(--green);
      background: linear-gradient(180deg, #14532d, #052e16);
    }

    .task-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-en { font-size: 1.15rem; font-weight: 800; color: #fff; }
    .word-zh { font-size: 0.8rem; color: var(--text-sub); font-weight: 700; }

    /* 3 階聽讀指示燈 (Repeats Counter) */
    .repeat-dots-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .repeat-track {
      display: flex;
      gap: 3px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #334155;
      border: 1px solid #475569;
    }
    .dot.active {
      background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
      border-color: #fff;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(180deg, #0284c7, #0369a1);
      border: 1.5px solid var(--cyan);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .task-card.charged .play-btn {
      background: linear-gradient(180deg, var(--green), #15803d);
      border-color: #86efac;
    }

    .hint-trigger {
      display: inline-flex;
      margin-top: 4px;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 5px;
      cursor: pointer;
    }
    .hint-drawer {
      display: none;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-dark);
      font-size: 0.78rem;
      color: #e2e8f0;
      line-height: 1.4;
    }
    .hint-drawer.open { display: block; }

    /* 句子卡 */
    .sentence-card {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 2px solid var(--border-dark);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sentence-card.charged {
      border-color: var(--gold);
      background: linear-gradient(180deg, #713f12, #451a03);
    }
    .sentence-tag { font-size: 0.7rem; font-weight: 800; color: var(--gold); margin-bottom: 2px; }
    .sentence-en { font-size: 0.95rem; font-weight: 800; color: #fff; line-height: 1.3; }
    .sentence-zh { font-size: 0.78rem; color: var(--text-sub); font-weight: 700; }

    /* 彈窗 Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #1e293b, #090e1a);
      border: 3px solid var(--gold);
      border-radius: 22px;
      padding: 18px 16px;
      text-align: center;
    }

    .rarity-pill {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.75rem;
      margin-bottom: 6px;
    }
    .r-mythic { background: linear-gradient(90deg, #ec4899, #8b5cf6); color: #fff; }
    .r-legendary { background: linear-gradient(90deg, #f59e0b, #ef4444); color: #fff; }
    .r-rare { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: #fff; }
    .r-common { background: #64748b; color: #fff; }

    .loot-icon { font-size: 3.8rem; margin: 4px 0; }
    .loot-name { font-size: 1.35rem; font-weight: 900; }
    .loot-power { font-size: 0.95rem; color: var(--gold); font-weight: 800; margin: 2px 0 6px; }
    .loot-quote {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .grandparent-pass {
      background: rgba(34, 197, 94, 0.18);
      border: 2px dashed var(--green);
      border-radius: 12px;
      padding: 8px 10px;
      color: #86efac;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .close-btn {
      width: 100%;
      background: linear-gradient(180deg, var(--green), #15803d);
      border: none;
      color: #fff;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
    }

    /* 萬物圖鑑 */
    .bag-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-height: 48vh;
      overflow-y: auto;
      margin: 12px 0;
      padding: 2px;
    }
    .bag-cell {
      background: #0f172a;
      border: 1.5px solid var(--border-dark);
      border-radius: 10px;
      padding: 6px 2px;
      text-align: center;
    }
    .bag-cell.unlocked { border-color: var(--gold); background: #1e293b; }
    .bag-cell.locked { opacity: 0.35; filter: grayscale(1); }
    .bag-num { font-size: 0.6rem; color: var(--text-sub); }
    .bag-cell-icon { font-size: 1.5rem; margin: 2px 0; }
    .bag-cell-name { font-size: 0.68rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #flash-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.15s ease-out;
    }
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 101;
    }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="app-viewport">
    
    <!-- 頂部控制欄 -->
    <div class="control-header">
      <div class="quest-tabs-scroll" id="quest-nav-box"></div>
      <div class="action-icons-group">
        <button class="pill-btn elder-btn" id="elder-btn" onclick="toggleElderGuide()">👵 長輩指南</button>
        <button class="pill-btn bag-btn" onclick="openBagModal()">🎒 萬物圖鑑</button>
      </div>
    </div>

    <!-- 4 大模式選單 -->
    <div class="game-modes-deck">
      <button class="g-mode-btn active" onclick="setMode('EGG', this)">🥚 開蛋孵化</button>
      <button class="g-mode-btn" onclick="setMode('DOORS', this)">🚪 密室破門</button>
      <button class="g-mode-btn" onclick="setMode('SLAP', this)">🥊 巴掌擊飛</button>
      <button class="g-mode-btn" onclick="setMode('SLOT', this)">🎰 幸運拉霸</button>
    </div>

    <!-- 長輩安心面板 -->
    <div class="elder-helper-banner" id="elder-guide-box">
      <strong>長輩請放心：</strong><br>
      請看孩子點擊單字「聽滿 3 遍」，每題亮滿 3 顆黃燈才算過關！集滿能量即可點中央開獎！
    </div>

    <!-- 核心動態舞台 -->
    <div class="stage-arena">
      <div id="stage-interactive-area" onclick="handleStageAction()"></div>
      <div class="stage-title" id="stage-title-text">幸運開蛋任務</div>
      <div class="stage-sub" id="stage-sub-text">每題必須跟讀「聽滿 3 遍」注滿能量！</div>
      <div class="energy-bar-wrap">
        <div class="energy-bar-fill" id="energy-bar-fill"></div>
      </div>
    </div>

    <!-- 任務牌組 (每題強制聽讀 3 次) -->
    <div class="tasks-deck">
      <div id="words-deck" style="display: flex; flex-direction: column; gap: 6px;"></div>
      
      <!-- 句子卡 -->
      <div class="sentence-card" id="sentence-card">
        <div>
          <div class="sentence-tag">📜 本週通關密碼句</div>
          <div class="sentence-en" id="target-sentence-en"></div>
          <div class="sentence-zh" id="target-sentence-zh"></div>
        </div>
        <div class="repeat-dots-group">
          <div class="repeat-track" id="track-sentence">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          </div>
          <div class="play-btn" onclick="handleSentenceClick()">🔊</div>
        </div>
      </div>
    </div>

  </div>

  <!-- 抽卡開箱 Modal -->
  <div class="modal-overlay" id="loot-modal">
    <div class="modal-box">
      <span class="rarity-pill" id="loot-rarity">神話級 MYTHIC</span>
      <div class="loot-icon" id="loot-icon">🐉</div>
      <div class="loot-name" id="loot-name">彩虹機械龍</div>
      <div class="loot-power" id="loot-power">⚡ 戰鬥力: 999,999</div>
      <div class="loot-quote" id="loot-quote">全服只有 0.1% 的傳奇神獸！</div>
      <div class="grandparent-pass">
        ✨ <strong>今日任務已通關！</strong><br>
        出示這張神寵給阿公阿嬤看，去玩你的 Roblox 吧！
      </div>
      <button class="close-btn" onclick="closeLootModal()">收進萬物圖鑑 🎮</button>
    </div>
  </div>

  <!-- 萬物圖鑑背包 Modal -->
  <div class="modal-overlay" id="bag-modal">
    <div class="modal-box">
      <h3 style="font-size: 1.2rem; color: var(--gold);">🎒 萬物收集圖鑑庫</h3>
      <div style="font-size: 0.78rem; color: var(--text-sub); margin-top: 4px;">
        已解鎖進度：<span id="bag-progress">0</span> / 1,000 種全服圖鑑
      </div>
      <div class="bag-grid" id="bag-grid"></div>
      <button class="close-btn" onclick="closeBagModal()">返回任務</button>
    </div>
  </div>

  <script>
    const ALL_QUESTS = [
      {
        id: "w4",
        label: "第 4 關",
        words: [
          { en: "rain", display: "r · ain", zh: "下雨", hint: "發音重點：ai 發長母音 /eɪ/，拼寫拆為 r + ain。" },
          { en: "weather", display: "wea · ther", zh: "天氣", hint: "音節拆解：wea-（短母音 /ɛ/）+ -ther（咬舌濁音 /ðər/）。" },
          { en: "outside", display: "out · side", zh: "外面", hint: "複合字：out（出去）+ side（邊/面）＝ 外面。" }
        ],
        sentence: {
          en: "It is raining outside.",
          zh: "外面正在下雨。"
        }
      },
      {
        id: "w3",
        label: "第 3 關 (複習)",
        words: [
          { en: "happy", display: "hap · py", zh: "高興的", hint: "雙子音 pp，前母音 a 發蝴蝶音 /æ/。" },
          { en: "school", display: "school", zh: "學校", hint: "ch 在這裡發硬音 /k/，oo 發長母音 /u/。" },
          { en: "friend", display: "friend", zh: "朋友", hint: "ie 在此發短母音 /ɛ/，結尾 d 輕聲釋放。" }
        ],
        sentence: {
          en: "I see my friend at school.",
          zh: "我在學校看到我的朋友。"
        }
      }
    ];

    const RARITY_TIERS = [
      { label: "神話級 MYTHIC", cls: "r-mythic", prefix: "TITANIC", basePower: 800000 },
      { label: "傳奇級 LEGENDARY", cls: "r-legendary", prefix: "GOLDEN", basePower: 50000 },
      { label: "稀有級 RARE", cls: "r-rare", prefix: "CYBER", basePower: 5000 },
      { label: "普通級 COMMON", cls: "r-common", prefix: "BASIC", basePower: 50 }
    ];

    const SPECIES_BASE = [
      { name: "彩虹神龍", icon: "🐉" }, { name: "香蕉狗", icon: "🐕" }, { name: "極地獨角獸", icon: "🦄" },
      { name: "駭客貓", icon: "🐱" }, { name: "馬桶怪", icon: "🚽" }, { name: "生吐司", icon: "🍞" },
      { name: "霸王暴龍", icon: "🦖" }, { name: "爆破西瓜", icon: "🍉" }
    ];

    const FULL_CATALOG = [];
    for (let i = 1; i <= 60; i++) {
      const sp = SPECIES_BASE[(i - 1) % SPECIES_BASE.length];
      const tier = RARITY_TIERS[(i - 1) % RARITY_TIERS.length];
      FULL_CATALOG.push({
        id: `pet_${i}`,
        num: `#${String(i).padStart(4, '0')}`,
        name: `${tier.prefix} ${sp.name}`,
        rarity: tier.label,
        rClass: tier.cls,
        icon: sp.icon,
        power: `⚡ ${(tier.basePower + i * 150).toLocaleString()}`,
        quote: `編號 #${String(i).padStart(4, '0')}，限定神寵！`
      });
    }

    let currentQuestIdx = 0;
    let currentMode = 'EGG';
    
    // 每題必須「跟讀聽滿 3 遍」次數紀錄
    let itemRepeats = { 'w-0': 0, 'w-1': 0, 'w-2': 0, 'sentence': 0 };
    let chargedSet = new Set();
    let unlockedPets = JSON.parse(localStorage.getItem("unlocked_catalog_ids") || '["pet_1"]');
    let eggTapCount = 0;

    function initQuestNav() {
      const box = document.getElementById("quest-nav-box");
      box.innerHTML = "";
      ALL_QUESTS.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = `q-btn ${idx === currentQuestIdx ? 'active' : ''}`;
        btn.innerText = q.label;
        btn.onclick = () => switchQuest(idx);
        box.appendChild(btn);
      });
    }

    function switchQuest(idx) {
      currentQuestIdx = idx;
      initQuestNav();
      loadQuest(ALL_QUESTS[idx]);
    }

    function loadQuest(quest) {
      itemRepeats = { 'w-0': 0, 'w-1': 0, 'w-2': 0, 'sentence': 0 };
      chargedSet.clear();
      eggTapCount = 0;
      updateProgress();

      document.getElementById("target-sentence-en").innerText = quest.sentence.en;
      document.getElementById("target-sentence-zh").innerText = quest.sentence.zh;
      document.getElementById("sentence-card").classList.remove("charged");
      updateTrackUI('sentence');

      const wordsBox = document.getElementById("words-deck");
      wordsBox.innerHTML = "";
      quest.words.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "task-card";
        card.id = `card-word-${idx}`;
        card.innerHTML = `
          <div class="task-row">
            <div>
              <div class="word-en">${item.display}</div>
              <div class="word-zh">${item.zh}</div>
            </div>
            <div class="repeat-dots-group">
              <div class="repeat-track" id="track-w-${idx}">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
              </div>
              <div class="play-btn" onclick="handleWordClick(${idx}, '${item.en}')">🔊</div>
            </div>
          </div>
          <div class="hint-trigger" onclick="toggleHint(this)">💡 音素提示與拆解</div>
          <div class="hint-drawer">${item.hint}</div>
        `;
        wordsBox.appendChild(card);
      });

      renderCurrentModeStage();
    }

    function toggleHint(btn) {
      const drawer = btn.nextElementSibling;
      const isOpen = drawer.classList.toggle("open");
      btn.innerText = isOpen ? "收合提示" : "💡 音素提示與拆解";
    }

    function setMode(modeKey, btn) {
      currentMode = modeKey;
      document.querySelectorAll(".g-mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      eggTapCount = 0;
      renderCurrentModeStage();
    }

    function renderCurrentModeStage() {
      const area = document.getElementById("stage-interactive-area");
      const title = document.getElementById("stage-title-text");
      const sub = document.getElementById("stage-sub-text");
      const isReady = chargedSet.size === 4;

      if (currentMode === 'EGG') {
        area.innerHTML = `<div class="egg-box ${isReady ? 'ready' : ''}" id="egg-actor">${isReady ? '🔨 敲破' : '🔒 待蓄力'}</div>`;
        title.innerText = isReady ? "🔥 能量充飽！連點 3 下敲蛋！" : "幸運神蛋孵化";
        sub.innerText = isReady ? "快點擊敲蛋！" : "每題必須跟讀聽滿 3 遍！";

      } else if (currentMode === 'DOORS') {
        let doorsHtml = '<div style="display:flex; gap:8px;">';
        for (let i = 1; i <= 4; i++) {
          const isUnlocked = chargedSet.size >= i;
          const isCurrent = chargedSet.size + 1 === i;
          doorsHtml += `
            <div class="corridor-door ${isUnlocked ? 'unlocked' : ''} ${isCurrent ? 'current' : ''}">
              <div style="font-size:0.65rem; color:#facc15;">DOOR</div>
              <div style="font-size:0.95rem; font-weight:900;">0${i}</div>
              <div style="font-size:1.1rem;">${isUnlocked ? '🚪' : '🔒'}</div>
            </div>
          `;
        }
        doorsHtml += '</div>';
        area.innerHTML = doorsHtml;
        title.innerText = isReady ? "🚪 4 道大門全開！點擊逃脫！" : `密室逃脫破門 (${chargedSet.size} / 4)`;
        sub.innerText = isReady ? "點擊衝出房間！" : "每解鎖一題推進一道安全門！";

      } else if (currentMode === 'SLAP') {
        area.innerHTML = `
          <div style="position:relative; width:120px; height:100px; display:flex; align-items:center; justify-content:center;">
            <div class="monster-target" id="monster-actor">${isReady ? '😱' : '🤪'}</div>
            <div id="glove-actor" style="position:absolute; right:-20px; font-size:3rem; opacity:0; transition:all 0.15s;">🥊</div>
          </div>
        `;
        title.innerText = isReady ? "🥊 怒氣條蓄滿！點擊揍飛！" : "怪獸挑戰擂台";
        sub.innerText = isReady ? "一拳把它轟出地球！" : "每題聽讀 3 次累積出拳怒氣！";

      } else if (currentMode === 'SLOT') {
        area.innerHTML = `
          <div class="slot-machine-box">
            <div class="slot-reel" id="reel-1">💎</div>
            <div class="slot-reel" id="reel-2">❓</div>
            <div class="slot-reel" id="reel-3">💎</div>
          </div>
        `;
        title.innerText = isReady ? "🎰 代幣集齊！點擊拉桿開獎！" : "幸運 777 拉霸機";
        sub.innerText = isReady ? "大獎即將滾出！" : "每題跟讀完成獲得 1 枚代幣！";
      }
    }

    // 聽讀三次邏輯
    function handleWordClick(idx, word) {
      const key = `w-${idx}`;
      playCoinSound();
      speakTTS(word);

      itemRepeats[key] = Math.min(itemRepeats[key] + 1, 3);
      updateTrackUI(key);

      if (itemRepeats[key] === 3 && !chargedSet.has(key)) {
        chargedSet.add(key);
        document.getElementById(`card-word-${idx}`).classList.add("charged");
        updateProgress();
      }
    }

    function handleSentenceClick() {
      const key = "sentence";
      const sentence = ALL_QUESTS[currentQuestIdx].sentence.en;
      playCoinSound();
      speakTTS(sentence);

      itemRepeats[key] = Math.min(itemRepeats[key] + 1, 3);
      updateTrackUI(key);

      if (itemRepeats[key] === 3 && !chargedSet.has(key)) {
        chargedSet.add(key);
        document.getElementById("sentence-card").classList.add("charged");
        updateProgress();
      }
    }

    function updateTrackUI(key) {
      const track = document.getElementById(`track-${key}`);
      if (!track) return;
      const count = itemRepeats[key] || 0;
      const dots = track.querySelectorAll(".dot");
      dots.forEach((dot, idx) => {
        dot.classList.toggle("active", idx < count);
      });
    }

    function updateProgress() {
      const percent = (chargedSet.size / 4) * 100;
      document.getElementById("energy-bar-fill").style.width = `${percent}%`;
      renderCurrentModeStage();
      if (chargedSet.size === 4) playFanfareSound();
    }

    function handleStageAction() {
      if (chargedSet.size < 4) {
        alert("還沒完成喔！每道題目必須跟讀聽滿 3 遍，上方集滿 4 顆能量才能開獎！");
        return;
      }

      if (currentMode === 'EGG') {
        eggTapCount++;
        playCoinSound();
        const egg = document.getElementById("egg-actor");
        egg.style.transform = `scale(${1 + eggTapCount * 0.1}) rotate(${eggTapCount % 2 ? 8 : -8}deg)`;
        if (eggTapCount < 3) {
          document.getElementById("stage-title-text").innerText = `💥 還差 ${3 - eggTapCount} 下！用力敲！`;
          return;
        }
        executeLootDrop();

      } else if (currentMode === 'DOORS') {
        playFanfareSound();
        document.getElementById("stage-title-text").innerText = "🏃‍♂️ 成功逃出大門！";
        setTimeout(executeLootDrop, 400);

      } else if (currentMode === 'SLAP') {
        const glove = document.getElementById("glove-actor");
        const monster = document.getElementById("monster-actor");
        glove.style.opacity = '1';
        glove.style.transform = 'translateX(-50px) scale(1.2)';
        playChestSound();
        setTimeout(() => {
          monster.style.transform = 'scale(0) rotate(720deg) translate(-200px, -150px)';
          monster.style.transition = 'all 0.5s ease-in';
          setTimeout(executeLootDrop, 500);
        }, 120);

      } else if (currentMode === 'SLOT') {
        const r1 = document.getElementById("reel-1");
        const r2 = document.getElementById("reel-2");
        const r3 = document.getElementById("reel-3");
        r1.classList.add("spinning"); r2.classList.add("spinning"); r3.classList.add("spinning");
        playCoinSound();
        setTimeout(() => {
          r1.classList.remove("spinning"); r1.innerText = "7️⃣";
          r2.classList.remove("spinning"); r2.innerText = "7️⃣";
          r3.classList.remove("spinning"); r3.innerText = "7️⃣";
          executeLootDrop();
        }, 900);
      }
    }

    function executeLootDrop() {
      triggerWhiteFlash();
      playChestSound();
      launchConfetti();

      let pool = FULL_CATALOG;
      const unowned = FULL_CATALOG.filter(p => !unlockedPets.includes(p.id));
      if (unowned.length > 0 && Math.random() < 0.75) pool = unowned;
      const loot = pool[Math.floor(Math.random() * pool.length)];

      if (!unlockedPets.includes(loot.id)) {
        unlockedPets.push(loot.id);
        localStorage.setItem("unlocked_catalog_ids", JSON.stringify(unlockedPets));
      }

      const badge = document.getElementById("loot-rarity");
      badge.innerText = `${loot.num} · ${loot.rarity}`;
      badge.className = `rarity-pill ${loot.rClass}`;
      document.getElementById("loot-icon").innerText = loot.icon;
      document.getElementById("loot-name").innerText = loot.name;
      document.getElementById("loot-power").innerText = loot.power;
      document.getElementById("loot-quote").innerText = loot.quote;

      document.getElementById("loot-modal").style.display = "flex";
    }

    function closeLootModal() {
      document.getElementById("loot-modal").style.display = "none";
      eggTapCount = 0;
      renderCurrentModeStage();
    }

    function openBagModal() {
      const box = document.getElementById("bag-grid");
      box.innerHTML = "";
      document.getElementById("bag-progress").innerText = unlockedPets.length;

      FULL_CATALOG.forEach(p => {
        const isUnlocked = unlockedPets.includes(p.id);
        const cell = document.createElement("div");
        cell.className = `bag-cell ${isUnlocked ? 'unlocked' : 'locked'}`;
        cell.innerHTML = `
          <div class="bag-num">${p.num}</div>
          <div class="bag-cell-icon">${isUnlocked ? p.icon : '❓'}</div>
          <div class="bag-cell-name">${isUnlocked ? p.name : '未解鎖'}</div>
        `;
        box.appendChild(cell);
      });

      document.getElementById("bag-modal").style.display = "flex";
    }

    function closeBagModal() {
      document.getElementById("bag-modal").style.display = "none";
    }

    function toggleElderGuide() {
      const banner = document.getElementById("elder-guide-box");
      const btn = document.getElementById("elder-btn");
      const isShow = banner.classList.toggle("show");
      btn.classList.toggle("active", isShow);
    }

    function speakTTS(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.8;
        window.speechSynthesis.speak(utter);
      }
    }

    function triggerWhiteFlash() {
      const flash = document.getElementById("flash-overlay");
      flash.style.opacity = "0.9";
      setTimeout(() => { flash.style.opacity = "0"; }, 250);
    }

    function playCoinSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(987.77, ctx.currentTime);
        osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function playFanfareSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.25);
          osc.start(ctx.currentTime + i * 0.1);
          osc.stop(ctx.currentTime + i * 0.1 + 0.25);
        });
      } catch (e) {}
    }

    function playChestSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [440, 554.37, 659.25, 880, 1108.73].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.07);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.07 + 0.3);
          osc.start(ctx.currentTime + idx * 0.07);
          osc.stop(ctx.currentTime + idx * 0.07 + 0.3);
        });
      } catch (e) {}
    }

    function launchConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ["#facc15", "#38bdf8", "#22c55e", "#ec4899", "#a855f7"];
      for (let i = 0; i < 90; i++) {
        pieces.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          r: Math.random() * 6 + 4,
          dx: (Math.random() - 0.5) * 14,
          dy: (Math.random() - 0.8) * 16,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.dx;
          p.y += p.dy;
          p.dy += 0.35;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        });
        frame++;
        if (frame < 110) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    window.addEventListener("DOMContentLoaded", () => {
      initQuestNav();
      loadQuest(ALL_QUESTS[0]);
    });
  </script>
</body>
</html>
