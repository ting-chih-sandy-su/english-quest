<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PHONICS CHALLENGE: 聽力解碼特訓</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --gold: #facc15;
      --cyan: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --border: #334155;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 15%, #1e293b 0%, #070a13 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 18px 14px 44px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .app-viewport {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .user-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 800;
    }
    .user-tag {
      color: var(--cyan);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .quest-select-wrap {
      flex: 1;
      position: relative;
    }

    .quest-dropdown {
      width: 100%;
      background: #1e293b;
      border: 2px solid var(--border);
      color: #38bdf8;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 14px;
      outline: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 18px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .pill-btn {
      background: #1e293b;
      border: 1.5px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .pill-btn.bag-btn { 
      background: linear-gradient(135deg, #ec4899, #be185d); 
      border-color: #f472b6;
      box-shadow: 0 2px 8px rgba(236, 72, 153, 0.3);
    }
    .pill-btn.parent-btn { 
      background: rgba(34, 197, 94, 0.15); 
      border-color: #22c55e; 
      color: #86efac; 
    }
    .pill-btn.parent-btn.active { 
      background: #22c55e; 
      color: #052e16; 
    }

    .parent-overview-panel {
      display: none;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid var(--green);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 0.92rem;
      color: #e2e8f0;
      line-height: 1.6;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .parent-overview-panel.show { display: block; }
    .parent-overview-panel h4 { color: #86efac; font-size: 1rem; margin-bottom: 8px; }

    .challenge-arena {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      gap: 14px;
    }

    .stage-badge {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--gold);
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.3);
      padding: 6px 16px;
      border-radius: 999px;
    }

    .challenge-title {
      font-size: 1.25rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.45;
      color: #f1f5f9;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .listen-counter-pill {
      font-size: 0.9rem;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1.5px solid var(--cyan);
      border-radius: 999px;
      padding: 6px 16px;
    }

    .audio-speaker-pulse {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), #0284c7);
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.5);
      margin: 4px 0 8px;
      transition: transform 0.15s;
    }
    .audio-speaker-pulse:active { transform: scale(0.92); }
    .audio-speaker-pulse.playing {
      animation: pulsePlay 0.8s infinite alternate;
      border-color: var(--gold);
      box-shadow: 0 0 32px rgba(250, 204, 21, 0.7);
    }

    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-top: 6px;
    }
    .choices-grid.three-cols {
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .choice-card-btn {
      background: #090e1a;
      border: 2px solid var(--border);
      color: #fff;
      min-height: 64px;
      padding: 12px 10px;
      border-radius: 18px;
      font-size: 1.35rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .choice-card-btn:active { transform: scale(0.96); }
    .choice-card-btn.locked {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(1);
      pointer-events: none;
      font-size: 1.15rem;
    }
    .choice-card-btn.correct { 
      background: var(--green); 
      border-color: #fff; 
      color: #052e16; 
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.6);
    }
    .choice-card-btn.wrong { 
      background: var(--red); 
      border-color: #fff; 
      animation: shakeBtn 0.3s; 
    }

    @keyframes shakeBtn {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .ready-gacha-btn {
      width: 100%;
      background: linear-gradient(180deg, #f59e0b, #d97706);
      border: 3px solid #fef08a;
      color: #000;
      padding: 18px;
      border-radius: 20px;
      font-size: 1.35rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.7);
      animation: pulseGacha 0.8s infinite alternate;
      margin: 8px 0;
    }
    @keyframes pulseGacha {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    .progress-box {
      width: 100%;
      margin-top: 6px;
    }
    .progress-status-box {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 10px;
      background: #090e1a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      transition: width 0.3s ease;
    }

    .reference-deck {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: -2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .word-listen-tracker-badge {
      font-size: 0.8rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--cyan);
    }

    .ref-cards-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ref-card {
      background: rgba(30, 41, 59, 0.75);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s;
    }
    .ref-card.listened {
      border-color: rgba(34, 197, 94, 0.6);
      background: rgba(20, 83, 45, 0.2);
    }
    .ref-card-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .ref-en { font-size: 1.22rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    .ref-zh { font-size: 0.92rem; color: var(--text-sub); font-weight: 700; line-height: 1.4; }
    .ref-hint { color: #38bdf8; font-size: 0.86rem; }
    
    .slow-audio-btn {
      background: rgba(56, 189, 248, 0.12);
      border: 1.5px solid var(--cyan);
      color: var(--cyan);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .slow-audio-btn.checked {
      background: var(--green);
      border-color: #86efac;
      color: #052e16;
    }

    .article-full-card {
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: all 0.3s;
    }
    .article-tag { font-size: 0.82rem; font-weight: 800; color: var(--gold); }
    
    .article-reading-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 1.02rem;
      line-height: 1.6;
    }

    .paragraph-block {
      padding: 8px 10px;
      border-radius: 10px;
      transition: all 0.3s ease;
      color: #64748b;
    }
    .paragraph-block.highlighted {
      background: rgba(250, 204, 21, 0.18);
      border-left: 4px solid var(--gold);
      color: #f8fafc;
      font-weight: 700;
    }

    .article-btn-action {
      width: 100%;
      background: linear-gradient(180deg, var(--gold), #ca8a04);
      color: #0b1120;
      border: none;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 0.98rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 0 #854d0e;
    }
    .article-btn-action.playing {
      background: #38bdf8;
      box-shadow: 0 2px 0 #0284c7;
      animation: pulsePlay 1s infinite alternate;
    }

    @keyframes pulsePlay {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(180deg, #1e293b, #090e1a);
      border: 3px solid var(--gold);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 0 50px rgba(250, 204, 21, 0.4);
    }
    .report-card-wrap {
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px dashed var(--green);
      border-radius: 16px;
      padding: 14px 16px;
      text-align: left;
      margin: 14px 0;
      font-size: 0.9rem;
      line-height: 1.65;
    }
    .report-row { display: flex; justify-content: space-between; }
    .report-badge { color: #86efac; font-weight: 800; }
    .close-btn {
      width: 100%;
      background: linear-gradient(180deg, var(--green), #15803d);
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
    }

    .bag-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-height: 48vh;
      overflow-y: auto;
      margin: 16px 0;
    }
    .bag-cell {
      background: #0f172a;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
    }
    .bag-cell.unlocked { border-color: var(--gold); background: #1e293b; }
    .bag-cell.locked { opacity: 0.35; filter: grayscale(1); }

    #flash-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.15s;
    }
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 101;
    }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="app-viewport">
    
    <div class="user-info-bar">
      <span>🎯 語音冒險任務</span>
      <span class="user-tag" onclick="changeStudentName()">
        🧑‍🎓 特訓員：<span id="current-user-display" style="text-decoration: underline;">載入中...</span> ✏️
      </span>
    </div>

    <div class="control-header">
      <div class="quest-select-wrap">
        <select class="quest-dropdown" id="quest-dropdown-select" onchange="switchQuestFromSelect(this.value)"></select>
      </div>
      <div class="header-actions">
        <button class="pill-btn parent-btn" id="parent-toggle-btn" onclick="toggleParentPanel()">📋 大綱</button>
        <button class="pill-btn bag-btn" onclick="openBagModal()">🎒 圖鑑</button>
      </div>
    </div>

    <div class="parent-overview-panel" id="parent-panel">
      <h4>📌 本週學習目標（系統自動生成）</h4>
      <div id="parent-overview-content"></div>
    </div>

    <div class="challenge-arena" id="main-challenge-arena"></div>

    <div class="reference-deck">
      <div class="section-title">
        <span>🔤 本段核心單字拆解（請全部點聽完成）：</span>
        <span class="word-listen-tracker-badge" id="word-tracker-badge">進度 0 / 0</span>
      </div>
      <div class="ref-cards-container" id="ref-cards-box"></div>

      <div class="section-title">
        <span>📖 整篇完整課文（螢光筆標記當前段落）：</span>
      </div>
      <div class="article-full-card" id="article-card-box">
        <div>
          <div class="article-tag" id="article-main-title">全篇閱讀對照</div>
          <div class="article-reading-container" id="article-paragraphs-box"></div>
        </div>
        <button class="article-btn-action" id="article-action-btn" onclick="handleArticleAudioClick()">
          <span id="article-btn-icon">🎧</span>
          <span id="article-btn-text">朗讀本段錄音 (MP3)</span>
        </button>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="loot-modal">
    <div class="modal-box">
      <span style="display:inline-block; padding:4px 16px; border-radius:999px; font-weight:800; font-size:0.85rem; background:linear-gradient(90deg,#ec4899,#8b5cf6); color:#fff;" id="loot-rarity">神話級 MYTHIC</span>
      <div style="font-size:4.2rem; margin:10px 0;" id="loot-icon">🐉</div>
      <div style="font-size:1.4rem; font-weight:900;" id="loot-name">彩虹神龍</div>
      <div style="font-size:1rem; color:var(--gold); font-weight:800; margin-bottom:6px;" id="loot-power">⚡ 戰鬥力: 999,999</div>
      
      <div class="report-card-wrap">
        <div style="font-weight:900; color:var(--gold); border-bottom:1px solid #334155; padding-bottom:6px; margin-bottom:8px; font-size:0.95rem;">
          📝 本週課堂複習成效報告單
        </div>
        <div class="report-row"><span>特訓學員：</span><span class="report-badge" id="report-student-name">--</span></div>
        <div class="report-row"><span>1. 音素聽力盲測：</span><span class="report-badge">全數通過 (4/4)</span></div>
        <div class="report-row"><span>2. 核心單字拆解：</span><span class="report-badge">100% 逐字完成</span></div>
        <div style="margin-top:10px; color:#cbd5e1; font-size:0.85rem; border-top:1px dashed #334155; padding-top:8px;">
          👩‍🏫 <strong>老師評語：</strong>孩子今日認真聽辨音素細節，已確實掌握核心讀音，請家長安心給予放鬆時間！
        </div>
      </div>

      <button class="close-btn" onclick="closeLootModal()">收進萬物圖鑑 🎮</button>
    </div>
  </div>

  <div class="modal-overlay" id="bag-modal">
    <div class="modal-box">
      <h3 style="font-size:1.35rem; color:var(--gold);">🎒 4,000 隻全服萬物圖鑑庫</h3>
      <div style="font-size:0.88rem; color:var(--text-sub); margin-top:6px;">
        已解鎖進度：<span id="bag-progress" style="color:var(--gold); font-weight:800;">0</span> / 4,000 種完全獨立神寵
      </div>
      <div class="bag-grid" id="bag-grid"></div>
      <button class="close-btn" onclick="closeBagModal()">返回訓練</button>
    </div>
  </div>

  <script src="quests.js"></script>

  <script>
    const GAS_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbySNVF6K3fjZyUzdd5dGm5YdhSS9yUyooHTqnkmWLD-fHju55sLwXJvSnn7SXf2Ds4rnQ/exec";

    let currentStudentName = localStorage.getItem("phonics_student_name");
    if (!currentStudentName || currentStudentName.trim() === "" || currentStudentName === "孩子" || currentStudentName === "學生") {
      currentStudentName = prompt("🎮 歡迎來到英語特訓！請輸入你的名字：", "特訓員") || "特訓員";
      localStorage.setItem("phonics_student_name", currentStudentName.trim());
    }

    function initUserDisplay() {
      const display = document.getElementById("current-user-display");
      if (display) display.innerText = currentStudentName;
    }

    function changeStudentName() {
      const newName = prompt("請輸入新的特訓員姓名：", currentStudentName);
      if (newName && newName.trim() !== "") {
        currentStudentName = newName.trim();
        localStorage.setItem("phonics_student_name", currentStudentName);
        initUserDisplay();
      }
    }

    // ─── 4,000 隻全獨立程序化神寵矩陣 (20 前綴 × 10 屬性 × 20 本體 = 4,000) ───
    const TITLES_POOL = [
      "永恆", "滅世", "星穹", "極光", "太古", "狂暴", "深淵", "神聖", "天啟", "蒼穹",
      "逆命", "幻影", "絕境", "超弦", "至尊", "量子", "烈陽", "霜月", "幽冥", "森羅"
    ]; // 20
    const ELEMENTS_POOL = [
      "虛空", "混沌", "烈焰", "寒冰", "雷霆", "時空", "暗黑", "黃金", "翡翠", "終焉"
    ]; // 10
    const BASES_POOL = [
      { name: "彩虹神龍", icon: "🐉" },
      { name: "香蕉靈犬", icon: "🐕" },
      { name: "星芒獨角獸", icon: "🦄" },
      { name: "駭客靈貓", icon: "🐱" },
      { name: "超能馬桶怪", icon: "🚽" },
      { name: "暴食生吐司", icon: "🍞" },
      { name: "霸王暴龍", icon: "🦖" },
      { name: "爆破西瓜精", icon: "🍉" },
      { name: "機械泰坦巨猿", icon: "🦍" },
      { name: "不死火鳥", icon: "🦅" },
      { name: "深海巨鯊", icon: "🦈" },
      { name: "劇毒巨蠍", icon: "🦂" },
      { name: "外星異形蜂", icon: "🐝" },
      { name: "裝甲犀牛", icon: "🦏" },
      { name: "暗夜吸血蝠", icon: "🦇" },
      { name: "遠古猛獁象", icon: "🦣" },
      { name: "熔岩火狐", icon: "🦊" },
      { name: "極地雪狼", icon: "🐺" },
      { name: "星際機械人", icon: "🤖" },
      { name: "克蘇魯巨章", icon: "🐙" }
    ]; // 20

    const TOTAL_PETS_COUNT = TITLES_POOL.length * ELEMENTS_POOL.length * BASES_POOL.length; // 4,000

    // 數學映射：O(1) 根據 Index 取得第 i 隻的完整屬性（完全不佔記憶體）
    function getPetByIndex(idx) {
      const bIdx = idx % BASES_POOL.length;
      const rem1 = Math.floor(idx / BASES_POOL.length);
      const eIdx = rem1 % ELEMENTS_POOL.length;
      const tIdx = Math.floor(rem1 / ELEMENTS_POOL.length) % TITLES_POOL.length;

      const base = BASES_POOL[bIdx];
      const elem = ELEMENTS_POOL[eIdx];
      const title = TITLES_POOL[tIdx];

      const numStr = `#${String(idx + 1).padStart(4, '0')}`;
      const name = `${title}·${elem}·${base.name}`;
      const rarity = (idx % 25 === 0) ? "神話級 MYTHIC" : (idx % 5 === 0) ? "傳奇級 LEGENDARY" : "稀有級 RARE";
      const power = `⚡ ${(80000 + (idx + 1) * 350).toLocaleString()}`;

      return {
        id: `pet_${idx + 1}`,
        num: numStr,
        name: name,
        icon: base.icon,
        rarity: rarity,
        power: power
      };
    }

    const GHOST_WORDS_POOL = ["pizza", "monkey", "banana", "robot", "guitar", "castle", "tiger", "rocket"];

    let currentQuestIdx = 0;
    let currentStage = 0;
    let currentTargetWord = "";
    let currentTargetAudio = "";
    let unlockedPets = JSON.parse(localStorage.getItem("unlocked_catalog_ids") || '["pet_1"]');
    
    let currentListenCount = 0;
    let isAudioPlaying = false;
    let articleAudioElement = null;

    let listenedWordsSet = new Set();

    function initQuestDropdown() {
      const select = document.getElementById("quest-dropdown-select");
      select.innerHTML = "";
      ALL_QUESTS.forEach((q, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.innerText = q.label;
        if (idx === currentQuestIdx) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function switchQuestFromSelect(idxStr) {
      currentQuestIdx = parseInt(idxStr, 10);
      startQuest(ALL_QUESTS[currentQuestIdx]);
    }

    function startQuest(quest) {
      currentStage = 0;
      listenedWordsSet.clear();
      if (articleAudioElement) {
        articleAudioElement.pause();
        articleAudioElement = null;
      }
      renderAllModules(quest);
      generateChallengeStage();
    }

    function renderAllModules(quest) {
      const wordsList = quest.words.map(w => `<b>${w.en}</b> (${w.zh})`).join("、");
      const autoOverview = `
        • <b>重點詞彙</b>：${wordsList}<br>
        • <b>當前段落語句</b>：${quest.sentence.en}<br>
        • <b>驗收目標</b>：下方核心單字全員點聽＋聽音盲測 4 關全數通過。
      `;
      document.getElementById("parent-overview-content").innerHTML = autoOverview;

      const box = document.getElementById("ref-cards-box");
      box.innerHTML = "";
      quest.words.forEach((item, wIdx) => {
        const card = document.createElement("div");
        card.className = "ref-card";
        card.id = `ref-card-${wIdx}`;
        card.innerHTML = `
          <div class="ref-card-left">
            <div class="ref-en">${item.display}</div>
            <div class="ref-zh">${item.zh} · <span class="ref-hint">${item.hint}</span></div>
          </div>
          <button class="slow-audio-btn" id="word-btn-${wIdx}" onclick="handleWordItemClick('${item.audio || ''}', '${item.en}', ${wIdx})">
            🐢 嘴型拆解
          </button>
        `;
        box.appendChild(card);
      });

      updateWordTrackerBadge(quest);

      const paragraphsBox = document.getElementById("article-paragraphs-box");
      paragraphsBox.innerHTML = "";

      const groupData = (typeof FULL_ARTICLE_TEXTS !== "undefined" && quest.articleGroup) ? FULL_ARTICLE_TEXTS[quest.articleGroup] : null;

      if (groupData) {
        document.getElementById("article-main-title").innerText = groupData.title;
        groupData.paragraphs.forEach((p, pIdx) => {
          const pEl = document.createElement("div");
          const isCurrent = (p.id === quest.id);
          pEl.className = `paragraph-block ${isCurrent ? 'highlighted' : ''}`;
          pEl.innerHTML = `<b>P${pIdx + 1}.</b> ${p.text}`;
          paragraphsBox.appendChild(pEl);
        });
      } else {
        document.getElementById("article-main-title").innerText = "課文對照閱讀";
        paragraphsBox.innerHTML = `<div class="paragraph-block highlighted">${quest.sentence.en}</div>`;
      }
    }

    function updateWordTrackerBadge(quest) {
      const badge = document.getElementById("word-tracker-badge");
      if (badge) {
        badge.innerText = `單字拆解進度：${listenedWordsSet.size} / ${quest.words.length}`;
        if (listenedWordsSet.size >= quest.words.length) {
          badge.style.color = "#86efac";
          badge.style.borderColor = "var(--green)";
        } else {
          badge.style.color = "#38bdf8";
          badge.style.borderColor = "var(--cyan)";
        }
      }
    }

    function handleWordItemClick(audioPath, wordEn, idx) {
      const quest = ALL_QUESTS[currentQuestIdx];
      const btn = document.getElementById(`word-btn-${idx}`);
      const card = document.getElementById(`ref-card-${idx}`);

      playSmartAudio(audioPath, wordEn, 0.55, () => {
        listenedWordsSet.add(wordEn);
        if (btn) {
          btn.innerText = "✅ 已聽過";
          btn.classList.add("checked");
        }
        if (card) {
          card.classList.add("listened");
        }
        updateWordTrackerBadge(quest);
        if (currentStage >= 4) {
          generateChallengeStage();
        }
      });
    }

    function toggleParentPanel() {
      const panel = document.getElementById("parent-panel");
      const btn = document.getElementById("parent-toggle-btn");
      const isShow = panel.classList.toggle("show");
      btn.classList.toggle("active", isShow);
    }

    function handleArticleAudioClick() {
      const quest = ALL_QUESTS[currentQuestIdx];
      const audioPath = quest.sentence.audio;
      const btn = document.getElementById("article-action-btn");
      const icon = document.getElementById("article-btn-icon");
      const text = document.getElementById("article-btn-text");

      const markAsFinished = () => {
        btn.className = "article-btn-action";
        icon.innerText = "🎧";
        text.innerText = "再聽一次";
      };

      if (audioPath && audioPath.trim() !== "") {
        if (articleAudioElement) {
          articleAudioElement.pause();
          articleAudioElement = null;
        }

        const audio = new Audio(audioPath);
        articleAudioElement = audio;
        
        btn.className = "article-btn-action playing";
        icon.innerText = "⏳";
        text.innerText = "朗讀中...";

        audio.play().then(() => {
          audio.onended = markAsFinished;
        }).catch(err => {
          speakTTS(quest.sentence.en, 0.8, markAsFinished);
        });
      } else {
        btn.className = "article-btn-action playing";
        icon.innerText = "⏳";
        text.innerText = "朗讀中...";
        speakTTS(quest.sentence.en, 0.8, markAsFinished);
      }
    }

    function generateChallengeStage() {
      const quest = ALL_QUESTS[currentQuestIdx];
      const arena = document.getElementById("main-challenge-arena");
      currentListenCount = 0;

      if (currentStage >= 4) {
        const remainingWords = quest.words.length - listenedWordsSet.size;

        if (remainingWords > 0) {
          arena.innerHTML = `
            <div class="stage-badge" style="color:#f59e0b; border-color:#f59e0b;">⚠ 聽力通關，尚有單字未聽！</div>
            <div class="challenge-title" style="font-size:1.05rem; line-height:1.45;">
              還差 <span style="color:var(--gold); font-size:1.3rem;">${remainingWords}</span> 個核心單字！<br>
              請到下方將每個「🐢 嘴型拆解」點聽完即可開箱！
            </div>
            <div style="font-size:3.2rem; margin:10px 0;">🔒</div>
          `;
          return;
        }

        arena.innerHTML = `
          <div class="stage-badge">🎉 聽力驗收與單字全數達標！</div>
          <div class="challenge-title" style="color:var(--gold); font-size:1.35rem;">🔥 神秘寶箱能量已滿！</div>
          <button class="ready-gacha-btn" onclick="executeVictory()">🎁 點擊狂暴開箱抽神寵！</button>
        `;
        return;
      }

      const isOddOneOut = currentStage === 3;
      const neededListenCount = isOddOneOut ? 1 : 2;

      arena.innerHTML = `
        <div class="stage-badge" id="stage-level-tag">${isOddOneOut ? 'FINAL STAGE · 段落聽力抓鬼' : `STAGE ${currentStage + 1} / 4 · 單字音素盲測`}</div>
        <div class="challenge-title" id="challenge-prompt">${isOddOneOut ? '點擊大喇叭聽本段課文！找出哪一個單字「沒出現在段落」中？' : '點擊大喇叭，聽滿 2 遍解鎖選項！'}</div>
        <div class="listen-counter-pill" id="listen-counter">🎧 聆聽解鎖進度：0 / ${neededListenCount} 遍</div>
        <div class="audio-speaker-pulse" id="stage-speaker" onclick="handleChallengeSpeakerClick(${neededListenCount})">🔊</div>
        <div class="choices-grid ${isOddOneOut ? 'three-cols' : ''}" id="choices-container"></div>
        <div class="progress-box">
          <div class="progress-status-box">
            <span>驗收進度</span>
            <span id="progress-text">${currentStage} / 4 關</span>
          </div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progress-fill" style="width:${(currentStage/4)*100}%"></div>
          </div>
        </div>
      `;

      const choicesBox = document.getElementById("choices-container");

      if (currentStage < 3) {
        const wordData = quest.words[currentStage];
        currentTargetWord = wordData.en;
        currentTargetAudio = wordData.audio || "";

        const options = Math.random() > 0.5 ? 
          [ { text: wordData.en, isCorrect: true }, { text: wordData.distractor, isCorrect: false } ] :
          [ { text: wordData.distractor, isCorrect: false }, { text: wordData.en, isCorrect: true } ];

        options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "choice-card-btn locked";
          btn.innerText = "🔒 請先聽";
          btn.dataset.text = opt.text;
          btn.onclick = () => checkAnswer(opt.isCorrect, btn);
          choicesBox.appendChild(btn);
        });

      } else if (currentStage === 3) {
        currentTargetWord = quest.sentence.en;
        currentTargetAudio = quest.sentence.audio || "";

        const ghostWord = GHOST_WORDS_POOL[Math.floor(Math.random() * GHOST_WORDS_POOL.length)];
        const presentWord1 = quest.words[0].en;
        const presentWord2 = quest.words[1].en;

        const oddChoices = [
          { text: ghostWord, isCorrect: true },
          { text: presentWord1, isCorrect: false },
          { text: presentWord2, isCorrect: false }
        ].sort(() => Math.random() - 0.5);

        oddChoices.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "choice-card-btn locked";
          btn.innerText = "🔒 請先聽";
          btn.dataset.text = opt.text;
          btn.onclick = () => checkOddAnswer(opt.isCorrect, btn, ghostWord);
          choicesBox.appendChild(btn);
        });
      }
    }

    function handleChallengeSpeakerClick(neededCount) {
      if (isAudioPlaying) return;
      isAudioPlaying = true;

      const speaker = document.getElementById("stage-speaker");
      speaker.classList.add("playing");

      playSmartAudio(currentTargetAudio, currentTargetWord, 0.75, () => {
        isAudioPlaying = false;
        speaker.classList.remove("playing");
        currentListenCount++;

        const counter = document.getElementById("listen-counter");
        if (counter) counter.innerText = `🎧 聆聽解鎖進度：${currentListenCount} / ${neededCount} 遍`;

        if (currentListenCount >= neededCount) {
          document.querySelectorAll(".choice-card-btn").forEach(btn => {
            btn.classList.remove("locked");
            btn.innerText = btn.dataset.text;
          });
          const prompt = document.getElementById("challenge-prompt");
          if (currentStage === 3) {
            prompt.innerText = "抓鬼時刻！哪一個單字「沒出現在段落」中？";
          } else {
            prompt.innerText = "選項已解鎖！哪一個才是目標字？";
          }
          if (counter) {
            counter.innerText = "✅ 已聽滿！請在下方選擇答案";
            counter.style.borderColor = "var(--green)";
            counter.style.color = "#86efac";
          }
        }
      });
    }

    function checkAnswer(isCorrect, btnElement) {
      if (isCorrect) {
        btnElement.classList.add("correct");
        playCoinSound();
        currentStage++;
        setTimeout(generateChallengeStage, 400);
      } else {
        btnElement.classList.add("wrong");
        playBuzzerSound();
        alert("❌ 聽錯了！發音不對喔！\n\n答案已重新鎖定，必須重新聽滿 2 遍才能再次作答！請用心聽！");
        generateChallengeStage();
      }
    }

    function checkOddAnswer(isCorrect, btnElement, ghostWord) {
      if (isCorrect) {
        btnElement.classList.add("correct");
        playFanfareSound();
        currentStage++;
        setTimeout(generateChallengeStage, 400);
      } else {
        btnElement.classList.add("wrong");
        playBuzzerSound();
        alert(`❌ 抓錯鬼了！這個字在段落裡「有出現」喔！\n\n答案已重新鎖定，請再聽一次找出誰是冒牌貨！`);
        generateChallengeStage();
      }
    }

    function executeVictory() {
      triggerWhiteFlash();
      playChestSound();
      launchConfetti();

      const quest = ALL_QUESTS[currentQuestIdx];
      // 從 4,000 隻全獨立池中隨機抽中一隻
      const randomIdx = Math.floor(Math.random() * TOTAL_PETS_COUNT);
      const loot = getPetByIndex(randomIdx);

      if (!unlockedPets.includes(loot.id)) {
        unlockedPets.push(loot.id);
        localStorage.setItem("unlocked_catalog_ids", JSON.stringify(unlockedPets));
      }

      if (GAS_SUBMIT_URL && GAS_SUBMIT_URL.trim() !== "") {
        const payload = JSON.stringify({
          studentName: currentStudentName,
          questLabel: quest.label,
          phonicsScore: "4/4 全數通過",
          articleStatus: `${listenedWordsSet.size}/${quest.words.length} 單字聽畢`,
          petName: `${loot.num} ${loot.name} (${loot.rarity})`
        });

        fetch(GAS_SUBMIT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload
        }).then(() => {
          console.log(`紀錄已送出：學員【${currentStudentName}】`);
        }).catch(err => console.error("回傳試算表失敗:", err));
      }

      document.getElementById("report-student-name").innerText = currentStudentName;
      document.getElementById("loot-rarity").innerText = `${loot.num} · ${loot.rarity}`;
      document.getElementById("loot-icon").innerText = loot.icon;
      document.getElementById("loot-name").innerText = loot.name;
      document.getElementById("loot-power").innerText = loot.power;

      document.getElementById("loot-modal").style.display = "flex";
    }

    function closeLootModal() {
      document.getElementById("loot-modal").style.display = "none";
      currentStage = 0;
      generateChallengeStage();
    }

    function playSmartAudio(audioPath, fallbackText, rate = 0.8, onEndedCallback = null) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      if (audioPath && audioPath.trim() !== "") {
        const audio = new Audio(audioPath);
        audio.playbackRate = rate;
        audio.onended = () => {
          if (onEndedCallback) onEndedCallback();
        };
        audio.play().catch(err => {
          speakTTS(fallbackText, rate, onEndedCallback);
        });
      } else {
        speakTTS(fallbackText, rate, onEndedCallback);
      }
    }

    function speakTTS(text, rate = 0.8, onEndedCallback = null) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = rate;
        if (onEndedCallback) {
          utter.onend = () => onEndedCallback();
        }
        window.speechSynthesis.speak(utter);
      } else {
        if (onEndedCallback) setTimeout(onEndedCallback, 1200);
      }
    }

    // 動態圖鑑渲染（高流暢、不卡頓）
    function openBagModal() {
      const box = document.getElementById("bag-grid");
      box.innerHTML = "";
      document.getElementById("bag-progress").innerText = unlockedPets.length;

      // 提取所有已解鎖的索引，並包含前 120 隻作為基礎圖鑑瀏覽
      const unlockedIndices = unlockedPets.map(id => parseInt(id.replace("pet_", ""), 10) - 1).filter(n => !isNaN(n));
      const indicesToDisplay = new Set();

      // 先放入前 120 隻展示格子
      for (let i = 0; i < 120; i++) indicesToDisplay.add(i);
      // 再放入所有學生已抽到的稀有寵物格子
      unlockedIndices.forEach(idx => {
        if (idx < TOTAL_PETS_COUNT) indicesToDisplay.add(idx);
      });

      const sortedIndices = Array.from(indicesToDisplay).sort((a, b) => a - b);

      sortedIndices.forEach(idx => {
        const p = getPetByIndex(idx);
        const isUnlocked = unlockedPets.includes(p.id);
        const cell = document.createElement("div");
        cell.className = `bag-cell ${isUnlocked ? 'unlocked' : 'locked'}`;
        cell.innerHTML = `
          <div style="font-size:0.7rem; color:#94a3b8;">${p.num}</div>
          <div style="font-size:1.8rem; margin:3px 0;">${isUnlocked ? p.icon : '❓'}</div>
          <div style="font-size:0.75rem; font-weight:700; line-height:1.2;">${isUnlocked ? p.name : '未解鎖'}</div>
        `;
        box.appendChild(cell);
      });

      document.getElementById("bag-modal").style.display = "flex";
    }

    function closeBagModal() {
      document.getElementById("bag-modal").style.display = "none";
    }

    function triggerWhiteFlash() {
      const flash = document.getElementById("flash-overlay");
      flash.style.opacity = "0.9";
      setTimeout(() => { flash.style.opacity = "0"; }, 250);
    }

    function playCoinSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(987.77, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
    }

    function playBuzzerSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function playFanfareSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.2);
          osc.start(ctx.currentTime + i * 0.1);
          osc.stop(ctx.currentTime + i * 0.1 + 0.2);
        });
      } catch (e) {}
    }

    function playChestSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.06);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.06 + 0.25);
          osc.start(ctx.currentTime + idx * 0.06);
          osc.stop(ctx.currentTime + idx * 0.06 + 0.25);
        });
      } catch (e) {}
    }

    function launchConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const pieces = [];
      const colors = ["#facc15", "#38bdf8", "#22c55e", "#ef4444"];
      for (let i = 0; i < 70; i++) {
        pieces.push({
          x: canvas.width / 2, y: canvas.height / 2,
          r: Math.random() * 5 + 3,
          dx: (Math.random() - 0.5) * 12, dy: (Math.random() - 0.8) * 14,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.dx; p.y += p.dy; p.dy += 0.35;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color; ctx.fill();
        });
        frame++;
        if (frame < 90) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    window.addEventListener("DOMContentLoaded", () => {
      initUserDisplay();
      initQuestDropdown();
      startQuest(ALL_QUESTS[0]);
    });
  </script>
