<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PHONICS CHALLENGE: 聽力解碼特訓</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090e1a;
      --card-bg: #1e293b;
      --gold: #facc15;
      --cyan: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --border-dark: #334155;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #070a13 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-viewport {
      width: 100%;
      max-width: 420px;
      height: 98vh;
      max-height: 840px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 12px;
      position: relative;
      z-index: 10;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .quest-tabs-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quest-tabs-scroll::-webkit-scrollbar { display: none; }

    .q-btn {
      background: var(--card-bg);
      border: 2px solid var(--border-dark);
      color: var(--text-sub);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .q-btn.active {
      background: var(--cyan);
      color: #0b1120;
      border-color: #0284c7;
    }

    .pill-btn {
      background: #1e293b;
      border: 2px solid var(--border-dark);
      color: #fff;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .pill-btn.bag-btn { background: linear-gradient(180deg, #ec4899, #be185d); border-color: #831843; }
    .pill-btn.parent-btn { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; color: #86efac; }
    .pill-btn.parent-btn.active { background: #22c55e; color: #052e16; }

    .parent-overview-panel {
      display: none;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98));
      border: 2px solid var(--green);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 0.78rem;
      color: #e2e8f0;
      line-height: 1.45;
    }
    .parent-overview-panel.show { display: block; }
    .parent-overview-panel h4 { color: #86efac; font-size: 0.85rem; margin-bottom: 3px; }

    .challenge-arena {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
      border: 2px solid var(--border-dark);
      box-shadow: 0 4px 0 #000;
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 235px;
      position: relative;
    }

    .stage-badge {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--gold);
      background: rgba(250, 204, 21, 0.15);
      padding: 2px 10px;
      border-radius: 999px;
      margin-bottom: 4px;
    }

    .challenge-title {
      font-size: 1.02rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 6px;
    }

    .listen-counter-pill {
      font-size: 0.76rem;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--cyan);
      border-radius: 999px;
      padding: 2px 10px;
      margin-bottom: 8px;
    }

    .audio-speaker-pulse {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--cyan), #0284c7);
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
      margin-bottom: 12px;
      transition: transform 0.1s;
    }
    .audio-speaker-pulse:active { transform: scale(0.9); }
    .audio-speaker-pulse.playing {
      animation: pulsePlay 0.8s infinite alternate;
      border-color: var(--gold);
    }

    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }
    .choices-grid.three-cols {
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .choice-card-btn {
      background: #0f172a;
      border: 2px solid var(--border-dark);
      color: #fff;
      padding: 12px 8px;
      border-radius: 12px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .choice-card-btn:active { transform: scale(0.95); }
    .choice-card-btn.locked {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(1);
      pointer-events: none;
    }
    .choice-card-btn.correct { background: var(--green); border-color: #fff; color: #000; }
    .choice-card-btn.wrong { background: var(--red); border-color: #fff; animation: shakeBtn 0.3s; }

    @keyframes shakeBtn {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .ready-gacha-btn {
      width: 100%;
      background: linear-gradient(180deg, #f59e0b, #d97706);
      border: 3px solid #fef08a;
      color: #000;
      padding: 14px;
      border-radius: 16px;
      font-size: 1.18rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.8);
      animation: pulseGacha 0.8s infinite alternate;
      margin-top: 6px;
    }
    @keyframes pulseGacha {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    .progress-status-box {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--text-sub);
      margin-top: 10px;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 999px;
      margin-top: 3px;
      overflow: hidden;
      border: 1px solid var(--border-dark);
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      transition: width 0.3s;
    }

    .reference-deck {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 48vh;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .reference-deck::-webkit-scrollbar { display: none; }

    .section-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--gold);
    }

    .ref-card {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 1.5px solid var(--border-dark);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ref-en { font-size: 1rem; font-weight: 800; }
    .ref-zh { font-size: 0.74rem; color: var(--text-sub); font-weight: 700; }
    
    .slow-audio-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .article-full-card {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 2px solid var(--border-dark);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }
    .article-full-card.listening-required {
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }
    .article-full-card.listened-completed {
      border-color: var(--green);
      background: linear-gradient(180deg, #14532d, #052e16);
    }
    .article-tag { font-size: 0.68rem; font-weight: 800; color: var(--gold); }
    .article-en { font-size: 0.88rem; font-weight: 800; line-height: 1.35; color: #fff; }
    .article-zh { font-size: 0.72rem; color: var(--text-sub); font-weight: 700; }

    .article-btn-action {
      background: linear-gradient(180deg, var(--gold), #ca8a04);
      color: #0b1120;
      border: none;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 0.74rem;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .article-btn-action.playing {
      background: #38bdf8;
      animation: pulsePlay 1s infinite alternate;
    }
    .article-btn-action.done {
      background: var(--green);
      color: #fff;
    }
    @keyframes pulsePlay { from { transform: scale(1); } to { transform: scale(1.05); } }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #1e293b, #090e1a);
      border: 3px solid var(--gold);
      border-radius: 22px;
      padding: 18px 16px;
      text-align: center;
      box-shadow: 0 0 40px rgba(250, 204, 21, 0.4);
    }

    .report-card-wrap {
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px dashed var(--green);
      border-radius: 14px;
      padding: 10px 12px;
      text-align: left;
      margin: 10px 0;
      font-size: 0.78rem;
      line-height: 1.55;
    }
    .report-row { display: flex; justify-content: space-between; }
    .report-badge { color: #86efac; font-weight: 800; }

    .close-btn {
      width: 100%;
      background: linear-gradient(180deg, var(--green), #15803d);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
    }

    .bag-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-height: 48vh;
      overflow-y: auto;
      margin: 12px 0;
      padding: 2px;
    }
    .bag-cell {
      background: #0f172a;
      border: 1.5px solid var(--border-dark);
      border-radius: 10px;
      padding: 6px 2px;
      text-align: center;
    }
    .bag-cell.unlocked { border-color: var(--gold); background: #1e293b; }
    .bag-cell.locked { opacity: 0.35; filter: grayscale(1); }

    #flash-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.15s;
    }
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 101;
    }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="app-viewport">
    
    <div class="control-header">
      <div class="quest-tabs-scroll" id="quest-nav-box"></div>
      <div style="display:flex; gap:6px;">
        <button class="pill-btn parent-btn" id="parent-toggle-btn" onclick="toggleParentPanel()">📋 學習大綱</button>
        <button class="pill-btn bag-btn" onclick="openBagModal()">🎒 萬物圖鑑</button>
      </div>
    </div>

    <!-- 系統全自動組合的家長大綱 -->
    <div class="parent-overview-panel" id="parent-panel">
      <h4>📌 本週學習目標（系統自動生成）</h4>
      <div id="parent-overview-content"></div>
    </div>

    <!-- 聽力挑戰核心舞台 -->
    <div class="challenge-arena" id="main-challenge-arena"></div>

    <!-- 下方教材區 -->
    <div class="reference-deck">
      <div class="section-title">🔤 核心單字慢速拆解（卡關可點此先聽嘴型）：</div>
      <div id="ref-cards-box" style="display:flex; flex-direction:column; gap:5px;"></div>

      <div class="section-title">📖 整篇課文朗讀：</div>
      <div class="article-full-card" id="article-card-box">
        <div>
          <div class="article-tag">課文音檔</div>
          <div class="article-en" id="article-card-en"></div>
          <div class="article-zh" id="article-card-zh"></div>
        </div>
        <button class="article-btn-action" id="article-action-btn" onclick="handleArticleAudioClick()">
          <span id="article-btn-icon">🎧</span>
          <span id="article-btn-text">課文錄音</span>
        </button>
      </div>
    </div>

  </div>

  <!-- 通關成果聯絡簿 Modal -->
  <div class="modal-overlay" id="loot-modal">
    <div class="modal-box">
      <span style="display:inline-block; padding:3px 12px; border-radius:999px; font-weight:800; font-size:0.75rem; background:linear-gradient(90deg,#ec4899,#8b5cf6); color:#fff;" id="loot-rarity">神話級 MYTHIC</span>
      <div style="font-size:3.5rem; margin:4px 0;" id="loot-icon">🐉</div>
      <div style="font-size:1.3rem; font-weight:900;" id="loot-name">彩虹神龍</div>
      <div style="font-size:0.9rem; color:var(--gold); font-weight:800;" id="loot-power">⚡ 戰鬥力: 999,999</div>
      
      <div class="report-card-wrap">
        <div style="font-weight:900; color:var(--gold); border-bottom:1px solid #334155; padding-bottom:3px; margin-bottom:5px;">
          📝 本週課堂複習成效報告單
        </div>
        <div class="report-row"><span>1. 音素聽力盲測：</span><span class="report-badge">全數通過 (4/4)</span></div>
        <div class="report-row"><span>2. 整篇課文聆聽：</span><span class="report-badge" id="report-article-check">100% 完整聽畢</span></div>
        <div style="margin-top:6px; color:#94a3b8; font-size:0.72rem; border-top:1px dashed #334155; padding-top:4px;">
          👩‍🏫 <strong>老師評語：</strong>孩子今日認真聽辨音素細節，已確實掌握核心讀音，請家長安心給予放鬆時間！
        </div>
      </div>

      <button class="close-btn" onclick="closeLootModal()">收進萬物圖鑑 🎮</button>
    </div>
  </div>

  <!-- 萬物圖鑑 Modal -->
  <div class="modal-overlay" id="bag-modal">
    <div class="modal-box">
      <h3 style="font-size:1.2rem; color:var(--gold);">🎒 萬物收集圖鑑庫</h3>
      <div style="font-size:0.78rem; color:var(--text-sub); margin-top:4px;">
        已解鎖進度：<span id="bag-progress">0</span> / 1,000 種全服圖鑑
      </div>
      <div class="bag-grid" id="bag-grid"></div>
      <button class="close-btn" onclick="closeBagModal()">返回訓練</button>
    </div>
  </div>

  <script>
    // 通用幽靈單字庫（課文抓鬼：確保課文裡絕對沒有這些字）
    const GHOST_WORDS_POOL = ["pizza", "monkey", "banana", "robot", "guitar", "castle", "tiger", "rocket"];

    // ─── 📚 累積式關卡資料庫：包含歷史關卡與本週 Unit 35 全數 36 個單字 ───
    const ALL_QUESTS = [
      {
        id: "u35_p1",
        label: "Unit 35 (1) 聰明動物篇",
        words: [
          { en: "intelligent", display: "in · tel · li · gent", zh: "聰明的", audio: "", distractor: "diligent", hint: "前綴 in- 開頭；注意中間短母音 /ɛ/ 與結尾 -gent 軟音 /dʒənt/。" },
          { en: "animal", display: "an · i · mal", zh: "動物", audio: "", distractor: "enamel", hint: "開頭 a 發蝴蝶音 /æ/；注意字尾 -mal 為弱化母音 /məl/。" },
          { en: "ape", display: "ape", zh: "猿；人猿", audio: "", distractor: "cape", hint: "字首 a 發長母音 /e/；結尾 p 輕聲爆破釋放。" },
          { en: "crow", display: "cr · ow", zh: "烏鴉", audio: "", distractor: "glow", hint: "雙子音群 /kr/ 不是 /gl/；ow 發雙母音 /o/。" },
          { en: "among", display: "a · mong", zh: "在…之中", audio: "", distractor: "along", hint: "字首 a- 為弱母音 /ə/；mong 發短母音 /ʌ/ 帶鼻音 /ŋ/。" },
          { en: "memory", display: "mem · o · ry", zh: "記憶(力)", audio: "", distractor: "melody", hint: "首音節 mem- 短母音 /ɛ/；注意中間是 /m/ 不是 /l/。" },
          { en: "be able to", display: "be · a · ble · to", zh: "能夠", audio: "", distractor: "be table to", hint: "able 開頭發長母音 /e/；-ble 帶舌尖齒齦邊音 /bəl/。" },
          { en: "imagine", display: "i · mag · ine", zh: "想像", audio: "", distractor: "examine", hint: "重音在第二音節 -mag- /mædʒ/；結尾 -ine 發短母音 /ɪn/。" },
          { en: "solve", display: "solve", zh: "解決；解開", audio: "", distractor: "evolve", hint: "開頭無聲子音 /s/；母音 o 發開口短母音 /ɑ/ 帶舌邊音 /lv/。" }
        ],
        sentence: { 
          en: "When we think of intelligent animals, we usually think dogs, cats, and apes. But a crow is among the most intelligent animals in the world.", 
          zh: "當我們想到聰明的動物時，通常會想到狗、貓和猿類。但烏鴉是世界上最聰明的動物之一。",
          audio: "audio/crow_u35.mp3" 
        }
      },
      {
        id: "u35_p2",
        label: "Unit 35 (2) 工具與覓食篇",
        words: [
          { en: "problem", display: "prob · lem", zh: "問題；難題", audio: "", distractor: "program", hint: "雙子音群 pr- 開頭；第一音節 prob- 發短母音 /ɑ/。" },
          { en: "tool", display: "tool", zh: "工具", audio: "", distractor: "pool", hint: "開頭是舌尖齒齦音 /t/ 不是雙唇爆破音 /p/；oo 發長母音 /u/。" },
          { en: "tiny", display: "ti · ny", zh: "極小的", audio: "", distractor: "shiny", hint: "開頭是清子音 /t/ 不是摩擦音 /ʃ/；第一音節 ti- 發雙母音 /aɪ/。" },
          { en: "stick", display: "stick", zh: "樹枝；棍子", audio: "", distractor: "stack", hint: "雙子音群 st- 開頭；母音 i 發短母音 /ɪ/，不是 /æ/。" },
          { en: "get at", display: "get · at", zh: "構到；取得", audio: "", distractor: "get out", hint: "短母音 e 發 /ɛ/；at 結尾接短母音 /æt/，注意連音讀法。" },
          { en: "tasty", display: "tas · ty", zh: "美味的", audio: "", distractor: "nasty", hint: "字首是清子音 /t/ 不是鼻音 /n/；a 發長母音 /e/。" },
          { en: "insect", display: "in · sect", zh: "昆蟲", audio: "", distractor: "inject", hint: "第二音節 -sect 發清子音 /s/ 不是擦濁音 /dʒ/。" },
          { en: "normal", display: "nor · mal", zh: "正常的", audio: "", distractor: "formal", hint: "字首是鼻音 /n/ 不是唇齒音 /f/；nor- 發 /nɔr/。" },
          { en: "pay attention to", display: "pay · at · ten · tion · to", zh: "注意；留意", audio: "", distractor: "pay intention to", hint: "attention 重音在第二音節 -ten-；-tion 發摩擦音 /ʃən/。" }
        ],
        sentence: {

    const FULL_CATALOG = [];
    const SPECIES = ["彩虹神龍", "黃金香蕉狗", "暴風獨角獸", "駭客貓", "馬桶怪", "生吐司", "霸王暴龍", "爆破西瓜"];
    for (let i = 1; i <= 60; i++) {
      FULL_CATALOG.push({
        id: `pet_${i}`,
        num: `#${String(i).padStart(4, '0')}`,
        name: SPECIES[(i - 1) % SPECIES.length],
        rarity: i % 10 === 0 ? "神話級 MYTHIC" : i % 3 === 0 ? "傳奇級 LEGENDARY" : "稀有級 RARE",
        icon: ["🐉","🐕","🦄","🐱","🚽","🍞","🦖","🍉"][(i - 1) % 8],
        power: `⚡ ${(50000 + i * 2500).toLocaleString()}`
      });
    }

    let currentQuestIdx = 0;
    let currentStage = 0;
    let currentTargetWord = "";
    let currentTargetAudio = "";
    let unlockedPets = JSON.parse(localStorage.getItem("unlocked_catalog_ids") || '["pet_1"]');
    
    let currentListenCount = 0;
    const REQUIRED_LISTEN_COUNT = 2;
    let isAudioPlaying = false;
    let hasCompletedArticleAudio = false;
    let articleAudioElement = null;

    function initQuestNav() {
      const box = document.getElementById("quest-nav-box");
      box.innerHTML = "";
      ALL_QUESTS.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = `q-btn ${idx === currentQuestIdx ? 'active' : ''}`;
        btn.innerText = q.label;
        btn.onclick = () => switchQuest(idx);
        box.appendChild(btn);
      });
    }

    function switchQuest(idx) {
      currentQuestIdx = idx;
      initQuestNav();
      startQuest(ALL_QUESTS[idx]);
    }

    function startQuest(quest) {
      currentStage = 0;
      hasCompletedArticleAudio = false;
      if (articleAudioElement) {
        articleAudioElement.pause();
        articleAudioElement = null;
      }
      updateProgress();
      renderAllModules(quest);
      generateChallengeStage();
    }

    function renderAllModules(quest) {
      const wordsList = quest.words.map(w => `<b>${w.en}</b> (${w.zh})`).join("、");
      const autoOverview = `
        • <b>重點詞彙</b>：${wordsList}<br>
        • <b>語境實用語句</b>：${quest.sentence.en}<br>
        • <b>驗收目標</b>：單字聽音盲測＋課文抓鬼聽辨（Odd One Out）＋課文錄音聽畢。
      `;
      document.getElementById("parent-overview-content").innerHTML = autoOverview;

      const box = document.getElementById("ref-cards-box");
      box.innerHTML = "";
      quest.words.forEach(item => {
        const card = document.createElement("div");
        card.className = "ref-card";
        card.innerHTML = `
          <div>
            <div class="ref-en">${item.display}</div>
            <div class="ref-zh">${item.zh} · <span style="color:#38bdf8;">${item.hint}</span></div>
          </div>
          <button class="slow-audio-btn" onclick="playSmartAudio('${item.audio || ''}', '${item.en}', 0.55)">
            🐢 嘴型拆解
          </button>
        `;
        box.appendChild(card);
      });

      document.getElementById("article-card-en").innerText = quest.sentence.en;
      document.getElementById("article-card-zh").innerText = quest.sentence.zh;
      
      const cardBox = document.getElementById("article-card-box");
      const btn = document.getElementById("article-action-btn");
      const icon = document.getElementById("article-btn-icon");
      const text = document.getElementById("article-btn-text");

      if (quest.sentence.audio && quest.sentence.audio.trim() !== "") {
        cardBox.className = "article-full-card listening-required";
        btn.className = "article-btn-action";
        icon.innerText = "🔒";
        text.innerText = "聽完解鎖";
      } else {
        cardBox.className = "article-full-card";
        btn.className = "article-btn-action";
        icon.innerText = "🔊";
        text.innerText = "慢速朗讀";
        hasCompletedArticleAudio = true;
      }
    }

    function toggleParentPanel() {
      const panel = document.getElementById("parent-panel");
      const btn = document.getElementById("parent-toggle-btn");
      const isShow = panel.classList.toggle("show");
      btn.classList.toggle("active", isShow);
    }

    function handleArticleAudioClick() {
      const quest = ALL_QUESTS[currentQuestIdx];
      const audioPath = quest.sentence.audio;

      const btn = document.getElementById("article-action-btn");
      const icon = document.getElementById("article-btn-icon");
      const text = document.getElementById("article-btn-text");

      const markAsFinished = () => {
        hasCompletedArticleAudio = true;
        btn.className = "article-btn-action done";
        icon.innerText = "✅";
        text.innerText = "已完成";
        document.getElementById("article-card-box").className = "article-full-card listened-completed";
        playCoinSound();
        generateChallengeStage();
      };

      if (audioPath && audioPath.trim() !== "") {
        if (articleAudioElement) {
          articleAudioElement.pause();
          articleAudioElement = null;
        }

        const audio = new Audio(audioPath);
        articleAudioElement = audio;
        
        btn.className = "article-btn-action playing";
        icon.innerText = "⏳";
        text.innerText = "正在聆聽...";

        audio.play().then(() => {
          audio.onended = markAsFinished;
        }).catch(err => {
          speakTTS(quest.sentence.en, 0.8, markAsFinished);
        });
      } else {
        speakTTS(quest.sentence.en, 0.8, markAsFinished);
      }
    }

    function generateChallengeStage() {
      const quest = ALL_QUESTS[currentQuestIdx];
      const arena = document.getElementById("main-challenge-arena");
      currentListenCount = 0;

      if (currentStage >= 4) {
        if (quest.sentence.audio && quest.sentence.audio.trim() !== "" && !hasCompletedArticleAudio) {
          arena.innerHTML = `
            <div class="stage-badge" style="color:#f59e0b; border-color:#f59e0b;">⚠ 聽力已達標，但課文未聽！</div>
            <div class="challenge-title" style="font-size:0.92rem; line-height:1.4;">請點擊下方黃色按鈕，將整篇「課文音檔」完整聽完才能開箱！</div>
            <div style="font-size:2.8rem; margin:10px 0;">🔒</div>
          `;
          return;
        }

        arena.innerHTML = `
          <div class="stage-badge">🎉 聽力驗收全數通關！</div>
          <div class="challenge-title" style="color:var(--gold);">🔥 神秘寶箱能量已滿！</div>
          <button class="ready-gacha-btn" onclick="executeVictory()">🎁 點擊狂暴開箱抽神寵！</button>
        `;
        return;
      }

      const isOddOneOut = currentStage === 3;

      arena.innerHTML = `
        <div class="stage-badge" id="stage-level-tag">${isOddOneOut ? 'FINAL STAGE · 課文聽力抓鬼' : `STAGE ${currentStage + 1} / 4 · 單字音素盲測`}</div>
        <div class="challenge-title" id="challenge-prompt">${isOddOneOut ? '點擊大喇叭聽課文！找出哪一個單字「沒出現在課文」中？' : '點擊大喇叭，聽滿 2 遍解鎖選項！'}</div>
        <div class="listen-counter-pill" id="listen-counter">🎧 聆聽解鎖進度：0 / 2 遍</div>
        <div class="audio-speaker-pulse" id="stage-speaker" onclick="handleChallengeSpeakerClick()">🔊</div>
        <div class="choices-grid ${isOddOneOut ? 'three-cols' : ''}" id="choices-container"></div>
        <div class="progress-status-box">
          <span>驗收進度</span>
          <span id="progress-text">${currentStage} / 4 關</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-fill" style="width:${(currentStage/4)*100}%"></div>
        </div>
      `;

      const choicesBox = document.getElementById("choices-container");

      if (currentStage < 3) {
        const wordData = quest.words[currentStage];
        currentTargetWord = wordData.en;
        currentTargetAudio = wordData.audio || "";

        const options = Math.random() > 0.5 ? 
          [ { text: wordData.en, isCorrect: true }, { text: wordData.distractor, isCorrect: false } ] :
          [ { text: wordData.distractor, isCorrect: false }, { text: wordData.en, isCorrect: true } ];

        options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "choice-card-btn locked";
          btn.innerText = "🔒 請先聽";
          btn.dataset.text = opt.text;
          btn.onclick = () => checkAnswer(opt.isCorrect, btn);
          choicesBox.appendChild(btn);
        });

      } else if (currentStage === 3) {
        currentTargetWord = quest.sentence.en;
        currentTargetAudio = quest.sentence.audio || "";

        const ghostWord = GHOST_WORDS_POOL[Math.floor(Math.random() * GHOST_WORDS_POOL.length)];
        const presentWord1 = quest.words[0].en;
        const presentWord2 = quest.words[1].en;

        const oddChoices = [
          { text: ghostWord, isCorrect: true },
          { text: presentWord1, isCorrect: false },
          { text: presentWord2, isCorrect: false }
        ].sort(() => Math.random() - 0.5);

        oddChoices.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "choice-card-btn locked";
          btn.innerText = "🔒 請先聽";
          btn.dataset.text = opt.text;
          btn.onclick = () => checkOddAnswer(opt.isCorrect, btn, ghostWord);
          choicesBox.appendChild(btn);
        });
      }
    }

    function handleChallengeSpeakerClick() {
      if (isAudioPlaying) return;
      isAudioPlaying = true;

      const speaker = document.getElementById("stage-speaker");
      speaker.classList.add("playing");

      playSmartAudio(currentTargetAudio, currentTargetWord, 0.75, () => {
        isAudioPlaying = false;
        speaker.classList.remove("playing");
        currentListenCount++;

        const counter = document.getElementById("listen-counter");
        if (counter) counter.innerText = `🎧 聆聽解鎖進度：${currentListenCount} / ${REQUIRED_LISTEN_COUNT} 遍`;

        if (currentListenCount >= REQUIRED_LISTEN_COUNT) {
          document.querySelectorAll(".choice-card-btn").forEach(btn => {
            btn.classList.remove("locked");
            btn.innerText = btn.dataset.text;
          });
          const prompt = document.getElementById("challenge-prompt");
          if (currentStage === 3) {
            prompt.innerText = "抓鬼時刻！哪一個單字「沒出現在課文」中？";
          } else {
            prompt.innerText = "選項已解鎖！哪一個才是目標字？";
          }
          if (counter) {
            counter.innerText = "✅ 已聽滿！請在下方選擇答案";
            counter.style.borderColor = "var(--green)";
            counter.style.color = "#86efac";
          }
        }
      });
    }

    function checkAnswer(isCorrect, btnElement) {
      if (isCorrect) {
        btnElement.classList.add("correct");
        playCoinSound();
        currentStage++;
        updateProgress();
        setTimeout(generateChallengeStage, 400);
      } else {
        btnElement.classList.add("wrong");
        playBuzzerSound();
        alert("❌ 聽錯了！發音不對喔！\n\n答案已重新鎖定，必須重新聽滿 2 遍才能再次作答！請用心聽！");
        generateChallengeStage();
      }
    }

    function checkOddAnswer(isCorrect, btnElement, ghostWord) {
      if (isCorrect) {
        btnElement.classList.add("correct");
        playFanfareSound();
        currentStage++;
        updateProgress();
        setTimeout(generateChallengeStage, 400);
      } else {
        btnElement.classList.add("wrong");
        playBuzzerSound();
        alert(`❌ 抓錯鬼了！這個字課文裡「有出現」喔！\n\n答案已重新鎖定，請再聽課文 2 次找出誰是冒牌貨！`);
        generateChallengeStage();
      }
    }

    function updateProgress() {
      const fill = document.getElementById("progress-fill");
      const text = document.getElementById("progress-text");
      if (fill) fill.style.width = `${(currentStage / 4) * 100}%`;
      if (text) text.innerText = `${currentStage} / 4 關`;
    }

    function executeVictory() {
      triggerWhiteFlash();
      playChestSound();
      launchConfetti();

      const quest = ALL_QUESTS[currentQuestIdx];
      const loot = FULL_CATALOG[Math.floor(Math.random() * FULL_CATALOG.length)];
      if (!unlockedPets.includes(loot.id)) {
        unlockedPets.push(loot.id);
        localStorage.setItem("unlocked_catalog_ids", JSON.stringify(unlockedPets));
      }

      document.getElementById("loot-rarity").innerText = `${loot.num} · ${loot.rarity}`;
      document.getElementById("loot-icon").innerText = loot.icon;
      document.getElementById("loot-name").innerText = loot.name;
      document.getElementById("loot-power").innerText = loot.power;

      document.getElementById("report-article-check").innerText = quest.sentence.audio ? "100% 完整聽畢" : "已朗讀複習";
      document.getElementById("loot-modal").style.display = "flex";
    }

    function closeLootModal() {
      document.getElementById("loot-modal").style.display = "none";
      currentStage = 0;
      generateChallengeStage();
    }

    function playSmartAudio(audioPath, fallbackText, rate = 0.8, onEndedCallback = null) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      if (audioPath && audioPath.trim() !== "") {
        const audio = new Audio(audioPath);
        audio.playbackRate = rate;
        
        audio.onended = () => {
          if (onEndedCallback) onEndedCallback();
        };

        audio.play().catch(err => {
          speakTTS(fallbackText, rate, onEndedCallback);
        });
      } else {
        speakTTS(fallbackText, rate, onEndedCallback);
      }
    }

    function speakTTS(text, rate = 0.8, onEndedCallback = null) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = rate;
        if (onEndedCallback) {
          utter.onend = () => onEndedCallback();
        }
        window.speechSynthesis.speak(utter);
      } else {
        if (onEndedCallback) setTimeout(onEndedCallback, 1200);
      }
    }

    function openBagModal() {
      const box = document.getElementById("bag-grid");
      box.innerHTML = "";
      document.getElementById("bag-progress").innerText = unlockedPets.length;
      FULL_CATALOG.forEach(p => {
        const isUnlocked = unlockedPets.includes(p.id);
        const cell = document.createElement("div");
        cell.className = `bag-cell ${isUnlocked ? 'unlocked' : 'locked'}`;
        cell.innerHTML = `
          <div style="font-size:0.6rem; color:#94a3b8;">${p.num}</div>
          <div style="font-size:1.5rem;">${isUnlocked ? p.icon : '❓'}</div>
          <div style="font-size:0.68rem; font-weight:700;">${isUnlocked ? p.name : '未解鎖'}</div>
        `;
        box.appendChild(cell);
      });
      document.getElementById("bag-modal").style.display = "flex";
    }

    function closeBagModal() {
      document.getElementById("bag-modal").style.display = "none";
    }

    function triggerWhiteFlash() {
      const flash = document.getElementById("flash-overlay");
      flash.style.opacity = "0.9";
      setTimeout(() => { flash.style.opacity = "0"; }, 250);
    }

    function playCoinSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(987.77, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
    }

    function playBuzzerSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function playFanfareSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.2);
          osc.start(ctx.currentTime + i * 0.1);
          osc.stop(ctx.currentTime + i * 0.1 + 0.2);
        });
      } catch (e) {}
    }

    function playChestSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.06);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.06 + 0.25);
          osc.start(ctx.currentTime + idx * 0.06);
          osc.stop(ctx.currentTime + idx * 0.06 + 0.25);
        });
      } catch (e) {}
    }

    function launchConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const pieces = [];
      const colors = ["#facc15", "#38bdf8", "#22c55e", "#ef4444"];
      for (let i = 0; i < 70; i++) {
        pieces.push({
          x: canvas.width / 2, y: canvas.height / 2,
          r: Math.random() * 5 + 3,
          dx: (Math.random() - 0.5) * 12, dy: (Math.random() - 0.8) * 14,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.dx; p.y += p.dy; p.dy += 0.35;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color; ctx.fill();
        });
        frame++;
        if (frame < 90) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    window.addEventListener("DOMContentLoaded", () => {
      initQuestNav();
      startQuest(ALL_QUESTS[0]);
    });
  </script>
