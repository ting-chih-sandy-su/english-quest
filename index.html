<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ROBLOX: PET RESCUE 99</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- 引入 Phaser 3 遊戲引擎 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <style>
    :root {
      --bg-dark: #070a13;
      --bezel-color: #1e293b;
      --bezel-border: #334155;
      --accent-cyan: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 桌機大螢幕背景氛圍 (動態太空網格) */
    .desktop-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #050811 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* 遊戲裝置容器：桌機上包裝成掌機/機台，手機上滿版 */
    #device-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }

    /* ── 桌機專用：街機展示機台外框 ── */
    @media (min-width: 600px) {
      #device-wrapper {
        padding: 16px 14px 20px;
        background: linear-gradient(145deg, #1e293b, #0f172a);
        border: 4px solid var(--bezel-border);
        border-radius: 40px;
        box-shadow: 
          0 25px 60px rgba(0, 0, 0, 0.8),
          0 0 40px rgba(56, 189, 248, 0.15),
          inset 0 2px 4px rgba(255, 255, 255, 0.15);
      }

      /* 掌機頂部小聽筒/攝像頭裝飾點 */
      #device-wrapper::before {
        content: '';
        position: absolute;
        top: 8px;
        width: 48px;
        height: 4px;
        background: #334155;
        border-radius: 4px;
      }
    }

    /* ── 手機/平板端：徹底消除邊框，100% 滿版無縫 ── */
    @media (max-width: 599px) {
      body {
        background-color: #000;
      }
      .desktop-backdrop {
        display: none;
      }
      #device-wrapper {
        width: 100vw !important;
        height: 100vh !important;
        padding: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
    }

    #game-canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
    }

    @media (max-width: 599px) {
      #game-canvas-container {
        border-radius: 0;
      }
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <!-- 桌機背景光輝 -->
  <div class="desktop-backdrop"></div>

  <!-- 主機台容器 (桌機掌機 / 手機滿版自適應) -->
  <div id="device-wrapper">
    <div id="game-canvas-container"></div>
  </div>

  <script>
    // ========================================================
    // ⚙️ 每週更新專區 (下課 30 秒更新此處)
    // ========================================================
    const WEEK_DATA = {
      levelLabel: "WORLD 4: RAINY FOREST",
      words: [
        { en: "rain", display: "r · ain", zh: "下雨" },
        { en: "weather", display: "wea · ther", zh: "天氣" },
        { en: "outside", display: "out · side", zh: "外面" }
      ],
      sentence: {
        en: "It is raining outside.",
        zh: "外面正在下雨。"
      }
    };

    const PET_ROSTER = [
      { name: "TITANIC RAINBOW DRAGON", rarity: "MYTHIC", color: 0xec4899, power: "999,999", quote: "傳奇彩虹神龍！全服只有 0.1% 掉落率" },
      { name: "GOLDEN BANANA DOG", rarity: "LEGENDARY", color: 0xf59e0b, power: "88,000", quote: "黃金香蕉狗！走路自帶滑倒音效" },
      { name: "CYBER GLITCH CAT", rarity: "RARE", color: 0x06b6d4, power: "12,500", quote: "賽博駭客貓，能把考卷直接格式化" },
      { name: "MOLDY TOAST", rarity: "COMMON", color: 0x94a3b8, power: "25", quote: "雖然戰鬥力很低，但烤過挺好吃的" }
    ];

    // ========================================================
    // 🎮 PHASER 3 遊戲場景
    // ========================================================
    class GameScene extends Phaser.Scene {
      constructor() {
        super({ key: 'GameScene' });
      }

      preload() {
        this.createVectorAssets();
      }

      create() {
        this.chargedCount = 0;
        this.maxCharges = 4;
        this.completedItems = new Set();

        const W = this.cameras.main.width;
        const H = this.cameras.main.height;

        // 背景
        this.add.rectangle(W / 2, H / 2, W, H, 0x0a0f1d);
        this.createGridBackground(W, H);

        // 頂部 HUD
        this.createHUD(W);

        // 中央開箱神蛋
        this.createChestPedestal(W, H * 0.35);

        // 下方符文石板
        this.createRuneDeck(W, H * 0.61);

        // 粒子發射器
        this.particleEmitter = this.add.particles(0, 0, 'glowParticle', {
          speed: { min: 80, max: 200 },
          scale: { start: 0.8, end: 0 },
          blendMode: 'ADD',
          lifespan: 600,
          emitting: false
        });
      }

      createVectorAssets() {
        const pGfx = this.make.graphics({ x: 0, y: 0, add: false });
        pGfx.fillStyle(0x00f0ff, 1);
        pGfx.fillCircle(8, 8, 8);
        pGfx.generateTexture('glowParticle', 16, 16);

        const rGfx = this.make.graphics({ x: 0, y: 0, add: false });
        rGfx.fillStyle(0x162032, 1);
        rGfx.fillRoundedRect(0, 0, 360, 52, 14);
        rGfx.lineStyle(3, 0x2a3b5c, 1);
        rGfx.strokeRoundedRect(0, 0, 360, 52, 14);
        rGfx.generateTexture('runeBase', 360, 52);

        const aGfx = this.make.graphics({ x: 0, y: 0, add: false });
        aGfx.fillStyle(0x064e3b, 1);
        aGfx.fillRoundedRect(0, 0, 360, 52, 14);
        aGfx.lineStyle(3, 0x10b981, 1);
        aGfx.strokeRoundedRect(0, 0, 360, 52, 14);
        aGfx.generateTexture('runeCharged', 360, 52);
      }

      createGridBackground(w, h) {
        const grid = this.add.grid(w / 2, h / 2, w, h, 32, 32, 0x000000, 0, 0x1e293b, 0.25);
        this.tweens.add({
          targets: grid,
          alpha: 0.5,
          duration: 2000,
          yoyo: true,
          repeat: -1
        });
      }

      createHUD(w) {
        this.add.text(w / 2, 32, WEEK_DATA.levelLabel, {
          fontFamily: '-apple-system, sans-serif',
          fontSize: '14px',
          fontStyle: 'bold',
          color: '#38bdf8'
        }).setOrigin(0.5);

        this.add.rectangle(w / 2, 60, 220, 24, 0x0f172a).setStrokeStyle(2, 0x334155);
        this.energyFill = this.add.rectangle(w / 2 - 108, 60, 0, 20, 0x00f0ff).setOrigin(0, 0.5);
        this.energyText = this.add.text(w / 2, 60, 'ENERGY 0 / 4', {
          fontFamily: '-apple-system, sans-serif',
          fontSize: '12px',
          fontStyle: 'bold',
          color: '#ffffff'
        }).setOrigin(0.5);
      }

      createChestPedestal(x, y) {
        this.pedestal = this.add.ellipse(x, y + 80, 160, 40, 0x38bdf8, 0.2);
        this.tweens.add({
          targets: this.pedestal,
          scaleX: 1.15,
          alpha: 0.4,
          duration: 1200,
          yoyo: true,
          repeat: -1
        });

        this.egg = this.add.graphics();
        this.drawEgg(0x38bdf8, 0x1d4ed8);
        this.egg.setPosition(x, y);

        this.eggTween = this.tweens.add({
          targets: this.egg,
          y: y - 14,
          duration: 1500,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        this.egg.setInteractive(new Phaser.Geom.Circle(0, 0, 60), Phaser.Geom.Circle.Contains);
        this.egg.on('pointerdown', () => this.handleEggTap());

        this.stageLabel = this.add.text(x, y + 115, '⚡ 點擊下方符文注入能量', {
          fontFamily: 'sans-serif',
          fontSize: '14px',
          fontWeight: 'bold',
          color: '#94a3b8'
        }).setOrigin(0.5);
      }

      drawEgg(topColor, bottomColor) {
        this.egg.clear();
        this.egg.fillStyle(bottomColor, 1);
        this.egg.fillCircle(0, 10, 52);
        this.egg.fillStyle(topColor, 1);
        this.egg.fillCircle(0, -10, 44);
        this.egg.lineStyle(4, 0xffffff, 0.85);
        this.egg.strokeCircle(0, 0, 54);
      }

      createRuneDeck(w, startY) {
        WEEK_DATA.words.forEach((item, idx) => {
          this.createRuneButton(w / 2, startY + idx * 62, item, `word_${idx}`);
        });

        const sentenceY = startY + 3 * 62 + 8;
        this.createSentenceRune(w / 2, sentenceY);
      }

      createRuneButton(x, y, item, key) {
        const container = this.add.container(x, y);
        const bg = this.add.image(0, 0, 'runeBase').setInteractive({ useHandCursor: true });
        
        const textEn = this.add.text(-150, -4, item.display, {
          fontFamily: '-apple-system, sans-serif',
          fontSize: '20px',
          fontStyle: 'bold',
          color: '#ffffff'
        }).setOrigin(0, 0.5);

        const textZh = this.add.text(50, -4, item.zh, {
          fontFamily: 'sans-serif',
          fontSize: '14px',
          color: '#94a3b8'
        }).setOrigin(0, 0.5);

        const icon = this.add.text(145, -4, '🔊', { fontSize: '18px' }).setOrigin(0.5);

        container.add([bg, textEn, textZh, icon]);

        bg.on('pointerdown', () => {
          this.triggerJuicyPress(container);
          this.speak(item.en);
          this.awardEnergy(key, bg, container.x, container.y);
        });
      }

      createSentenceRune(x, y) {
        const container = this.add.container(x, y);
        const bg = this.add.image(0, 0, 'runeBase').setInteractive({ useHandCursor: true });
        
        const label = this.add.text(-150, -14, '📜 通關密碼句：', {
          fontFamily: 'sans-serif',
          fontSize: '11px',
          color: '#38bdf8'
        });

        const sentenceText = this.add.text(-150, 6, WEEK_DATA.sentence.en, {
          fontFamily: '-apple-system, sans-serif',
          fontSize: '15px',
          fontStyle: 'bold',
          color: '#ffffff'
        });

        const icon = this.add.text(145, 0, '⚡', { fontSize: '18px' }).setOrigin(0.5);

        container.add([bg, label, sentenceText, icon]);

        bg.on('pointerdown', () => {
          this.triggerJuicyPress(container);
          this.speak(WEEK_DATA.sentence.en);
          this.awardEnergy('sentence', bg, container.x, container.y);
        });
      }

      triggerJuicyPress(target) {
        this.tweens.add({
          targets: target,
          scaleX: 0.94,
          scaleY: 0.94,
          duration: 80,
          yoyo: true,
          ease: 'Quad.easeInOut'
        });
      }

      awardEnergy(key, bgImage, originX, originY) {
        this.playAudioSynth(880, 'sine', 0.15);

        if (!this.completedItems.has(key)) {
          this.completedItems.add(key);
          bgImage.setTexture('runeCharged');
          this.chargedCount++;

          const progressRatio = this.chargedCount / this.maxCharges;
          this.tweens.add({
            targets: this.energyFill,
            width: 216 * progressRatio,
            duration: 300,
            ease: 'Cubic.easeOut'
          });
          this.energyText.setText(`ENERGY ${this.chargedCount} / ${this.maxCharges}`);

          this.particleEmitter.explode(16, originX, originY);
          this.tweens.add({
            targets: { x: originX, y: originY },
            x: this.egg.x,
            y: this.egg.y,
            duration: 400,
            onUpdate: (tween) => {
              const val = tween.getValue();
              this.particleEmitter.emitParticleAt(val.x, val.y);
            }
          });

          if (this.chargedCount === this.maxCharges) {
            this.setEggUltraReady();
          }
        }
      }

      setEggUltraReady() {
        this.drawEgg(0xfde047, 0xea580c);
        this.eggTween.stop();

        this.tweens.add({
          targets: this.egg,
          scaleX: 1.15,
          scaleY: 0.9,
          angle: 12,
          duration: 90,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        this.stageLabel.setText('🔥 能量已滿！點擊狂暴開蛋！').setColor('#facc15');
        this.playAudioSynth(587.33, 'triangle', 0.4);
      }

      handleEggTap() {
        if (this.chargedCount < this.maxCharges) {
          this.cameras.main.shake(120, 0.01);
          this.playAudioSynth(220, 'square', 0.15);
          return;
        }

        this.cameras.main.shake(400, 0.035);
        this.cameras.main.flash(450, 255, 255, 255);
        this.playVictoryFanfare();

        const loot = PET_ROSTER[Math.floor(Math.random() * PET_ROSTER.length)];
        this.showGachaCardModal(loot);
      }

      showGachaCardModal(loot) {
        const W = this.cameras.main.width;
        const H = this.cameras.main.height;

        const overlay = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.88).setInteractive();
        const cardBox = this.add.container(W / 2, H / 2);

        const cardBg = this.add.rectangle(0, 0, 310, 420, 0x111827).setStrokeStyle(4, loot.color);
        const rarityBadge = this.add.text(0, -170, `★ ${loot.rarity} ★`, {
          fontFamily: '-apple-system, sans-serif',
          fontSize: '14px',
          fontStyle: 'bold',
          color: '#ffffff'
        }).setOrigin(0.5);

        const orb = this.add.circle(0, -70, 56, loot.color, 0.85);
        this.tweens.add({
          targets: orb,
          scale: 1.12,
          duration: 800,
          yoyo: true,
          repeat: -1
        });

        const nameLabel = this.add.text(0, 15, loot.name, {
          fontFamily: '-apple-system, sans-serif',
          fontSize: '18px',
          fontStyle: 'bold',
          color: '#ffffff',
          align: 'center'
        }).setOrigin(0.5);

        const powerLabel = this.add.text(0, 45, `⚡ POWER: ${loot.power}`, {
          fontFamily: '-apple-system, sans-serif',
          fontSize: '15px',
          color: '#facc15'
        }).setOrigin(0.5);

        const quoteLabel = this.add.text(0, 95, loot.quote, {
          fontFamily: 'sans-serif',
          fontSize: '12px',
          color: '#cbd5e1',
          wordWrap: { width: 260 },
          align: 'center'
        }).setOrigin(0.5);

        const passText = this.add.text(0, 145, '✓ 今日跟讀通關！拿給阿嬤看換遊戲時間', {
          fontFamily: 'sans-serif',
          fontSize: '11px',
          fontWeight: 'bold',
          color: '#86efac'
        }).setOrigin(0.5);

        const closeBtn = this.add.rectangle(0, 185, 200, 38, 0x22c55e).setInteractive({ useHandCursor: true });
        const closeTxt = this.add.text(0, 185, '收進圖鑑背包', {
          fontFamily: 'sans-serif',
          fontSize: '14px',
          fontWeight: 'bold',
          color: '#052e16'
        }).setOrigin(0.5);

        cardBox.add([cardBg, rarityBadge, orb, nameLabel, powerLabel, quoteLabel, passText, closeBtn, closeTxt]);

        cardBox.setScale(0);
        this.tweens.add({
          targets: cardBox,
          scale: 1,
          duration: 350,
          ease: 'Back.easeOut'
        });

        closeBtn.on('pointerdown', () => {
          overlay.destroy();
          cardBox.destroy();
        });
      }

      speak(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'en-US';
          utter.rate = 0.8;
          window.speechSynthesis.speak(utter);
        }
      }

      playAudioSynth(freq, type, duration) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      }

      playVictoryFanfare() {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playAudioSynth(freq, 'triangle', 0.3), idx * 90);
        });
      }
    }

    // 啟動高畫質 Phaser 3 配置 (開啟 Retina 2x 高解析度適配)
    const config = {
      type: Phaser.AUTO,
      parent: 'game-canvas-container',
      width: 400,
      height: 720,
      resolution: Math.min(window.devicePixelRatio || 1, 2), // 高解析度防模糊
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      scene: GameScene
    };

    window.addEventListener('load', () => {
      new Phaser.Game(config);
    });
  </script>
</body>
</html>
