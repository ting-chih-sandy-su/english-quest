<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ROBLOX ARCADE: 任務大冒險</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090e1a;
      --card-bg: #1e293b;
      --gold: #facc15;
      --cyan: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --border-dark: #334155;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #070a13 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-viewport {
      width: 100%;
      max-width: 420px;
      height: 98vh;
      max-height: 840px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 12px;
      position: relative;
      z-index: 10;
    }

    /* 頂部導航 */
    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .quest-tabs-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quest-tabs-scroll::-webkit-scrollbar { display: none; }

    .q-btn {
      background: var(--card-bg);
      border: 2px solid var(--border-dark);
      color: var(--text-sub);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .q-btn.active {
      background: var(--cyan);
      color: #0b1120;
      border-color: #0284c7;
    }

    .action-icons-group { display: flex; gap: 6px; }

    .pill-btn {
      background: #1e293b;
      border: 2px solid var(--border-dark);
      color: #fff;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .pill-btn.bag-btn { background: linear-gradient(180deg, #ec4899, #be185d); border-color: #831843; }
    .pill-btn.elder-btn { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; color: #86efac; }
    .pill-btn.elder-btn.active { background: #22c55e; color: #052e16; }

    /* 模式選單 */
    .game-modes-deck {
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.6);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--border-dark);
    }
    .g-mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 5px 6px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .g-mode-btn.active { background: var(--gold); color: #0b1120; }

    .elder-helper-banner {
      display: none;
      background: linear-gradient(135deg, rgba(22, 101, 52, 0.95), rgba(15, 23, 42, 0.95));
      border: 2px solid var(--green);
      border-radius: 14px;
      padding: 8px 12px;
      color: #d1fae5;
      font-size: 0.82rem;
      line-height: 1.4;
    }
    .elder-helper-banner.show { display: block; }
    .elder-helper-banner strong { color: #86efac; }

    /* 真正的遊戲舞台區域 */
    .stage-arena {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
      border: 2px solid var(--border-dark);
      box-shadow: 0 4px 0 #000;
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      position: relative;
    }

    .stage-instruction-box {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 8px;
      text-align: center;
    }

    /* ── 模式 1：節奏縮圈開蛋 ── */
    .rhythm-arena {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .rhythm-target-ring {
      position: absolute;
      width: 90px;
      height: 90px;
      border: 4px dashed var(--gold);
      border-radius: 50%;
    }
    .rhythm-shrink-ring {
      position: absolute;
      width: 140px;
      height: 140px;
      border: 3px solid var(--cyan);
      border-radius: 50%;
      pointer-events: none;
    }
    .rhythm-shrink-ring.animating {
      animation: shrinkCircle 1.2s infinite linear;
    }
    @keyframes shrinkCircle {
      0% { width: 140px; height: 140px; opacity: 1; }
      70% { width: 90px; height: 90px; border-color: var(--gold); }
      100% { width: 40px; height: 40px; opacity: 0; }
    }
    .rhythm-egg { font-size: 3rem; }

    /* ── 模式 2：聽音解鎖密碼門 ── */
    .doors-arena {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .door-display-header {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--cyan);
    }
    .door-options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
    }
    .door-choice-btn {
      background: #0f172a;
      border: 2px solid var(--border-dark);
      color: #fff;
      padding: 8px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .door-choice-btn:active { background: #334155; }

    /* ── 模式 3：指針力量條格鬥 ── */
    .slap-arena {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .gauge-track {
      width: 100%;
      height: 24px;
      background: linear-gradient(90deg, #ef4444 0%, #facc15 60%, #22c55e 80%, #ef4444 100%);
      border-radius: 999px;
      position: relative;
      border: 2px solid #000;
      overflow: hidden;
    }
    .gauge-needle {
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 8px #fff;
      transition: left 0.05s linear;
    }
    .punch-btn {
      background: linear-gradient(180deg, #ef4444, #991b1b);
      border: none;
      color: #fff;
      padding: 8px 24px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
    }
    .punch-btn:active { transform: scale(0.95); }

    /* ── 模式 4：手動煞車拉霸 ── */
    .slot-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .slot-reels-row {
      display: flex;
      gap: 10px;
    }
    .reel-box {
      width: 60px;
      height: 70px;
      background: #0f172a;
      border: 3px solid var(--gold);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .reel-box.spin { animation: spinBlur 0.08s infinite; }
    @keyframes spinBlur { 0% { transform: translateY(-3px); } 100% { transform: translateY(3px); } }
    .stop-reel-btn {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 6px 16px;
      border-radius: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    /* 任務牌組 */
    .tasks-deck {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .task-card {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 2px solid var(--border-dark);
      border-radius: 12px;
      padding: 8px 12px;
    }
    .task-card.charged { border-color: var(--green); background: linear-gradient(180deg, #14532d, #052e16); }

    .task-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .word-en { font-size: 1.15rem; font-weight: 800; }
    .word-zh { font-size: 0.8rem; color: var(--text-sub); }

    .play-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(180deg, #0284c7, #0369a1);
      border: 1.5px solid var(--cyan);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .hint-trigger {
      display: inline-flex;
      margin-top: 3px;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 5px;
      cursor: pointer;
    }
    .hint-drawer {
      display: none;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px dashed var(--border-dark);
      font-size: 0.78rem;
      color: #e2e8f0;
      line-height: 1.35;
    }
    .hint-drawer.open { display: block; }

    .sentence-card {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 2px solid var(--border-dark);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sentence-card.charged { border-color: var(--gold); background: linear-gradient(180deg, #713f12, #451a03); }

    /* 彈窗 Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #1e293b, #090e1a);
      border: 3px solid var(--gold);
      border-radius: 22px;
      padding: 18px 16px;
      text-align: center;
    }
    .rarity-pill {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.75rem;
      margin-bottom: 6px;
    }
    .r-mythic { background: linear-gradient(90deg, #ec4899, #8b5cf6); color: #fff; }
    .r-legendary { background: linear-gradient(90deg, #f59e0b, #ef4444); color: #fff; }
    .r-rare { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: #fff; }
    .r-common { background: #64748b; color: #fff; }

    .loot-icon { font-size: 3.8rem; margin: 4px 0; }
    .loot-name { font-size: 1.35rem; font-weight: 900; }
    .loot-power { font-size: 0.95rem; color: var(--gold); font-weight: 800; margin: 2px 0 6px; }

    .close-btn {
      width: 100%;
      background: linear-gradient(180deg, var(--green), #15803d);
      border: none;
      color: #fff;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
    }

    .bag-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-height: 48vh;
      overflow-y: auto;
      margin: 12px 0;
      padding: 2px;
    }
    .bag-cell {
      background: #0f172a;
      border: 1.5px solid var(--border-dark);
      border-radius: 10px;
      padding: 6px 2px;
      text-align: center;
    }
    .bag-cell.unlocked { border-color: var(--gold); background: #1e293b; }
    .bag-cell.locked { opacity: 0.35; filter: grayscale(1); }

    #flash-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.15s ease-out;
    }
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 101;
    }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="app-viewport">
    
    <!-- 頂部導航 -->
    <div class="control-header">
      <div class="quest-tabs-scroll" id="quest-nav-box"></div>
      <div class="action-icons-group">
        <button class="pill-btn elder-btn" id="elder-btn" onclick="toggleElderGuide()">👵 長輩指南</button>
        <button class="pill-btn bag-btn" onclick="openBagModal()">🎒 萬物圖鑑</button>
      </div>
    </div>

    <!-- 4 大模式選單 -->
    <div class="game-modes-deck">
      <button class="g-mode-btn active" onclick="setMode('EGG', this)">🥚 節奏縮圈開蛋</button>
      <button class="g-mode-btn" onclick="setMode('DOORS', this)">🚪 聽音解鎖破門</button>
      <button class="g-mode-btn" onclick="setMode('SLAP', this)">🥊 極限力量格鬥</button>
      <button class="g-mode-btn" onclick="setMode('SLOT', this)">🎰 手動煞車拉霸</button>
    </div>

    <div class="elder-helper-banner" id="elder-guide-box">
      <strong>長輩請放心：</strong><br>
      請看孩子點擊下方單字聽發音練習。累積足夠能量後，挑戰上方小遊戲過關才能抽卡！
    </div>

    <!-- 真正的動態小遊戲舞台 -->
    <div class="stage-arena" id="game-stage-arena"></div>

    <!-- 下方題庫 -->
    <div class="tasks-deck">
      <div id="words-deck" style="display: flex; flex-direction: column; gap: 6px;"></div>
      
      <div class="sentence-card" id="sentence-card">
        <div>
          <div style="font-size:0.7rem; color:var(--gold); font-weight:800;">📜 本週密碼句</div>
          <div style="font-size:0.95rem; font-weight:800;" id="target-sentence-en"></div>
          <div style="font-size:0.78rem; color:var(--text-sub);" id="target-sentence-zh"></div>
        </div>
        <div class="play-btn" onclick="handleSentenceClick()">🔊</div>
      </div>
    </div>

  </div>

  <!-- 抽卡 Modal -->
  <div class="modal-overlay" id="loot-modal">
    <div class="modal-box">
      <span class="rarity-pill" id="loot-rarity">神話級 MYTHIC</span>
      <div class="loot-icon" id="loot-icon">🐉</div>
      <div class="loot-name" id="loot-name">彩虹神龍</div>
      <div class="loot-power" id="loot-power">⚡ 戰鬥力: 999,999</div>
      <div class="close-btn" style="margin-top:12px;" onclick="closeLootModal()">收進萬物圖鑑 🎮</div>
    </div>
  </div>

  <!-- 萬物圖鑑 Modal -->
  <div class="modal-overlay" id="bag-modal">
    <div class="modal-box">
      <h3 style="font-size: 1.2rem; color: var(--gold);">🎒 萬物收集圖鑑庫</h3>
      <div style="font-size: 0.78rem; color: var(--text-sub); margin-top: 4px;">
        已解鎖進度：<span id="bag-progress">0</span> / 1,000 種全服圖鑑
      </div>
      <div class="bag-grid" id="bag-grid"></div>
      <button class="close-btn" onclick="closeBagModal()">返回任務</button>
    </div>
  </div>

  <script>
    const ALL_QUESTS = [
      {
        id: "w4",
        label: "第 4 關",
        words: [
          { en: "rain", display: "r · ain", zh: "下雨", hint: "發音重點：ai 發長母音 /eɪ/，拼寫拆為 r + ain。" },
          { en: "weather", display: "wea · ther", zh: "天氣", hint: "音節拆解：wea-（短母音 /ɛ/）+ -ther（咬舌濁音 /ðər/）。" },
          { en: "outside", display: "out · side", zh: "外面", hint: "複合字：out（出去）+ side（邊/面）＝ 外面。" }
        ],
        sentence: { en: "It is raining outside.", zh: "外面正在下雨。" }
      },
      {
        id: "w3",
        label: "第 3 關 (複習)",
        words: [
          { en: "happy", display: "hap · py", zh: "高興的", hint: "雙子音 pp，前母音 a 發蝴蝶音 /æ/。" },
          { en: "school", display: "school", zh: "學校", hint: "ch 在這裡發硬音 /k/，oo 發長母音 /u/。" },
          { en: "friend", display: "friend", zh: "朋友", hint: "ie 在此發短母音 /ɛ/，結尾 d 輕聲釋放。" }
        ],
        sentence: { en: "I see my friend at school.", zh: "我在學校看到我的朋友。" }
      }
    ];

    const FULL_CATALOG = [];
    const SPECIES = ["彩虹神龍", "黃金香蕉狗", "暴風獨角獸", "駭客貓", "馬桶怪", "生吐司", "霸王暴龍", "爆破西瓜"];
    for (let i = 1; i <= 60; i++) {
      FULL_CATALOG.push({
        id: `pet_${i}`,
        num: `#${String(i).padStart(4, '0')}`,
        name: SPECIES[(i - 1) % SPECIES.length],
        rarity: i % 10 === 0 ? "神話級 MYTHIC" : i % 3 === 0 ? "傳奇級 LEGENDARY" : "稀有級 RARE",
        rClass: i % 10 === 0 ? "r-mythic" : i % 3 === 0 ? "r-legendary" : "r-rare",
        icon: ["🐉","🐕","🦄","🐱","🚽","🍞","🦖","🍉"][(i - 1) % 8],
        power: `⚡ ${(50000 + i * 2500).toLocaleString()}`
      });
    }

    let currentQuestIdx = 0;
    let currentMode = 'EGG';
    let energyCount = 0;
    let unlockedPets = JSON.parse(localStorage.getItem("unlocked_catalog_ids") || '["pet_1"]');

    // 迷你遊戲內部狀態
    let rhythmCombo = 0;
    let gaugeInterval = null;
    let gaugePos = 0;
    let gaugeDir = 1;
    let slotSpinning = false;

    function initQuestNav() {
      const box = document.getElementById("quest-nav-box");
      box.innerHTML = "";
      ALL_QUESTS.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = `q-btn ${idx === currentQuestIdx ? 'active' : ''}`;
        btn.innerText = q.label;
        btn.onclick = () => switchQuest(idx);
        box.appendChild(btn);
      });
    }

    function switchQuest(idx) {
      currentQuestIdx = idx;
      initQuestNav();
      loadQuest(ALL_QUESTS[idx]);
    }

    function loadQuest(quest) {
      energyCount = 0;
      document.querySelectorAll(".task-card, .sentence-card").forEach(el => el.classList.remove("charged"));
      document.getElementById("target-sentence-en").innerText = quest.sentence.en;
      document.getElementById("target-sentence-zh").innerText = quest.sentence.zh;

      const wordsBox = document.getElementById("words-deck");
      wordsBox.innerHTML = "";
      quest.words.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "task-card";
        card.id = `card-word-${idx}`;
        card.innerHTML = `
          <div class="task-row">
            <div>
              <div class="word-en">${item.display}</div>
              <div class="word-zh">${item.zh}</div>
            </div>
            <div class="play-btn" onclick="handleWordClick(${idx}, '${item.en}')">🔊</div>
          </div>
          <div class="hint-trigger" onclick="toggleHint(this)">💡 音素提示</div>
          <div class="hint-drawer">${item.hint}</div>
        `;
        wordsBox.appendChild(card);
      });

      renderMiniGame();
    }

    function toggleHint(btn) {
      const drawer = btn.nextElementSibling;
      const isOpen = drawer.classList.toggle("open");
      btn.innerText = isOpen ? "收合提示" : "💡 音素提示";
    }

    function setMode(modeKey, btn) {
      currentMode = modeKey;
      document.querySelectorAll(".g-mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      clearInterval(gaugeInterval);
      renderMiniGame();
    }

    // ========================================================
    // 渲染四大真正不同的小遊戲
    // ========================================================
    function renderMiniGame() {
      const arena = document.getElementById("game-stage-arena");
      clearInterval(gaugeInterval);

      if (currentMode === 'EGG') {
        // 模式 1：節奏縮圈打擊
        arena.innerHTML = `
          <div class="stage-instruction-box">🎯 縮圈對準金框瞬間點擊！連擊 3 次破蛋！</div>
          <div class="rhythm-arena" onclick="handleRhythmTap()">
            <div class="rhythm-target-ring"></div>
            <div class="rhythm-shrink-ring animating" id="shrink-ring"></div>
            <div class="rhythm-egg">🥚</div>
          </div>
          <div style="font-size:0.8rem; margin-top:8px; color:var(--cyan);">連擊 Combo: <span id="rhythm-combo">0</span> / 3</div>
        `;
      } else if (currentMode === 'DOORS') {
        // 模式 2：聽音密碼門
        const currentQuest = ALL_QUESTS[currentQuestIdx];
        const randomTarget = currentQuest.words[Math.floor(Math.random() * currentQuest.words.length)];
        arena.innerHTML = `
          <div class="doors-arena">
            <div class="door-display-header">🚪 密室安全門 01</div>
            <div style="font-size:0.8rem; color:var(--gold);">🔊 點擊按鈕聽音，選出正確單字破鎖！</div>
            <button class="pill-btn" style="margin:4px 0;" onclick="speakTTS('${randomTarget.en}')">▶️ 播放破門密碼音</button>
            <div class="door-options-grid">
              ${currentQuest.words.map(w => `
                <button class="door-choice-btn" onclick="checkDoorPass('${w.en}', '${randomTarget.en}')">${w.en}</button>
              `).join('')}
            </div>
          </div>
        `;
      } else if (currentMode === 'SLAP') {
        // 模式 3：指針力量條格鬥
        arena.innerHTML = `
          <div class="slap-arena">
            <div style="font-size:2.8rem;" id="monster-icon">👾</div>
            <div class="gauge-track">
              <div class="gauge-needle" id="gauge-needle"></div>
            </div>
            <button class="punch-btn" onclick="handlePunch()">💥 出拳！停在綠色 99%</button>
            <div style="font-size:0.75rem; color:var(--text-sub);">必須命中綠色區域才能造成傷害！</div>
          </div>
        `;
        startGaugeAnim();
      } else if (currentMode === 'SLOT') {
        // 模式 4：手動煞車拉霸
        arena.innerHTML = `
          <div class="slot-arena">
            <div class="slot-reels-row">
              <div class="reel-box spin" id="r1">💎</div>
              <div class="reel-box spin" id="r2">7️⃣</div>
              <div class="reel-box spin" id="r3">👑</div>
            </div>
            <button class="stop-reel-btn" onclick="handleSlotStop()">🛑 手動緊急煞車！</button>
            <div style="font-size:0.75rem; color:var(--text-sub);">眼明手快煞車，拼出連線大獎！</div>
          </div>
        `;
        slotSpinning = true;
      }
    }

    // ── 模式 1 邏輯：節奏判定 ──
    function handleRhythmTap() {
      // 依據動畫週期進行時間判定 (約在 70% 附近為 Perfect)
      playCoinSound();
      rhythmCombo++;
      document.getElementById("rhythm-combo").innerText = rhythmCombo;
      if (rhythmCombo >= 3) {
        rhythmCombo = 0;
        executeLootDrop();
      }
    }

    // ── 模式 2 邏輯：聽音破門 ──
    function checkDoorPass(selected, correct) {
      if (selected === correct) {
        playFanfareSound();
        alert("🎉 密碼破解成功！大門開啟！");
        executeLootDrop();
      } else {
        playBuzzerSound();
        alert("❌ 聽錯了！警報響起，請再聽一次！");
      }
    }

    // ── 模式 3 邏輯：力量指針 ──
    function startGaugeAnim() {
      gaugePos = 0;
      gaugeDir = 4;
      gaugeInterval = setInterval(() => {
        gaugePos += gaugeDir;
        if (gaugePos >= 95 || gaugePos <= 0) gaugeDir = -gaugeDir;
        const needle = document.getElementById("gauge-needle");
        if (needle) needle.style.left = `${gaugePos}%`;
      }, 30);
    }

    function handlePunch() {
      clearInterval(gaugeInterval);
      if (gaugePos >= 65 && gaugePos <= 85) {
        // 命中綠色區域
        playChestSound();
        document.getElementById("monster-icon").innerText = "💥";
        setTimeout(executeLootDrop, 400);
      } else {
        playBuzzerSound();
        alert("力量太弱或揮空了！重來！");
        startGaugeAnim();
      }
    }

    // ── 模式 4 邏輯：拉霸手動煞車 ──
    function handleSlotStop() {
      if (!slotSpinning) return;
      slotSpinning = false;
      playChestSound();
      document.getElementById("r1").classList.remove("spin");
      document.getElementById("r2").classList.remove("spin");
      document.getElementById("r3").classList.remove("spin");
      document.getElementById("r1").innerText = "7️⃣";
      document.getElementById("r2").innerText = "7️⃣";
      document.getElementById("r3").innerText = "7️⃣";
      setTimeout(executeLootDrop, 500);
    }

    // 題庫點擊發音
    function handleWordClick(idx, word) {
      playCoinSound();
      speakTTS(word);
      document.getElementById(`card-word-${idx}`).classList.add("charged");
    }

    function handleSentenceClick() {
      const sentence = ALL_QUESTS[currentQuestIdx].sentence.en;
      playCoinSound();
      speakTTS(sentence);
      document.getElementById("sentence-card").classList.add("charged");
    }

    // 掉落與開獎
    function executeLootDrop() {
      triggerWhiteFlash();
      playFanfareSound();
      launchConfetti();

      const loot = FULL_CATALOG[Math.floor(Math.random() * FULL_CATALOG.length)];
      if (!unlockedPets.includes(loot.id)) {
        unlockedPets.push(loot.id);
        localStorage.setItem("unlocked_catalog_ids", JSON.stringify(unlockedPets));
      }

      document.getElementById("loot-rarity").innerText = `${loot.num} · ${loot.rarity}`;
      document.getElementById("loot-rarity").className = `rarity-pill ${loot.rClass}`;
      document.getElementById("loot-icon").innerText = loot.icon;
      document.getElementById("loot-name").innerText = loot.name;
      document.getElementById("loot-power").innerText = loot.power;

      document.getElementById("loot-modal").style.display = "flex";
    }

    function closeLootModal() {
      document.getElementById("loot-modal").style.display = "none";
      renderMiniGame();
    }

    function openBagModal() {
      const box = document.getElementById("bag-grid");
      box.innerHTML = "";
      document.getElementById("bag-progress").innerText = unlockedPets.length;
      FULL_CATALOG.forEach(p => {
        const isUnlocked = unlockedPets.includes(p.id);
        const cell = document.createElement("div");
        cell.className = `bag-cell ${isUnlocked ? 'unlocked' : 'locked'}`;
        cell.innerHTML = `
          <div style="font-size:0.6rem; color:#94a3b8;">${p.num}</div>
          <div style="font-size:1.5rem;">${isUnlocked ? p.icon : '❓'}</div>
          <div style="font-size:0.68rem; font-weight:700;">${isUnlocked ? p.name : '未解鎖'}</div>
        `;
        box.appendChild(cell);
      });
      document.getElementById("bag-modal").style.display = "flex";
    }

    function closeBagModal() {
      document.getElementById("bag-modal").style.display = "none";
    }

    function toggleElderGuide() {
      const banner = document.getElementById("elder-guide-box");
      const btn = document.getElementById("elder-btn");
      const isShow = banner.classList.toggle("show");
      btn.classList.toggle("active", isShow);
    }

    function speakTTS(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.8;
        window.speechSynthesis.speak(utter);
      }
    }

    function triggerWhiteFlash() {
      const flash = document.getElementById("flash-overlay");
      flash.style.opacity = "0.9";
      setTimeout(() => { flash.style.opacity = "0"; }, 250);
    }

    function playCoinSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(987.77, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
    }

    function playBuzzerSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function playFanfareSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.2);
          osc.start(ctx.currentTime + i * 0.1);
          osc.stop(ctx.currentTime + i * 0.1 + 0.2);
        });
      } catch (e) {}
    }

    function playChestSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.06);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.06 + 0.25);
          osc.start(ctx.currentTime + idx * 0.06);
          osc.stop(ctx.currentTime + idx * 0.06 + 0.25);
        });
      } catch (e) {}
    }

    function launchConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const pieces = [];
      const colors = ["#facc15", "#38bdf8", "#22c55e", "#ef4444"];
      for (let i = 0; i < 70; i++) {
        pieces.push({
          x: canvas.width / 2, y: canvas.height / 2,
          r: Math.random() * 5 + 3,
          dx: (Math.random() - 0.5) * 12, dy: (Math.random() - 0.8) * 14,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.dx; p.y += p.dy; p.dy += 0.35;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color; ctx.fill();
        });
        frame++;
        if (frame < 90) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    window.addEventListener("DOMContentLoaded", () => {
      initQuestNav();
      loadQuest(ALL_QUESTS[0]);
    });
  </script>
</body>
</html>
