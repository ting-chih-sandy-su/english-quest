<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROBLOX: PET QUEST 99</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #facc15;
      --gold-dark: #b45309;
      --cyan: #38bdf8;
      --cyan-dark: #0369a1;
      --green: #22c55e;
      --green-dark: #15803d;
      --bg: #090d16;
      --card-bg: #151d30;
      --card-border: #22314e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 15%, #1e293b 0%, #090d16 80%),
        linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* 手機/居中容器：保證在電腦與手機上都不會跑版 */
    .game-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    /* 頂部 HUD */
    .top-hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      box-shadow: 0 4px 0 #000;
      border-radius: 18px;
      padding: 8px 14px;
    }
    .hud-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.5px;
    }
    .hud-energy {
      background: #090d16;
      border: 2px solid var(--card-border);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--cyan);
    }

    /* 中央開蛋舞台 */
    .stage-container {
      width: 100%;
      background: radial-gradient(circle at center, #1b253b 0%, #0d1322 100%);
      border: 3px solid var(--card-border);
      box-shadow: 0 8px 0 #000, 0 12px 30px rgba(0,0,0,0.5);
      border-radius: 26px;
      padding: 24px 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 巨大開箱蛋（向量純淨高清，保證置中且絕不模糊） */
    .egg-anchor {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .egg-body {
      width: 120px;
      height: 155px;
      background: radial-gradient(circle at 35% 30%, #93c5fd 0%, #2563eb 60%, #1d4ed8 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      border: 5px solid #ffffff;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5), inset -8px -8px 0 rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: floatEgg 2.5s ease-in-out infinite;
    }
    @keyframes floatEgg {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* 蛋集滿 4 顆能量後的狂暴發光震動 */
    .egg-anchor.ready .egg-body {
      background: radial-gradient(circle at 35% 30%, #fef08a 0%, #f59e0b 60%, #b45309 100%);
      box-shadow: 0 0 45px rgba(245, 158, 11, 0.9), inset -8px -8px 0 rgba(0,0,0,0.3);
      border-color: #fff;
      animation: wildShake 0.35s infinite alternate;
    }
    @keyframes wildShake {
      0% { transform: rotate(-7deg) scale(1.06); }
      100% { transform: rotate(7deg) scale(1.06); }
    }

    .egg-pedestal {
      width: 140px;
      height: 24px;
      background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.4) 0%, transparent 70%);
      border-radius: 50%;
    }

    .stage-hint {
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--cyan);
      text-align: center;
    }

    /* 任務符文列表 */
    .task-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-box {
      background: linear-gradient(180deg, #1b2438, #111827);
      border: 3px solid var(--card-border);
      box-shadow: 0 5px 0 #000;
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s, border-color 0.2s;
    }
    .task-box:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #000;
    }
    .task-box.done {
      border-color: var(--green);
      background: linear-gradient(180deg, #14532d, #052e16);
      box-shadow: 0 5px 0 #022c22;
    }

    .word-en {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .word-zh {
      font-size: 0.92rem;
      color: #94a3b8;
      font-weight: 700;
      margin-top: 2px;
    }
    .task-box.done .word-zh { color: #86efac; }

    .sound-icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(180deg, #0284c7, #0369a1);
      border: 2px solid #38bdf8;
      box-shadow: 0 3px 0 #075985;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .task-box.done .sound-icon-badge {
      background: linear-gradient(180deg, var(--green), var(--green-dark));
      border-color: #86efac;
      box-shadow: 0 3px 0 #14532d;
    }

    /* 句子卡片 */
    .sentence-box {
      background: linear-gradient(180deg, #1b2438, #111827);
      border: 3px solid var(--card-border);
      box-shadow: 0 5px 0 #000;
      border-radius: 18px;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .sentence-box:active { transform: translateY(3px); box-shadow: 0 2px 0 #000; }
    .sentence-box.done {
      border-color: var(--gold);
      background: linear-gradient(180deg, #713f12, #451a03);
      box-shadow: 0 5px 0 #271001;
    }
    .sentence-header {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--gold);
    }
    .sentence-text {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }
    .sentence-sub {
      font-size: 0.88rem;
      color: #94a3b8;
      font-weight: 700;
    }

    /* Gacha 抽卡結果全螢幕 Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(180deg, #1e293b, #090e1a);
      border: 4px solid var(--gold);
      box-shadow: 0 0 50px rgba(250, 204, 21, 0.5), 0 10px 0 #000;
      border-radius: 28px;
      padding: 24px 20px;
      text-align: center;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.6) rotate(-8deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .card-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.82rem;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .r-mythic { background: linear-gradient(90deg, #ec4899, #8b5cf6); color: #fff; }
    .r-legendary { background: linear-gradient(90deg, #f59e0b, #ef4444); color: #fff; }
    .r-rare { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: #fff; }
    .r-common { background: #64748b; color: #fff; }

    .card-avatar {
      font-size: 4.8rem;
      margin: 8px 0;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .card-name { font-size: 1.6rem; font-weight: 900; color: #fff; }
    .card-power { font-size: 1.1rem; color: var(--gold); font-weight: 800; margin: 4px 0 10px; }
    .card-desc {
      background: rgba(0,0,0,0.4);
      border-radius: 12px;
      padding: 10px;
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .grandparent-box {
      background: rgba(34, 197, 94, 0.2);
      border: 2px dashed var(--green);
      border-radius: 14px;
      padding: 10px;
      color: #86efac;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .close-btn {
      width: 100%;
      background: linear-gradient(180deg, var(--green), var(--green-dark));
      border: 3px solid #14532d;
      box-shadow: 0 5px 0 #052e16;
      color: #fff;
      padding: 14px;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
    }
    .close-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #052e16; }

    /* 開箱白閃 */
    #flash {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.15s ease-out;
    }

    #confetti {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 101;
    }
  </style>
</head>
<body>

  <div id="flash"></div>
  <canvas id="confetti"></canvas>

  <div class="game-wrapper">
    
    <!-- 頂部資訊 -->
    <div class="top-hud">
      <div class="hud-title">⚔️ ROBLOX 幸運蛋開箱</div>
      <div class="hud-energy" id="energy-badge">能量 0 / 4</div>
    </div>

    <!-- 舞台開蛋區 (100% 絕對居中) -->
    <div class="stage-container">
      <div class="egg-anchor" id="egg-target" onclick="hatchEgg()">
        <div class="egg-body" id="egg-visual">
          <span id="egg-icon">🔒</span>
        </div>
      </div>
      <div class="egg-pedestal"></div>
      <div class="stage-hint" id="stage-desc">點擊下方 3 個字 + 1 句話注滿能量！</div>
    </div>

    <!-- 任務清單 -->
    <div class="task-container">
      <div id="words-box" style="display: flex; flex-direction: column; gap: 10px;"></div>

      <div class="sentence-box" id="sentence-card" onclick="tapSentence()">
        <div class="sentence-header">📜 通關密碼句 (點擊聽讀)</div>
        <div class="sentence-text" id="sentence-en"></div>
        <div class="sentence-sub" id="sentence-zh"></div>
      </div>
    </div>

  </div>

  <!-- 抽卡彈窗 -->
  <div class="modal-overlay" id="gacha-modal">
    <div class="modal-card">
      <span class="card-badge" id="c-badge">神話級 MYTHIC</span>
      <div class="card-avatar" id="c-icon">🐉</div>
      <div class="card-name" id="c-name">彩虹機械神龍</div>
      <div class="card-power" id="c-power">⚡ 戰鬥力: 999,999</div>
      <div class="card-desc" id="c-desc">全服爆率只有 0.1% 的極品神寵！</div>
      
      <div class="grandparent-box">
        ✨ <strong>今日任務已通關！</strong><br>
        把這個金色神寵給阿公阿嬤看，去玩你的 Roblox 吧！
      </div>

      <button class="close-btn" onclick="closeModal()">收進背包 🎮</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 每週更新專區 (下課換這裡即可)
    // ==========================================
    const WEEK_DATA = {
      words: [
        { en: "rain", display: "r · ain", zh: "下雨" },
        { en: "weather", display: "wea · ther", zh: "天氣" },
        { en: "outside", display: "out · side", zh: "外面" }
      ],
      sentence: {
        en: "It is raining outside.",
        zh: "外面正在下雨。"
      }
    };

    // 掉落神寵庫
    const PET_POOL = [
      { name: "彩虹霸王龍", rarity: "神話級 MYTHIC", rClass: "r-mythic", icon: "🦖", power: "⚡ 888,888", desc: "自帶彩虹軌跡的終極神龍，走到哪亮到哪。" },
      { name: "黃金香蕉狗", rarity: "傳奇級 LEGENDARY", rClass: "r-legendary", icon: "🐕", power: "⚡ 65,000", desc: "香蕉皮做的小狗，跑得飛快但容易滑倒。" },
      { name: "暴風雪獨角獸", rarity: "傳奇級 LEGENDARY", rClass: "r-legendary", icon: "🦄", power: "⚡ 52,000", desc: "發射冰錐光束，把無聊的考卷全部凍結！" },
      { name: "發光馬桶怪", rarity: "稀有級 RARE", rClass: "r-rare", icon: "🚽", power: "⚡ 4,800", desc: "按下沖水鍵會發射超強音波攻擊！" },
      { name: "發霉的生吐司", rarity: "普通級 COMMON", rClass: "r-common", icon: "🍞", power: "⚡ 15", desc: "雖然戰鬥力極低，但看起來挺香的。" }
    ];

    let chargedItems = new Set();

    // 渲染
    document.getElementById("sentence-en").innerText = WEEK_DATA.sentence.en;
    document.getElementById("sentence-zh").innerText = WEEK_DATA.sentence.zh;

    const wordsBox = document.getElementById("words-box");
    WEEK_DATA.words.forEach((item, idx) => {
      const box = document.createElement("div");
      box.className = "task-box";
      box.id = `wb-${idx}`;
      box.onclick = () => tapWord(idx, item.en);
      box.innerHTML = `
        <div>
          <div class="word-en">${item.display}</div>
          <div class="word-zh">${item.zh}</div>
        </div>
        <div class="sound-icon-badge" id="ib-${idx}">🔊</div>
      `;
      wordsBox.appendChild(box);
    });

    function tapWord(idx, en) {
      playCoin();
      speak(en);

      const key = `w-${idx}`;
      if (!chargedItems.has(key)) {
        chargedItems.add(key);
        document.getElementById(`wb-${idx}`).classList.add("done");
        document.getElementById(`ib-${idx}`).innerText = "⚡";
        updateProgress();
      }
    }

    function tapSentence() {
      playCoin();
      speak(WEEK_DATA.sentence.en);

      if (!chargedItems.has("sentence")) {
        chargedItems.add("sentence");
        document.getElementById("sentence-card").classList.add("done");
        updateProgress();
      }
    }

    function updateProgress() {
      const count = chargedItems.size;
      document.getElementById("energy-badge").innerText = `能量 ${count} / 4`;

      if (count === 4) {
        const eggTarget = document.getElementById("egg-target");
        eggTarget.classList.add("ready");
        document.getElementById("egg-icon").innerText = "✨";
        document.getElementById("stage-desc").innerText = "🔥 能量充飽！點擊狂暴開蛋！";
        document.getElementById("stage-desc").style.color = "var(--gold)";
        playFanfare();
      }
    }

    function hatchEgg() {
      if (chargedItems.size < 4) {
        alert("請先將 3 個單字和 1 句話聽完，湊滿 4 顆能量！");
        return;
      }

      // 白光與彩帶
      triggerFlash();
      playExplosion();
      fireConfetti();

      const pet = PET_POOL[Math.floor(Math.random() * PET_POOL.length)];
      
      const badge = document.getElementById("c-badge");
      badge.innerText = pet.rarity;
      badge.className = `card-badge ${pet.rClass}`;
      document.getElementById("c-icon").innerText = pet.icon;
      document.getElementById("c-name").innerText = pet.name;
      document.getElementById("c-power").innerText = pet.power;
      document.getElementById("c-desc").innerText = pet.desc;

      document.getElementById("gacha-modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("gacha-modal").style.display = "none";
    }

    // 發音
    function speak(txt) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'en-US';
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
      }
    }

    function triggerFlash() {
      const f = document.getElementById("flash");
      f.style.opacity = "0.9";
      setTimeout(() => { f.style.opacity = "0"; }, 200);
    }

    // 音效
    function playCoin() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(987.77, ctx.currentTime);
        osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function playFanfare() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.3);
          osc.start(ctx.currentTime + i * 0.1);
          osc.stop(ctx.currentTime + i * 0.1 + 0.3);
        });
      } catch (e) {}
    }

    function playExplosion() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [440, 554.37, 659.25, 880, 1108.73];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.07);
          gain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.07 + 0.3);
          osc.start(ctx.currentTime + idx * 0.07);
          osc.stop(ctx.currentTime + idx * 0.07 + 0.3);
        });
      } catch (e) {}
    }

    // 彩帶
    function fireConfetti() {
      const cvs = document.getElementById("confetti");
      const ctx = cvs.getContext("2d");
      cvs.width = window.innerWidth;
      cvs.height = window.innerHeight;

      const p = [];
      const colors = ["#facc15", "#38bdf8", "#22c55e", "#ec4899", "#a855f7"];
      for (let i = 0; i < 90; i++) {
        p.push({
          x: cvs.width / 2,
          y: cvs.height / 2,
          r: Math.random() * 6 + 4,
          dx: (Math.random() - 0.5) * 14,
          dy: (Math.random() - 0.8) * 16,
          c: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      let f = 0;
      function step() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        p.forEach(item => {
          item.x += item.dx;
          item.y += item.dy;
          item.dy += 0.35;
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
          ctx.fillStyle = item.c;
          ctx.fill();
        });
        f++;
        if (f < 100) requestAnimationFrame(step);
        else ctx.clearRect(0, 0, cvs.width, cvs.height);
      }
      step();
    }
  </script>
</body>
</html>
