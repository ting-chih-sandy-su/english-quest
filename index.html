<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文微挑戰</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-focus: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 24px 16px 40px;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 頂部極簡導覽與歷史關卡 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .tabs-wrapper {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }

    .tab-item {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-item.active {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    /* 卡片容器規範 */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .card-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* 單字列表項（極簡原生質感） */
    .word-entry {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: #fafafa;
      transition: background 0.15s;
    }
    .word-entry:last-child { margin-bottom: 0; }

    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-main {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .word-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .play-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.1s;
    }
    .play-btn:active {
      transform: scale(0.95);
      background: var(--primary-light);
    }

    /* 拆解按鈕與展開內容 */
    .hint-trigger {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .hint-drawer {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .hint-drawer.open { display: block; }

    /* 重點句型區塊 */
    .sentence-panel {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .sentence-en {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .sentence-zh {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .full-play-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }
    .full-play-btn:active { background: #f8fafc; }

    /* 長輩提示與完成狀態 */
    .helper-banner {
      background: var(--success-light);
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.85rem;
      color: #15803d;
      line-height: 1.5;
    }
    .helper-banner strong { font-weight: 700; color: #166534; }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
      transition: background 0.15s;
    }
    .submit-btn:active { background: var(--primary-dark); }

    .done-status {
      display: none;
      text-align: center;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .done-status h3 {
      font-size: 1.05rem;
      color: var(--success);
      margin-bottom: 4px;
    }
    .done-status p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="app-shell">
    
    <!-- 頂部乾淨標題 -->
    <div class="top-bar">
      <div class="brand-title" id="page-title">英文隨堂練習</div>
    </div>

    <!-- 歷史週次/關卡切換 -->
    <div class="tabs-wrapper" id="quest-selector"></div>

    <!-- 1. 三個單字卡 -->
    <div class="card">
      <div class="card-label">核心單字</div>
      <div id="words-container"></div>
    </div>

    <!-- 2. 重點句子 -->
    <div class="card">
      <div class="card-label">本週語句</div>
      <div class="sentence-panel">
        <div class="sentence-en" id="sentence-en"></div>
        <div class="sentence-zh" id="sentence-zh"></div>
      </div>
      <button class="full-play-btn" id="sentence-audio-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        播放整句示範
      </button>
    </div>

    <!-- 3. 阿公阿嬤備忘提示（乾淨簡約） -->
    <div class="helper-banner">
      <strong>長輩請放心：</strong>只要孩子跟著發音唸出聲音 3 遍，就可以點擊下方按鈕完成今日練習。
    </div>

    <!-- 4. 打卡狀態 -->
    <button class="submit-btn" id="claim-btn" onclick="finishQuest()">完成今日練習</button>
    
    <div class="done-status" id="done-screen">
      <h3>✓ 今日練習已完成</h3>
      <p>進度已記錄，可以安心休息或自由運用時間。</p>
    </div>

  </div>

  <script>
    // ==========================================
    // ⚙️ 每週下課更新此陣列即可
    // ==========================================
    const allQuests = [
      {
        lessonNumber: "第 4 堂",
        words: [
          { en: "rain", display: "rain", zh: "下雨", hint: "發音重點：ai 發長母音 [e]，拼寫拆為 r-ain" },
          { en: "weather", display: "wea · ther", zh: "天氣", hint: "拆解記憶：wea- (短母音 e) + -ther (咬舌音 th)" },
          { en: "outside", display: "out · side", zh: "外面", hint: "複合字：out (出去) + side (邊/面) ＝ 外面" }
        ],
        sentence: {
          en: "It is raining outside.",
          zh: "外面正在下雨。"
        }
      },
      {
        lessonNumber: "第 3 堂",
        words: [
          { en: "school", display: "school", zh: "學校", hint: "ch 在此發 [k] 的音" },
          { en: "friend", display: "friend", zh: "朋友", hint: "ie 在此發短母音 [e]" }
        ],
        sentence: {
          en: "I see my friend at school.",
          zh: "我在學校看到我的朋友。"
        }
      }
    ];

    let currentQuestIdx = 0;

    // 建立週次標籤
    const selectorBox = document.getElementById("quest-selector");
    allQuests.forEach((quest, idx) => {
      const btn = document.createElement("button");
      btn.className = `tab-item ${idx === 0 ? 'active' : ''}`;
      btn.innerText = quest.lessonNumber;
      btn.onclick = () => switchQuest(idx);
      selectorBox.appendChild(btn);
    });

    function switchQuest(idx) {
      currentQuestIdx = idx;
      document.querySelectorAll(".tab-item").forEach((btn, i) => {
        btn.classList.toggle("active", i === idx);
      });
      loadQuest(allQuests[idx]);
    }

    function loadQuest(quest) {
      document.getElementById("page-title").innerText = `${quest.lessonNumber} 課後微複習`;
      document.getElementById("sentence-en").innerText = quest.sentence.en;
      document.getElementById("sentence-zh").innerText = quest.sentence.zh;
      document.getElementById("sentence-audio-btn").onclick = () => playAudio(quest.sentence.en);

      document.getElementById("claim-btn").style.display = "block";
      document.getElementById("done-screen").style.display = "none";

      const wordsDiv = document.getElementById("words-container");
      wordsDiv.innerHTML = "";
      quest.words.forEach(item => {
        const entry = document.createElement("div");
        entry.className = "word-entry";
        entry.innerHTML = `
          <div class="word-header">
            <div>
              <div class="word-main">${item.display}</div>
              <div class="word-sub">${item.zh}</div>
            </div>
            <button class="play-btn" onclick="playAudio('${item.en}')" aria-label="發音">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </button>
          </div>
          <span class="hint-trigger" onclick="toggleHint(this)">提示與拆解</span>
          <div class="hint-drawer">${item.hint}</div>
        `;
        wordsDiv.appendChild(entry);
      });
    }

    function toggleHint(btn) {
      const drawer = btn.nextElementSibling;
      drawer.classList.toggle("open");
      btn.innerText = drawer.classList.contains("open") ? "收合提示" : "提示與拆解";
    }

    function playAudio(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.8;
        window.speechSynthesis.speak(utter);
      }
    }

    function finishQuest() {
      document.getElementById("claim-btn").style.display = "none";
      document.getElementById("done-screen").style.display = "block";
    }

    loadQuest(allQuests[0]);
  </script>
</body>
</html>
