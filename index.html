<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROBLOX ARCADE: 4-IN-1 GAME HUB</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Phaser 3 引擎 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #050811;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 頂部導航與圖鑑狀態欄 */
    .top-control-deck {
      max-width: 420px;
      width: 95%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
      z-index: 20;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .quest-tabs-wrapper {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quest-tabs-wrapper::-webkit-scrollbar { display: none; }

    .q-tab {
      background: #1e293b;
      border: 2px solid #334155;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }
    .q-tab.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .bag-trigger-btn {
      background: linear-gradient(180deg, #ec4899, #be185d);
      border: 2px solid #831843;
      color: white;
      border-radius: 12px;
      padding: 4px 12px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    /* 遊戲模式切換條 */
    .mode-selector-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .mode-selector-bar::-webkit-scrollbar { display: none; }

    .mode-btn {
      background: #0f172a;
      border: 1.5px solid #334155;
      color: #64748b;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #f59e0b;
      color: #000;
      border-color: #fbbf24;
    }

    /* 遊戲畫布容器 */
    #game-canvas-container {
      width: 100%;
      height: 100%;
      max-width: 420px;
      max-height: 720px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
      aspect-ratio: 400 / 720;
    }

    canvas {
      display: block;
      border-radius: 16px;
    }

    /* 圖鑑背包 Modal 彈窗 (HTML 原生疊層) */
    .full-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      width: 100%;
      max-width: 360px;
      background: #111827;
      border: 3px solid #f59e0b;
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      color: white;
    }

    .bag-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-height: 50vh;
      overflow-y: auto;
      margin: 14px 0;
      padding: 4px;
    }

    .bag-cell {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
    }
    .bag-cell.unlocked { border-color: #f59e0b; }
    .bag-cell.locked { opacity: 0.35; filter: grayscale(1); }
    .bag-cell-icon { font-size: 1.8rem; margin-bottom: 2px; }
    .bag-cell-name { font-size: 0.72rem; font-weight: bold; }

    .modal-close-btn {
      width: 100%;
      background: #22c55e;
      border: none;
      color: #052e16;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 頂部控制面板：週次歷史 ＋ 寵物圖鑑 ＋ 模式切換 -->
  <div class="top-control-deck">
    <div class="hud-row">
      <div class="quest-tabs-wrapper" id="quest-nav-box"></div>
      <button class="bag-trigger-btn" onclick="openBagModal()">🎒 寵物圖鑑</button>
    </div>
    <div class="mode-selector-bar">
      <button class="mode-btn active" onclick="switchGameMode('EGG')">🥚 幸運開蛋</button>
      <button class="mode-btn" onclick="switchGameMode('DOORS')">🚪 密室破門</button>
      <button class="mode-btn" onclick="switchGameMode('SLAP')">🥊 揍飛怪獸</button>
      <button class="mode-btn" onclick="switchGameMode('SLOT')">🎰 幸運拉霸</button>
    </div>
  </div>

  <div id="game-canvas-container"></div>

  <!-- 寵物背包彈窗 -->
  <div class="full-modal" id="bag-modal">
    <div class="modal-box">
      <h3 style="font-size: 1.2rem; color: #f59e0b;">🎒 寵物收藏圖鑑</h3>
      <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">
        收集進度：<span id="bag-progress">0 / 6</span>
      </div>
      <div class="bag-grid" id="bag-items-box"></div>
      <button class="modal-close-btn" onclick="closeBagModal()">返回任務</button>
    </div>
  </div>

  <script>
    // ========================================================
    // ⚙️ 關卡歷史資料庫 (每週課後在最上面新增一週即可)
    // ========================================================
    const ALL_QUESTS = [
      {
        id: "w4",
        label: "第 4 關",
        words: [
          { en: "rain", display: "r · ain", zh: "下雨" },
          { en: "weather", display: "wea · ther", zh: "天氣" },
          { en: "outside", display: "out · side", zh: "外面" }
        ],
        sentence: {
          en: "It is raining outside.",
          zh: "外面正在下雨。"
        }
      },
      {
        id: "w3",
        label: "第 3 關 (複習)",
        words: [
          { en: "happy", display: "hap · py", zh: "高興的" },
          { en: "school", display: "school", zh: "學校" },
          { en: "friend", display: "friend", zh: "朋友" }
        ],
        sentence: {
          en: "I see my friend at school.",
          zh: "我在學校看到我的朋友。"
        }
      }
    ];

    // 全服寵物圖鑑庫 (含 ID、數值、圖示、稀有度)
    const PET_CATALOG = [
      { id: "p1", name: "TITANIC RAINBOW DRAGON", rarity: "MYTHIC", color: 0xec4899, power: "999,999", icon: "🐉", quote: "傳奇彩虹神龍！全服只有 0.1% 掉落率" },
      { id: "p2", name: "GOLDEN BANANA DOG", rarity: "LEGENDARY", color: 0xf59e0b, power: "88,000", icon: "🐕", quote: "黃金香蕉狗！走路自帶滑倒音效" },
      { id: "p3", name: "BLIZZARD UNICORN", rarity: "LEGENDARY", color: 0x38bdf8, power: "52,000", icon: "🦄", quote: "能把考卷全部冰凍的極地神獸" },
      { id: "p4", name: "CYBER GLITCH CAT", rarity: "RARE", color: 0x06b6d4, power: "12,500", icon: "🐱", quote: "賽博駭客貓，能把題目直接格式化" },
      { id: "p5", name: "RADIOACTIVE TOILET", rarity: "RARE", color: 0xa855f7, power: "4,800", icon: "🚽", quote: "按下沖水鍵會發射超強音波攻擊！" },
      { id: "p6", name: "MOLDY TOAST", rarity: "COMMON", color: 0x94a3b8, power: "25", icon: "🍞", quote: "雖然戰鬥力很低，但烤過挺好吃的" }
    ];

    let currentQuestIdx = 0;
    let currentMode = 'EGG';
    let phaserGame = null;
    let unlockedPets = JSON.parse(localStorage.getItem("unlocked_pet_ids") || "[]");

    // --------------------------------------------------------
    // Phaser 3 場景引擎
    // --------------------------------------------------------
    class GameScene extends Phaser.Scene {
      constructor() {
        super({ key: 'GameScene' });
      }

      preload() {
        this.createVectorAssets();
      }

      create() {
        this.chargedCount = 0;
        this.maxCharges = 4;
        this.completedItems = new Set();

        const W = 400;
        const H = 720;
        const activeQuest = ALL_QUESTS[currentQuestIdx];

        // 1. 背景網格
        this.add.rectangle(W / 2, H / 2, W, H, 0x0a0f1d);
        this.grid = this.add.grid(W / 2, H / 2, W, H, 32, 32, 0x000000, 0, 0x1e293b, 0.25);

        // 2. 頂部能量槽
        this.createHUD(W, activeQuest);

        // 3. 依模式建立中央舞台
        this.buildStageByMode(W / 2, H * 0.35);

        // 4. 建立 3 單字 ＋ 1 句子任務符文
        this.createRuneDeck(W / 2, H * 0.61, activeQuest);

        // 5. 粒子發射器
        this.particleEmitter = this.add.particles(0, 0, 'glowParticle', {
          speed: { min: 80, max: 200 },
          scale: { start: 0.8, end: 0 },
          blendMode: 'ADD',
          lifespan: 600,
          emitting: false
        });
      }

      createVectorAssets() {
        const pGfx = this.make.graphics({ x: 0, y: 0, add: false });
        pGfx.fillStyle(0x00f0ff, 1);
        pGfx.fillCircle(8, 8, 8);
        pGfx.generateTexture('glowParticle', 16, 16);

        const rGfx = this.make.graphics({ x: 0, y: 0, add: false });
        rGfx.fillStyle(0x162032, 1);
        rGfx.fillRoundedRect(0, 0, 360, 52, 14);
        rGfx.lineStyle(3, 0x2a3b5c, 1);
        rGfx.strokeRoundedRect(0, 0, 360, 52, 14);
        rGfx.generateTexture('runeBase', 360, 52);

        const aGfx = this.make.graphics({ x: 0, y: 0, add: false });
        aGfx.fillStyle(0x064e3b, 1);
        aGfx.fillRoundedRect(0, 0, 360, 52, 14);
        aGfx.lineStyle(3, 0x10b981, 1);
        aGfx.strokeRoundedRect(0, 0, 360, 52, 14);
        aGfx.generateTexture('runeCharged', 360, 52);
      }

      createHUD(w, quest) {
        this.add.text(w / 2, 28, `${quest.label} · QUEST ENERGIZER`, {
          fontFamily: 'sans-serif',
          fontSize: '13px',
          fontStyle: 'bold',
          color: '#38bdf8'
        }).setOrigin(0.5);

        this.add.rectangle(w / 2, 54, 220, 22, 0x0f172a).setStrokeStyle(2, 0x334155);
        this.energyFill = this.add.rectangle(w / 2 - 108, 54, 0, 18, 0x00f0ff).setOrigin(0, 0.5);
        this.energyText = this.add.text(w / 2, 54, 'PROGRESS 0 / 4', {
          fontFamily: 'sans-serif',
          fontSize: '11px',
          fontStyle: 'bold',
          color: '#ffffff'
        }).setOrigin(0.5);
      }

      buildStageByMode(cx, cy) {
        this.stageContainer = this.add.container(cx, cy);

        if (currentMode === 'EGG') {
          this.pedestal = this.add.ellipse(0, 75, 150, 36, 0x38bdf8, 0.2);
          this.eggGfx = this.add.graphics();
          this.drawEgg(0x38bdf8, 0x1d4ed8);
          this.stageContainer.add([this.pedestal, this.eggGfx]);

          this.idleTween = this.tweens.add({
            targets: this.stageContainer,
            y: cy - 12,
            duration: 1400,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
          });

          this.stageContainer.setSize(120, 140);
          this.stageContainer.setInteractive(new Phaser.Geom.Circle(0, 0, 60), Phaser.Geom.Circle.Contains);
          this.stageContainer.on('pointerdown', () => this.handleActionTrigger());
          this.stageLabel = this.add.text(cx, cy + 110, '⚡ 點擊下方單字注入能量開蛋', { fontFamily: 'sans-serif', fontSize: '13px', color: '#94a3b8', fontStyle: 'bold' }).setOrigin(0.5);

        } else if (currentMode === 'DOORS') {
          this.doorBox = this.add.rectangle(0, 0, 110, 150, 0x334155).setStrokeStyle(4, 0x64748b);
          this.doorText = this.add.text(0, -20, 'DOOR 01', { fontFamily: 'sans-serif', fontSize: '18px', fontStyle: 'bold', color: '#facc15' }).setOrigin(0.5);
          this.doorLock = this.add.text(0, 30, '🔒 LOCKED', { fontFamily: 'sans-serif', fontSize: '13px', color: '#ef4444', fontStyle: 'bold' }).setOrigin(0.5);
          this.stageContainer.add([this.doorBox, this.doorText, this.doorLock]);

          this.stageContainer.setSize(110, 150);
          this.stageContainer.setInteractive();
          this.stageContainer.on('pointerdown', () => this.handleActionTrigger());
          this.stageLabel = this.add.text(cx, cy + 110, '🏃 解開 4 道密碼破門逃脫！', { fontFamily: 'sans-serif', fontSize: '13px', color: '#94a3b8', fontStyle: 'bold' }).setOrigin(0.5);

        } else if (currentMode === 'SLAP') {
          this.monster = this.add.circle(0, 0, 55, 0xec4899).setStrokeStyle(4, 0xffffff);
          this.monsterFace = this.add.text(0, -5, '🤪', { fontSize: '46px' }).setOrigin(0.5);
          this.stageContainer.add([this.monster, this.monsterFace]);

          this.idleTween = this.tweens.add({ targets: this.stageContainer, scaleX: 1.06, duration: 600, yoyo: true, repeat: -1 });
          this.stageContainer.setSize(110, 110);
          this.stageContainer.setInteractive();
          this.stageContainer.on('pointerdown', () => this.handleActionTrigger());
          this.stageLabel = this.add.text(cx, cy + 110, '🥊 聽讀蓄力，把怪獸打飛到太空！', { fontFamily: 'sans-serif', fontSize: '13px', color: '#94a3b8', fontStyle: 'bold' }).setOrigin(0.5);

        } else if (currentMode === 'SLOT') {
          this.slotFrame = this.add.rectangle(0, 0, 180, 110, 0x1e293b).setStrokeStyle(4, 0xfacc15);
          this.slotReel = this.add.text(0, 0, '💎 | 💎 | 💎', { fontFamily: 'sans-serif', fontSize: '20px', fontStyle: 'bold', color: '#ffffff' }).setOrigin(0.5);
          this.stageContainer.add([this.slotFrame, this.slotReel]);

          this.stageContainer.setSize(180, 110);
          this.stageContainer.setInteractive();
          this.stageContainer.on('pointerdown', () => this.handleActionTrigger());
          this.stageLabel = this.add.text(cx, cy + 110, '🎰 湊滿 4 顆幸運代幣啟動拉霸！', { fontFamily: 'sans-serif', fontSize: '13px', color: '#94a3b8', fontStyle: 'bold' }).setOrigin(0.5);
        }
      }

      drawEgg(topColor, bottomColor) {
        this.eggGfx.clear();
        this.eggGfx.fillStyle(bottomColor, 1);
        this.eggGfx.fillCircle(0, 10, 50);
        this.eggGfx.fillStyle(topColor, 1);
        this.eggGfx.fillCircle(0, -10, 42);
        this.eggGfx.lineStyle(4, 0xffffff, 0.85);
        this.eggGfx.strokeCircle(0, 0, 52);
      }

      createRuneDeck(centerX, startY, quest) {
        quest.words.forEach((item, idx) => {
          this.createRuneButton(centerX, startY + idx * 62, item, `word_${idx}`);
        });
        const sentenceY = startY + 3 * 62 + 8;
        this.createSentenceRune(centerX, sentenceY, quest.sentence);
      }

      createRuneButton(x, y, item, key) {
        const container = this.add.container(x, y);
        const bg = this.add.image(0, 0, 'runeBase').setInteractive({ useHandCursor: true });
        const textEn = this.add.text(-150, -4, item.display, { fontFamily: 'sans-serif', fontSize: '19px', fontStyle: 'bold', color: '#ffffff' }).setOrigin(0, 0.5);
        const textZh = this.add.text(50, -4, item.zh, { fontFamily: 'sans-serif', fontSize: '14px', color: '#94a3b8' }).setOrigin(0, 0.5);
        const icon = this.add.text(145, -4, '🔊', { fontSize: '18px' }).setOrigin(0.5);

        container.add([bg, textEn, textZh, icon]);
        bg.on('pointerdown', () => {
          this.triggerJuicyPress(container);
          this.speak(item.en);
          this.awardProgress(key, bg, container.x, container.y);
        });
      }

      createSentenceRune(x, y, sentenceObj) {
        const container = this.add.container(x, y);
        const bg = this.add.image(0, 0, 'runeBase').setInteractive({ useHandCursor: true });
        const label = this.add.text(-150, -14, '📜 本週密碼句：', { fontFamily: 'sans-serif', fontSize: '11px', color: '#38bdf8' });
        const sentenceText = this.add.text(-150, 6, sentenceObj.en, { fontFamily: 'sans-serif', fontSize: '15px', fontStyle: 'bold', color: '#ffffff' });
        const icon = this.add.text(145, 0, '⚡', { fontSize: '18px' }).setOrigin(0.5);

        container.add([bg, label, sentenceText, icon]);
        bg.on('pointerdown', () => {
          this.triggerJuicyPress(container);
          this.speak(sentenceObj.en);
          this.awardProgress('sentence', bg, container.x, container.y);
        });
      }

      triggerJuicyPress(target) {
        this.tweens.add({ targets: target, scaleX: 0.94, scaleY: 0.94, duration: 80, yoyo: true });
      }

      awardProgress(key, bgImage, originX, originY) {
        this.playAudioSynth(880, 'sine', 0.15);

        if (!this.completedItems.has(key)) {
          this.completedItems.add(key);
          bgImage.setTexture('runeCharged');
          this.chargedCount++;

          const progressRatio = this.chargedCount / this.maxCharges;
          this.tweens.add({
            targets: this.energyFill,
            width: 216 * progressRatio,
            duration: 300,
            ease: 'Cubic.easeOut'
          });
          this.energyText.setText(`PROGRESS ${this.chargedCount} / ${this.maxCharges}`);

          this.particleEmitter.explode(16, originX, originY);
          this.tweens.add({
            targets: { x: originX, y: originY },
            x: this.stageContainer.x,
            y: this.stageContainer.y,
            duration: 380,
            onUpdate: (tween) => {
              const val = tween.getValue();
              this.particleEmitter.emitParticleAt(val.x, val.y);
            }
          });

          if (currentMode === 'DOORS') {
            this.doorText.setText(`DOOR 0${this.chargedCount}`);
          }

          if (this.chargedCount === this.maxCharges) {
            this.setStageReady();
          }
        }
      }

      setStageReady() {
        this.playAudioSynth(587.33, 'triangle', 0.4);

        if (currentMode === 'EGG') {
          this.drawEgg(0xfde047, 0xea580c);
          if (this.idleTween) this.idleTween.stop();
          this.tweens.add({ targets: this.stageContainer, scaleX: 1.15, scaleY: 0.9, angle: 10, duration: 90, yoyo: true, repeat: -1 });
          this.stageLabel.setText('🔥 能量充飽！點擊狂暴開蛋！').setColor('#facc15');

        } else if (currentMode === 'DOORS') {
          this.doorBox.setStrokeStyle(4, 0x22c55e);
          this.doorLock.setText('🔓 UNLOCKED!').setColor('#22c55e');
          this.stageLabel.setText('🚪 鎖已全開！點擊大門逃出！').setColor('#22c55e');

        } else if (currentMode === 'SLAP') {
          this.monsterFace.setText('😱');
          this.tweens.add({ targets: this.stageContainer, scaleX: 1.25, scaleY: 1.25, angle: 15, duration: 80, yoyo: true, repeat: -1 });
          this.stageLabel.setText('💥 大招蓄滿！點擊一拳揍飛！').setColor('#facc15');

        } else if (currentMode === 'SLOT') {
          this.stageLabel.setText('🎰 金幣到位！點擊拉桿開獎！').setColor('#facc15');
        }
      }

      handleActionTrigger() {
        if (this.chargedCount < this.maxCharges) {
          this.cameras.main.shake(120, 0.01);
          this.playAudioSynth(220, 'square', 0.15);
          return;
        }

        this.cameras.main.shake(400, 0.035);
        this.cameras.main.flash(400, 255, 255, 255);
        this.playVictoryFanfare();

        // 保底抽卡機制：優先掉落未獲得寵物
        let candidatePool = PET_CATALOG;
        if (unlockedPets.length < PET_CATALOG.length) {
          const unowned = PET_CATALOG.filter(p => !unlockedPets.includes(p.id));
          if (Math.random() < 0.7 && unowned.length > 0) {
            candidatePool = unowned;
          }
        }
        const loot = candidatePool[Math.floor(Math.random() * candidatePool.length)];

        // 存入背包 localStorage
        if (!unlockedPets.includes(loot.id)) {
          unlockedPets.push(loot.id);
          localStorage.setItem("unlocked_pet_ids", JSON.stringify(unlockedPets));
        }

        this.showGachaCardModal(loot);
      }

      showGachaCardModal(loot) {
        const W = 400;
        const H = 720;
        const overlay = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.9).setInteractive();
        const cardBox = this.add.container(W / 2, H / 2);

        const cardBg = this.add.rectangle(0, 0, 310, 440, 0x111827).setStrokeStyle(4, loot.color);
        const badge = this.add.text(0, -180, `★ ${loot.rarity} ★`, { fontFamily: 'sans-serif', fontSize: '14px', fontStyle: 'bold', color: '#ffffff' }).setOrigin(0.5);

        // 寵物立繪圖示
        const orb = this.add.circle(0, -90, 50, loot.color, 0.3);
        const avatar = this.add.text(0, -90, loot.icon, { fontSize: '50px' }).setOrigin(0.5);

        const nameLabel = this.add.text(0, -15, loot.name, { fontFamily: 'sans-serif', fontSize: '16px', fontStyle: 'bold', color: '#ffffff', align: 'center' }).setOrigin(0.5);
        const powerLabel = this.add.text(0, 15, `⚡ POWER: ${loot.power}`, { fontFamily: 'sans-serif', fontSize: '14px', color: '#facc15', fontStyle: 'bold' }).setOrigin(0.5);
        const quoteLabel = this.add.text(0, 60, loot.quote, { fontFamily: 'sans-serif', fontSize: '12px', color: '#cbd5e1', wordWrap: { width: 260 }, align: 'center' }).setOrigin(0.5);

        // 阿嬤安心免死標籤 (大框放大)
        const passBox = this.add.rectangle(0, 125, 270, 52, 0x052e16).setStrokeStyle(2, 0x22c55e);
        const passText = this.add.text(0, 125, '✨ 今日跟讀任務已通關！\n拿這張神寵給阿嬤看換放鬆時間', {
          fontFamily: 'sans-serif',
          fontSize: '12px',
          fontWeight: 'bold',
          color: '#86efac',
          align: 'center'
        }).setOrigin(0.5);

        const closeBtn = this.add.rectangle(0, 185, 220, 38, 0x22c55e).setInteractive({ useHandCursor: true });
        const closeTxt = this.add.text(0, 185, '收進背包圖鑑 🎮', { fontFamily: 'sans-serif', fontSize: '14px', fontWeight: 'bold', color: '#052e16' }).setOrigin(0.5);

        cardBox.add([cardBg, badge, orb, avatar, nameLabel, powerLabel, quoteLabel, passBox, passText, closeBtn, closeTxt]);

        cardBox.setScale(0);
        this.tweens.add({ targets: cardBox, scale: 1, duration: 350, ease: 'Back.easeOut' });

        closeBtn.on('pointerdown', () => {
          overlay.destroy();
          cardBox.destroy();
        });
      }

      speak(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'en-US';
          utter.rate = 0.8;
          window.speechSynthesis.speak(utter);
        }
      }

      playAudioSynth(freq, type, duration) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      }

      playVictoryFanfare() {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playAudioSynth(freq, 'triangle', 0.3), idx * 90);
        });
      }
    }

    // --------------------------------------------------------
    // HTML 介面控制（關卡切換 ＋ 圖鑑背包）
    // --------------------------------------------------------
    function initQuestTabs() {
      const box = document.getElementById("quest-nav-box");
      box.innerHTML = "";
      ALL_QUESTS.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = `q-tab ${idx === currentQuestIdx ? 'active' : ''}`;
        btn.innerText = q.label;
        btn.onclick = () => switchQuest(idx);
        box.appendChild(btn);
      });
    }

    function switchQuest(idx) {
      if (currentQuestIdx === idx) return;
      currentQuestIdx = idx;
      initQuestTabs();
      if (phaserGame && phaserGame.scene) {
        phaserGame.scene.scenes[0].scene.restart();
      }
    }

    function switchGameMode(modeKey) {
      if (currentMode === modeKey) return;
      currentMode = modeKey;

      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(modeKey));
      });

      if (phaserGame && phaserGame.scene) {
        phaserGame.scene.scenes[0].scene.restart();
      }
    }

    // 開啟圖鑑背包 Modal
    function openBagModal() {
      const box = document.getElementById("bag-items-box");
      box.innerHTML = "";
      document.getElementById("bag-progress").innerText = `${unlockedPets.length} / ${PET_CATALOG.length}`;

      PET_CATALOG.forEach(p => {
        const isUnlocked = unlockedPets.includes(p.id);
        const cell = document.createElement("div");
        cell.className = `bag-cell ${isUnlocked ? 'unlocked' : 'locked'}`;
        cell.innerHTML = `
          <div class="bag-cell-icon">${isUnlocked ? p.icon : '❓'}</div>
          <div class="bag-cell-name">${isUnlocked ? p.name.split(' ')[0] : '未解鎖'}</div>
        `;
        box.appendChild(cell);
      });

      document.getElementById("bag-modal").style.display = "flex";
    }

    function closeBagModal() {
      document.getElementById("bag-modal").style.display = "none";
    }

    // 啟動程式
    window.addEventListener('load', () => {
      initQuestTabs();
      const config = {
        type: Phaser.AUTO,
        parent: 'game-canvas-container',
        width: 400,
        height: 720,
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH
        },
        scene: GameScene
      };
      phaserGame = new Phaser.Game(config);
    });
  </script>
</body>
</html>
