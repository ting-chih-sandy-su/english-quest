<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PHONICS DECODER: 語音硬核解密</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090e1a;
      --card-bg: #1e293b;
      --gold: #facc15;
      --cyan: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --border-dark: #334155;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #070a13 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-viewport {
      width: 100%;
      max-width: 420px;
      height: 98vh;
      max-height: 840px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 12px;
      position: relative;
      z-index: 10;
    }

    /* 頂部控制 */
    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .quest-tabs-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quest-tabs-scroll::-webkit-scrollbar { display: none; }

    .q-btn {
      background: var(--card-bg);
      border: 2px solid var(--border-dark);
      color: var(--text-sub);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .q-btn.active {
      background: var(--cyan);
      color: #0b1120;
      border-color: #0284c7;
    }

    .pill-btn {
      background: #1e293b;
      border: 2px solid var(--border-dark);
      color: #fff;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .pill-btn.bag-btn { background: linear-gradient(180deg, #ec4899, #be185d); border-color: #831843; }
    .pill-btn.elder-btn { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; color: #86efac; }
    .pill-btn.elder-btn.active { background: #22c55e; color: #052e16; }

    /* 核心聽力特訓舞台 (高度鑑別度) */
    .challenge-arena {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
      border: 2px solid var(--border-dark);
      box-shadow: 0 4px 0 #000;
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      position: relative;
    }

    .stage-badge {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--gold);
      background: rgba(250, 204, 21, 0.15);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .challenge-title {
      font-size: 1.15rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 12px;
    }

    .audio-speaker-pulse {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--cyan), #0284c7);
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      margin-bottom: 14px;
      transition: transform 0.1s;
    }
    .audio-speaker-pulse:active { transform: scale(0.9); }

    /* 選擇按鈕組 */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }
    .choice-card-btn {
      background: #0f172a;
      border: 2px solid var(--border-dark);
      color: #fff;
      padding: 12px 8px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .choice-card-btn:active { transform: scale(0.95); background: #1e293b; }
    .choice-card-btn.correct { background: var(--green); border-color: #fff; color: #000; }
    .choice-card-btn.wrong { background: var(--red); border-color: #fff; }

    /* 音節拼圖區 */
    .syllable-slots-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .syllable-slot {
      min-width: 50px;
      height: 40px;
      border: 2px dashed var(--cyan);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      background: rgba(56, 189, 248, 0.05);
    }

    /* 能量總進度 */
    .progress-status-box {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-sub);
      margin-top: 10px;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 999px;
      margin-top: 4px;
      overflow: hidden;
      border: 1px solid var(--border-dark);
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      transition: width 0.3s;
    }

    /* 下方自主慢速聽讀學習卡 (供卡關時偷看與聆聽) */
    .reference-deck {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ref-card {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 1.5px solid var(--border-dark);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ref-en { font-size: 1.05rem; font-weight: 800; }
    .ref-zh { font-size: 0.78rem; color: var(--text-sub); font-weight: 700; }
    
    .slow-audio-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .slow-audio-btn:active { background: var(--cyan); color: #000; }

    /* 彈窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #1e293b, #090e1a);
      border: 3px solid var(--gold);
      border-radius: 22px;
      padding: 20px 16px;
      text-align: center;
    }
    .close-btn {
      width: 100%;
      background: linear-gradient(180deg, var(--green), #15803d);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      margin-top: 10px;
    }

    .bag-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-height: 48vh;
      overflow-y: auto;
      margin: 12px 0;
      padding: 2px;
    }
    .bag-cell {
      background: #0f172a;
      border: 1.5px solid var(--border-dark);
      border-radius: 10px;
      padding: 6px 2px;
      text-align: center;
    }
    .bag-cell.unlocked { border-color: var(--gold); background: #1e293b; }
    .bag-cell.locked { opacity: 0.35; filter: grayscale(1); }

    #flash-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.15s;
    }
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 101;
    }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="app-viewport">
    
    <!-- 頂部選單 -->
    <div class="control-header">
      <div class="quest-tabs-scroll" id="quest-nav-box"></div>
      <div style="display:flex; gap:6px;">
        <button class="pill-btn elder-btn" id="elder-btn" onclick="toggleElderGuide()">👵 長輩指南</button>
        <button class="pill-btn bag-btn" onclick="openBagModal()">🎒 萬物圖鑑</button>
      </div>
    </div>

    <!-- 長輩安心面板 -->
    <div class="elder-helper-banner" id="elder-guide-box" style="display:none; background:rgba(22,101,52,0.9); border:2px solid var(--green); border-radius:12px; padding:8px 12px; font-size:0.8rem; color:#d1fae5;">
      <strong>長輩請放心：</strong><br>
      這是聽力特訓關卡！孩子必須仔細聽喇叭發音，選出正確的單字才能過關。沒聽懂是過不去的喔！
    </div>

    <!-- 真正硬核聽力考驗舞台 -->
    <div class="challenge-arena">
      <div class="stage-badge" id="stage-level-tag">LEVEL 1 / 3 · 音素聽力盲測</div>
      <div class="challenge-title" id="challenge-prompt">點擊喇叭，聽出哪個是目標字！</div>

      <!-- 核心大喇叭 (點擊隨機出題發音) -->
      <div class="audio-speaker-pulse" onclick="replayChallengeAudio()">🔊</div>

      <!-- 動態答案選項 (防瞎猜) -->
      <div class="choices-grid" id="choices-container"></div>

      <!-- 總挑戰進度條 -->
      <div class="progress-status-box">
        <span>關卡解鎖進度</span>
        <span id="progress-text">0 / 3 關</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- 下方「慢速慢讀」自主修煉區 (卡關時孩子必須親自點來聽) -->
    <div class="reference-deck">
      <div style="font-size:0.75rem; color:var(--gold); font-weight:800;">💡 卡關救星：點「慢速音素拆解」仔細聽清楚！</div>
      <div id="ref-cards-box" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>

  </div>

  <!-- 抽卡 Modal -->
  <div class="modal-overlay" id="loot-modal">
    <div class="modal-box">
      <span style="display:inline-block; padding:3px 12px; border-radius:999px; font-weight:800; font-size:0.75rem; background:linear-gradient(90deg,#ec4899,#8b5cf6); color:#fff;" id="loot-rarity">神話級 MYTHIC</span>
      <div style="font-size:3.8rem; margin:6px 0;" id="loot-icon">🐉</div>
      <div style="font-size:1.4rem; font-weight:900;" id="loot-name">彩虹神龍</div>
      <div style="font-size:0.95rem; color:var(--gold); font-weight:800; margin:4px 0;" id="loot-power">⚡ 戰鬥力: 999,999</div>
      
      <div style="background:rgba(34,197,94,0.18); border:2px dashed var(--green); border-radius:12px; padding:8px 10px; color:#86efac; font-size:0.85rem; font-weight:700; margin:12px 0;">
        ✨ <strong>硬核聽力全數通關！</strong><br>
        孩子的耳朵真的聽懂了！拿這張神寵給阿嬤看換放鬆時間！
      </div>

      <button class="close-btn" onclick="closeLootModal()">收進萬物圖鑑 🎮</button>
    </div>
  </div>

  <!-- 圖鑑 Modal -->
  <div class="modal-overlay" id="bag-modal">
    <div class="modal-box">
      <h3 style="font-size:1.2rem; color:var(--gold);">🎒 萬物收集圖鑑庫</h3>
      <div style="font-size:0.78rem; color:var(--text-sub); margin-top:4px;">
        已解鎖進度：<span id="bag-progress">0</span> / 1,000 種全服圖鑑
      </div>
      <div class="bag-grid" id="bag-grid"></div>
      <button class="close-btn" onclick="closeBagModal()">返回訓練</button>
    </div>
  </div>

  <script>
    // 嚴格設計的「最小音素混淆題庫」（Minimal Pairs）
    // 真正能逼孩子聽清楚 /r/ vs /l/、長短母音差別
    const ALL_QUESTS = [
      {
        id: "w4",
        label: "第 4 關",
        words: [
          { en: "rain", display: "r · ain", zh: "下雨", distractor: "lane", distractorEn: "lane", hint: "發音重點：開頭是 /r/ 不是 /l/；ai 發長母音 /eɪ/！" },
          { en: "weather", display: "wea · ther", zh: "天氣", distractor: "feather", distractorEn: "feather", hint: "開頭是 /w/ 不是 /f/；結尾 -ther 有咬舌濁音！" },
          { en: "outside", display: "out · side", zh: "外面", distractor: "inside", distractorEn: "inside", hint: "前綴是 out 不是 in；結尾 side 發雙母音 /aɪ/！" }
        ],
        sentence: { en: "It is raining outside.", zh: "外面正在下雨。" }
      },
      {
        id: "w3",
        label: "第 3 關 (複習)",
        words: [
          { en: "happy", display: "hap · py", zh: "高興的", distractor: "heavy", distractorEn: "heavy", hint: "注意雙子音 pp 是爆破音 /p/ 不是 /v/！" },
          { en: "school", display: "school", zh: "學校", distractor: "cool", distractorEn: "cool", hint: "開頭有 /sk/ 雙子音群，不是只有 cool！" },
          { en: "friend", display: "friend", zh: "朋友", distractor: "trend", distractorEn: "trend", hint: "開頭是 /fr/ 不是 /tr/！" }
        ],
        sentence: { en: "I see my friend at school.", zh: "我在學校看到我的朋友。" }
      }
    ];

    const FULL_CATALOG = [];
    const SPECIES = ["彩虹神龍", "黃金香蕉狗", "暴風獨角獸", "駭客貓", "馬桶怪", "生吐司", "霸王暴龍", "爆破西瓜"];
    for (let i = 1; i <= 60; i++) {
      FULL_CATALOG.push({
        id: `pet_${i}`,
        num: `#${String(i).padStart(4, '0')}`,
        name: SPECIES[(i - 1) % SPECIES.length],
        rarity: i % 10 === 0 ? "神話級 MYTHIC" : i % 3 === 0 ? "傳奇級 LEGENDARY" : "稀有級 RARE",
        icon: ["🐉","🐕","🦄","🐱","🚽","🍞","🦖","🍉"][(i - 1) % 8],
        power: `⚡ ${(50000 + i * 2500).toLocaleString()}`
      });
    }

    let currentQuestIdx = 0;
    let currentStage = 0; // 0: 第1單字聽辨, 1: 第2單字聽辨, 2: 第3單字聽辨, 3: 句子挖空聽辨
    let currentTargetWord = "";
    let unlockedPets = JSON.parse(localStorage.getItem("unlocked_catalog_ids") || '["pet_1"]');

    function initQuestNav() {
      const box = document.getElementById("quest-nav-box");
      box.innerHTML = "";
      ALL_QUESTS.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = `q-btn ${idx === currentQuestIdx ? 'active' : ''}`;
        btn.innerText = q.label;
        btn.onclick = () => switchQuest(idx);
        box.appendChild(btn);
      });
    }

    function switchQuest(idx) {
      currentQuestIdx = idx;
      initQuestNav();
      startQuest(ALL_QUESTS[idx]);
    }

    function startQuest(quest) {
      currentStage = 0;
      updateProgress();
      renderReferenceCards(quest);
      generateChallengeStage();
    }

    // 渲染下方「慢速音素拆解自主救星區」
    function renderReferenceCards(quest) {
      const box = document.getElementById("ref-cards-box");
      box.innerHTML = "";
      quest.words.forEach(item => {
        const card = document.createElement("div");
        card.className = "ref-card";
        card.innerHTML = `
          <div>
            <div class="ref-en">${item.display}</div>
            <div class="ref-zh">${item.zh} · <span style="color:#38bdf8;">${item.hint}</span></div>
          </div>
          <button class="slow-audio-btn" onclick="speakPhonicsUltraSlow('${item.en}')">
            🐢 極慢發音
          </button>
        `;
        box.appendChild(card);
      });
    }

    // 依當前難度生成聽力挑戰
    function generateChallengeStage() {
      const quest = ALL_QUESTS[currentQuestIdx];
      const choicesBox = document.getElementById("choices-container");
      choicesBox.innerHTML = "";

      if (currentStage < 3) {
        // 階段 1~3：最小音素聽辨 (Target vs Distractor 干擾字)
        const wordData = quest.words[currentStage];
        currentTargetWord = wordData.en;
        
        document.getElementById("stage-level-tag").innerText = `STAGE ${currentStage + 1} / 4 · 音素殘酷聽辨`;
        document.getElementById("challenge-prompt").innerText = `仔細聽！哪一個才是「${wordData.zh}」的正確認讀？`;

        // 隨機排列正確選項與干擾選項
        const options = Math.random() > 0.5 ? 
          [ { text: wordData.en, isCorrect: true }, { text: wordData.distractor, isCorrect: false } ] :
          [ { text: wordData.distractor, isCorrect: false }, { text: wordData.en, isCorrect: true } ];

        options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "choice-card-btn";
          btn.innerText = opt.text;
          btn.onclick = () => checkAnswer(opt.isCorrect, btn);
          choicesBox.appendChild(btn);
        });

        // 自動播放一次發音
        replayChallengeAudio();

      } else if (currentStage === 3) {
        // 階段 4：整句連音挖空聽力
        currentTargetWord = quest.sentence.en;
        document.getElementById("stage-level-tag").innerText = "FINAL STAGE · 語句連音解密";
        document.getElementById("challenge-prompt").innerText = "聽完整句子！選出你剛才聽到的核心字！";

        // 從 3 個單字中選出隨機選項
        quest.words.forEach(w => {
          const btn = document.createElement("button");
          btn.className = "choice-card-btn";
          btn.innerText = w.en;
          btn.onclick = () => checkSentenceAnswer(w.en, btn);
          choicesBox.appendChild(btn);
        });

        replayChallengeAudio();
      }
    }

    function replayChallengeAudio() {
      speakTTS(currentTargetWord, 0.75);
    }

    // 檢查答案 (答錯直接扣血/重來，逼他真正用心聽)
    function checkAnswer(isCorrect, btnElement) {
      if (isCorrect) {
        btnElement.classList.add("correct");
        playCoinSound();
        currentStage++;
        updateProgress();

        if (currentStage === 4) {
          setTimeout(executeVictory, 500);
        } else {
          setTimeout(generateChallengeStage, 600);
        }
      } else {
        btnElement.classList.add("wrong");
        playBuzzerSound();
        alert("❌ 聽錯了！發音完全不同！請看下方「極慢發音」拆解，重新聽一遍！");
        btnElement.classList.remove("wrong");
        replayChallengeAudio();
      }
    }

    function checkSentenceAnswer(selectedWord, btnElement) {
      const sentence = ALL_QUESTS[currentQuestIdx].sentence.en.toLowerCase();
      if (sentence.includes(selectedWord.toLowerCase())) {
        btnElement.classList.add("correct");
        playFanfareSound();
        currentStage++;
        updateProgress();
        setTimeout(executeVictory, 500);
      } else {
        btnElement.classList.add("wrong");
        playBuzzerSound();
        alert("❌ 句子裡沒有這個聲音！請再聽一次整句連音！");
        btnElement.classList.remove("wrong");
        replayChallengeAudio();
      }
    }

    function updateProgress() {
      const percent = (currentStage / 4) * 100;
      document.getElementById("progress-fill").style.width = `${percent}%`;
      document.getElementById("progress-text").innerText = `${currentStage} / 4 關`;
    }

    function executeVictory() {
      triggerWhiteFlash();
      playChestSound();
      launchConfetti();

      const loot = FULL_CATALOG[Math.floor(Math.random() * FULL_CATALOG.length)];
      if (!unlockedPets.includes(loot.id)) {
        unlockedPets.push(loot.id);
        localStorage.setItem("unlocked_catalog_ids", JSON.stringify(unlockedPets));
      }

      document.getElementById("loot-rarity").innerText = `${loot.num} · ${loot.rarity}`;
      document.getElementById("loot-icon").innerText = loot.icon;
      document.getElementById("loot-name").innerText = loot.name;
      document.getElementById("loot-power").innerText = loot.power;

      document.getElementById("loot-modal").style.display = "flex";
    }

    function closeLootModal() {
      document.getElementById("loot-modal").style.display = "none";
      currentStage = 0;
      updateProgress();
      generateChallengeStage();
    }

    // 發音引擎 (支援 0.5 倍超慢速音素拆解)
    function speakTTS(text, rate = 0.8) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = rate;
        window.speechSynthesis.speak(utter);
      }
    }

    function speakPhonicsUltraSlow(text) {
      speakTTS(text, 0.55); // 超慢速，讓孩子聽清每個子音與母音的嘴型位置
    }

    // 圖鑑與長輩指南
    function openBagModal() {
      const box = document.getElementById("bag-grid");
      box.innerHTML = "";
      document.getElementById("bag-progress").innerText = unlockedPets.length;
      FULL_CATALOG.forEach(p => {
        const isUnlocked = unlockedPets.includes(p.id);
        const cell = document.createElement("div");
        cell.className = `bag-cell ${isUnlocked ? 'unlocked' : 'locked'}`;
        cell.innerHTML = `
          <div style="font-size:0.6rem; color:#94a3b8;">${p.num}</div>
          <div style="font-size:1.5rem;">${isUnlocked ? p.icon : '❓'}</div>
          <div style="font-size:0.68rem; font-weight:700;">${isUnlocked ? p.name : '未解鎖'}</div>
        `;
        box.appendChild(cell);
      });
      document.getElementById("bag-modal").style.display = "flex";
    }

    function closeBagModal() {
      document.getElementById("bag-modal").style.display = "none";
    }

    function toggleElderGuide() {
      const banner = document.getElementById("elder-guide-box");
      const btn = document.getElementById("elder-btn");
      const isShow = banner.style.display === "none";
      banner.style.display = isShow ? "block" : "none";
      btn.classList.toggle("active", isShow);
    }

    function triggerWhiteFlash() {
      const flash = document.getElementById("flash-overlay");
      flash.style.opacity = "0.9";
      setTimeout(() => { flash.style.opacity = "0"; }, 250);
    }

    function playCoinSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(987.77, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
    }

    function playBuzzerSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function playFanfareSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.2);
          osc.start(ctx.currentTime + i * 0.1);
          osc.stop(ctx.currentTime + i * 0.1 + 0.2);
        });
      } catch (e) {}
    }

    function playChestSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.06);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.06 + 0.25);
          osc.start(ctx.currentTime + idx * 0.06);
          osc.stop(ctx.currentTime + idx * 0.06 + 0.25);
        });
      } catch (e) {}
    }

    function launchConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const pieces = [];
      const colors = ["#facc15", "#38bdf8", "#22c55e", "#ef4444"];
      for (let i = 0; i < 70; i++) {
        pieces.push({
          x: canvas.width / 2, y: canvas.height / 2,
          r: Math.random() * 5 + 3,
          dx: (Math.random() - 0.5) * 12, dy: (Math.random() - 0.8) * 14,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.dx; p.y += p.dy; p.dy += 0.35;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color; ctx.fill();
        });
        frame++;
        if (frame < 90) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    window.addEventListener("DOMContentLoaded", () => {
      initQuestNav();
      startQuest(ALL_QUESTS[0]);
    });
  </script>
