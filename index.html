<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ROBLOX ARCADE: 任務大冒險</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- 引入現代字體 (保證極致銳利，絕不模糊) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090e1a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --gold: #facc15;
      --gold-border: #ca8a04;
      --cyan: #38bdf8;
      --cyan-border: #0284c7;
      --green: #22c55e;
      --green-border: #15803d;
      --border-dark: #334155;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Fredoka', 'Noto Sans TC', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #070a13 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px 10px 40px;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景旋轉光芒 */
    .sunburst-ambient {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 220vw;
      height: 220vw;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(
        from 0deg,
        rgba(56, 189, 248, 0.03) 0deg 15deg,
        transparent 15deg 30deg
      );
      animation: ambientRotate 60s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes ambientRotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* 主應用容器 (桌機居中、手機適配) */
    .app-viewport {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 10;
    }

    /* 頂部 HUD：歷史週次 ＋ 長輩模式 ＋ 寵物背包 */
    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .quest-tabs-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quest-tabs-scroll::-webkit-scrollbar { display: none; }

    .q-btn {
      background: var(--card-bg);
      border: 2px solid var(--border-dark);
      box-shadow: 0 2px 0 #000;
      color: var(--text-sub);
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .q-btn.active {
      background: var(--cyan);
      color: #0b1120;
      border-color: var(--cyan-border);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .action-icons-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .pill-action-btn {
      background: #1e293b;
      border: 2px solid var(--border-dark);
      box-shadow: 0 2px 0 #000;
      color: #fff;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s;
    }
    .pill-action-btn:active { transform: translateY(2px); box-shadow: none; }
    .pill-action-btn.bag-btn { background: linear-gradient(180deg, #ec4899, #be185d); border-color: #831843; }
    .pill-action-btn.elder-btn { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; color: #86efac; }
    .pill-action-btn.elder-btn.active { background: #22c55e; color: #052e16; }

    /* 遊戲模式選擇滑軌 */
    .game-modes-deck {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--border-dark);
    }
    .game-modes-deck::-webkit-scrollbar { display: none; }

    .g-mode-btn {
      flex: 1;
      min-width: 82px;
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 6px 8px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .g-mode-btn.active {
      background: var(--gold);
      color: #0b1120;
      box-shadow: 0 2px 0 var(--gold-border);
    }

    /* 長輩安心導引面板 */
    .elder-helper-banner {
      display: none;
      background: linear-gradient(135deg, rgba(22, 101, 52, 0.95), rgba(15, 23, 42, 0.95));
      border: 2px solid var(--green);
      border-radius: 18px;
      padding: 14px 16px;
      color: #d1fae5;
      font-size: 0.92rem;
      line-height: 1.6;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    .elder-helper-banner.show { display: block; }
    .elder-helper-banner strong { color: #86efac; font-weight: 900; }

    /* 中央遊戲核心舞台 (隨模式切換外觀與反饋) */
    .game-stage-arena {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
      border: 3px solid var(--border-dark);
      box-shadow: 0 8px 0 #000, 0 16px 30px rgba(0, 0, 0, 0.6);
      border-radius: 26px;
      padding: 24px 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .stage-actor-wrapper {
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
    }

    /* 角色 1：開蛋 (3D 向量漸層蛋) */
    .actor-egg {
      width: 110px;
      height: 145px;
      background: radial-gradient(circle at 35% 30%, #93c5fd, #1d4ed8 75%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      border: 4px solid #ffffff;
      box-shadow: 0 10px 25px rgba(29, 78, 216, 0.5), inset -6px -6px 0 rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      animation: floatMotion 2.4s ease-in-out infinite;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .actor-egg.ready {
      background: radial-gradient(circle at 35% 30%, #fef08a, #ea580c 75%);
      box-shadow: 0 0 45px rgba(245, 158, 11, 0.9);
      animation: shake狂暴 0.4s infinite alternate;
    }

    /* 角色 2：密室破門 (鋼鐵大門) */
    .actor-door {
      width: 110px;
      height: 140px;
      background: linear-gradient(180deg, #334155, #1e293b);
      border: 4px solid #64748b;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
    }
    .actor-door.ready {
      border-color: var(--green);
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.7);
      animation: shake狂暴 0.35s infinite alternate;
    }

    /* 角色 3：巴掌亂鬥 (搞笑魔王) */
    .actor-monster {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle at 40% 35%, #f472b6, #db2777);
      border: 4px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 8px 25px rgba(219, 39, 119, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      animation: monsterFloat 1.8s ease-in-out infinite;
    }
    .actor-monster.ready {
      background: radial-gradient(circle at 40% 35%, #f87171, #dc2626);
      box-shadow: 0 0 40px rgba(220, 38, 38, 0.8);
      animation: monsterRage 0.3s infinite alternate;
    }

    /* 角色 4：幸運拉霸 (Casino Slot) */
    .actor-slot {
      width: 160px;
      height: 100px;
      background: #0f172a;
      border: 4px solid var(--gold);
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(250, 204, 21, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      letter-spacing: 4px;
    }
    .actor-slot.ready {
      box-shadow: 0 0 45px rgba(250, 204, 21, 0.8);
      animation: shake狂暴 0.4s infinite alternate;
    }

    @keyframes floatMotion {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes monsterFloat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes shake狂暴 {
      0% { transform: rotate(-7deg) scale(1.05); }
      100% { transform: rotate(7deg) scale(1.05); }
    }
    @keyframes monsterRage {
      0% { transform: scale(1.05) rotate(-10deg); }
      100% { transform: scale(1.15) rotate(10deg); }
    }

    .stage-prompt-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      margin-top: 4px;
    }
    .stage-prompt-subtitle {
      font-size: 0.85rem;
      color: var(--cyan);
      margin-top: 4px;
      font-weight: 700;
    }

    /* 能量進度條 */
    .energy-bar-wrap {
      width: 100%;
      height: 14px;
      background: #0f172a;
      border-radius: 999px;
      border: 2px solid var(--border-dark);
      margin-top: 12px;
      overflow: hidden;
      position: relative;
    }
    .energy-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      border-radius: 999px;
      transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 任務牌組 (單字 + 提示抽屜 + 密碼句) */
    .tasks-deck-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card-item {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 2px solid var(--border-dark);
      box-shadow: 0 4px 0 #000;
      border-radius: 18px;
      padding: 12px 14px;
      transition: transform 0.1s, border-color 0.2s;
    }
    .task-card-item.charged {
      border-color: var(--green);
      background: linear-gradient(180deg, #14532d, #052e16);
      box-shadow: 0 4px 0 #022c22;
    }

    .task-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-main-display {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .word-zh-sub {
      font-size: 0.88rem;
      color: var(--text-sub);
      font-weight: 700;
      margin-top: 2px;
    }
    .task-card-item.charged .word-zh-sub { color: #86efac; }

    .sound-trigger-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(180deg, #0284c7, #0369a1);
      border: 2px solid var(--cyan);
      box-shadow: 0 3px 0 #075985;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .sound-trigger-badge:active { transform: translateY(2px); box-shadow: none; }
    .task-card-item.charged .sound-trigger-badge {
      background: linear-gradient(180deg, var(--green), var(--green-border));
      border-color: #86efac;
      box-shadow: 0 3px 0 #14532d;
    }

    /* 💡 音素拆解展開抽屜 */
    .scaffold-drawer-trigger {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      width: fit-content;
    }
    .scaffold-drawer-content {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-dark);
      font-size: 0.84rem;
      color: #e2e8f0;
      line-height: 1.5;
    }
    .scaffold-drawer-content.open { display: block; }

    /* 通關密碼句卡片 */
    .sentence-quest-card {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border: 2px solid var(--border-dark);
      box-shadow: 0 4px 0 #000;
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .sentence-quest-card:active { transform: translateY(2px); box-shadow: none; }
    .sentence-quest-card.charged {
      border-color: var(--gold);
      background: linear-gradient(180deg, #713f12, #451a03);
      box-shadow: 0 4px 0 #271001;
    }
    .sentence-label-tag {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--gold);
    }
    .sentence-en-text {
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.4;
      color: #ffffff;
    }
    .sentence-zh-text {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 700;
    }

    /* 全螢幕彈窗 Modal (抽卡與圖鑑) */
    .full-overlay-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content-card {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(180deg, #1e293b, #090e1a);
      border: 3px solid var(--gold);
      box-shadow: 0 0 40px rgba(250, 204, 21, 0.4), 0 8px 0 #000;
      border-radius: 26px;
      padding: 22px 18px;
      text-align: center;
      animation: modalPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes modalPop {
      from { transform: scale(0.7) rotate(-5deg); opacity: 0; }
      to { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .loot-rarity-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.78rem;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .r-mythic { background: linear-gradient(90deg, #ec4899, #8b5cf6); color: #fff; }
    .r-legendary { background: linear-gradient(90deg, #f59e0b, #ef4444); color: #fff; }
    .r-rare { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: #fff; }
    .r-common { background: #64748b; color: #fff; }

    .loot-avatar-icon {
      font-size: 4.5rem;
      margin: 6px 0;
      animation: floatMotion 1.5s ease-in-out infinite;
    }
    .loot-name-title { font-size: 1.5rem; font-weight: 900; color: #ffffff; }
    .loot-power-tag { font-size: 1rem; color: var(--gold); font-weight: 800; margin: 4px 0 8px; }
    .loot-quote-box {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    /* 長輩免死通關認證大框 */
    .grandparent-pass-seal {
      background: rgba(34, 197, 94, 0.18);
      border: 2px dashed var(--green);
      border-radius: 14px;
      padding: 10px 12px;
      color: #86efac;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .modal-submit-btn {
      width: 100%;
      background: linear-gradient(180deg, var(--green), var(--green-border));
      border: 2px solid #14532d;
      box-shadow: 0 4px 0 #052e16;
      color: #ffffff;
      padding: 12px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
    }
    .modal-submit-btn:active { transform: translateY(2px); box-shadow: none; }

    /* 圖鑑網格清單 */
    .bag-grid-layout {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-height: 48vh;
      overflow-y: auto;
      margin: 14px 0;
      padding: 2px;
    }
    .bag-card-cell {
      background: #0f172a;
      border: 2px solid var(--border-dark);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
    }
    .bag-card-cell.unlocked { border-color: var(--gold); background: #1e293b; }
    .bag-card-cell.locked { opacity: 0.35; filter: grayscale(1); }
    .bag-icon-img { font-size: 1.8rem; margin-bottom: 2px; }
    .bag-name-text { font-size: 0.72rem; font-weight: 700; }

    /* 開箱白閃光與彩帶畫布 */
    #flash-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.15s ease-out;
    }
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 101;
    }
  </style>
</head>
<body>

  <div class="sunburst-ambient"></div>
  <div id="flash-overlay"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="app-viewport">
    
    <!-- 頂部控制面板 -->
    <div class="control-header">
      <div class="quest-tabs-scroll" id="quest-nav-box"></div>
      <div class="action-icons-group">
        <button class="pill-action-btn elder-btn" id="elder-btn" onclick="toggleElderGuide()">👵 長輩指南</button>
        <button class="pill-action-btn bag-btn" onclick="openBagModal()">🎒 寵物圖鑑</button>
      </div>
    </div>

    <!-- 遊戲模式滑軌 -->
    <div class="game-modes-deck">
      <button class="g-mode-btn active" onclick="setMode('EGG', this)">🥚 開蛋孵化</button>
      <button class="g-mode-btn" onclick="setMode('DOORS', this)">🚪 密室破門</button>
      <button class="g-mode-btn" onclick="setMode('SLAP', this)">🥊 揍飛怪獸</button>
      <button class="g-mode-btn" onclick="setMode('SLOT', this)">🎰 幸運拉霸</button>
    </div>

    <!-- 長輩安心護航指南 (可切換顯示) -->
    <div class="elder-helper-banner" id="elder-guide-box">
      <strong>長輩請放心（免懂英文）：</strong><br>
      請看孩子點擊下方 3 個單字與 1 個句子，跟著聲音朗讀。集滿上方能量後，點擊中央寶箱即可通關！
    </div>

    <!-- 核心互動舞台 (隨模式切換) -->
    <div class="game-stage-arena">
      <div class="stage-actor-wrapper" onclick="handleStageInteract()">
        <!-- 角色動態注入處 -->
        <div id="stage-actor-element"></div>
      </div>
      <div class="stage-prompt-title" id="stage-prompt-title">幸運開蛋任務</div>
      <div class="stage-prompt-subtitle" id="stage-prompt-sub">點擊下方 3 個字＋1 個句子注滿能量！</div>
      
      <!-- 能量進度條 -->
      <div class="energy-bar-wrap">
        <div class="energy-bar-fill" id="energy-progress-fill"></div>
      </div>
    </div>

    <!-- 任務牌組：3 個單字（含音素提示）＋ 1 個句子 -->
    <div class="tasks-deck-container">
      <div id="words-cards-deck" style="display: flex; flex-direction: column; gap: 10px;"></div>
      
      <!-- 核心語句卡 -->
      <div class="sentence-quest-card" id="sentence-card" onclick="handleSentenceClick()">
        <div class="sentence-label-tag">📜 本週通關密碼句 (點擊聽讀)</div>
        <div class="sentence-en-text" id="target-sentence-en"></div>
        <div class="sentence-zh-text" id="target-sentence-zh"></div>
      </div>
    </div>

  </div>

  <!-- 1. 抽卡開獎彈窗 (全模式共通開箱反饋) -->
  <div class="full-overlay-modal" id="loot-modal">
    <div class="modal-content-card">
      <span class="loot-rarity-badge" id="loot-rarity-badge">神話級 MYTHIC</span>
      <div class="loot-avatar-icon" id="loot-avatar-icon">🐉</div>
      <div class="loot-name-title" id="loot-name-title">彩虹機械龍</div>
      <div class="loot-power-tag" id="loot-power-tag">⚡ 戰鬥力: 999,999</div>
      <div class="loot-quote-box" id="loot-quote-box">全服爆率只有 1% 的極品神寵！</div>
      
      <!-- 長輩免死證明 -->
      <div class="grandparent-pass-seal">
        ✨ <strong>今日任務已通關！</strong><br>
        出示此卡給阿公阿嬤確認，換今日放鬆時間！
      </div>

      <button class="modal-submit-btn" onclick="closeLootModal()">收進背包圖鑑 🎮</button>
    </div>
  </div>

  <!-- 2. 寵物收藏圖鑑背包 -->
  <div class="full-overlay-modal" id="bag-modal">
    <div class="modal-content-card" style="max-width: 380px;">
      <h3 style="font-size: 1.3rem; color: var(--gold);">🎒 寵物收藏圖鑑</h3>
      <div style="font-size: 0.82rem; color: var(--text-sub); margin-top: 4px;">
        已解鎖進度：<span id="bag-progress-text">0 / 6</span>
      </div>
      <div class="bag-grid-layout" id="bag-items-container"></div>
      <button class="modal-submit-btn" onclick="closeBagModal()">返回任務</button>
    </div>
  </div>

  <script>
    // ========================================================
    // ⚙️ 關卡歷史資料庫 (每週直接在陣列頂部新增即可)
    // ========================================================
    const ALL_QUESTS = [
      {
        id: "w4",
        label: "第 4 關",
        words: [
          { en: "rain", display: "r · ain", zh: "下雨", hint: "發音重點：ai 發長母音 /eɪ/，拼寫拆為 r + ain。" },
          { en: "weather", display: "wea · ther", zh: "天氣", hint: "音節拆解：wea-（短母音 /ɛ/）+ -ther（咬舌濁音 /ðər/）。" },
          { en: "outside", display: "out · side", zh: "外面", hint: "複合字：out（出去）+ side（邊/面）＝ 外面。" }
        ],
        sentence: {
          en: "It is raining outside.",
          zh: "外面正在下雨。"
        }
      },
      {
        id: "w3",
        label: "第 3 關 (複習)",
        words: [
          { en: "happy", display: "hap · py", zh: "高興的", hint: "雙子音 pp，前母音 a 發蝴蝶音 /æ/。" },
          { en: "school", display: "school", zh: "學校", hint: "ch 在這裡發硬音 /k/，oo 發長母音 /u/。" },
          { en: "friend", display: "friend", zh: "朋友", hint: "ie 在此發短母音 /ɛ/，結尾 d 輕聲釋放。" }
        ],
        sentence: {
          en: "I see my friend at school.",
          zh: "我在學校看到我的朋友。"
        }
      }
    ];

    // 全服寵物圖鑑庫 (含 ID、稀有度、戰鬥力、幽默說明)
    const PET_CATALOG = [
      { id: "p1", name: "彩虹霸王龍", rarity: "神話級 MYTHIC", rClass: "r-mythic", icon: "🦖", power: "⚡ 888,888", quote: "自帶彩虹軌跡的終極神龍，走到哪亮到哪。" },
      { id: "p2", name: "黃金香蕉狗", rarity: "傳奇級 LEGENDARY", rClass: "r-legendary", icon: "🐕", power: "⚡ 65,000", quote: "香蕉皮做的小狗，跑得飛快但容易打滑。" },
      { id: "p3", name: "暴風雪獨角獸", rarity: "傳奇級 LEGENDARY", rClass: "r-legendary", icon: "🦄", power: "⚡ 52,000", quote: "能發射冰錐光束，把無聊的考卷全部凍結！" },
      { id: "p4", name: "發光的馬桶怪", rarity: "稀有級 RARE", rClass: "r-rare", icon: "🚽", power: "⚡ 4,800", quote: "按下沖水鍵會發射超強音波攻擊！" },
      { id: "p5", name: "爆炸西瓜怪", rarity: "稀有級 RARE", rClass: "r-rare", icon: "🍉", power: "⚡ 2,300", quote: "受到驚嚇會吐出大量西瓜籽機關槍。" },
      { id: "p6", name: "發霉的生吐司", rarity: "普通級 COMMON", rClass: "r-common", icon: "🍞", power: "⚡ 15", quote: "雖然戰鬥力極低，但看起來挺好吃的。" }
    ];

    let currentQuestIdx = 0;
    let currentMode = 'EGG';
    let chargedSet = new Set();
    let unlockedPets = JSON.parse(localStorage.getItem("unlocked_pet_ids") || "[]");

    // ----------------------------------------------------
    // 初始化與關卡切換
    // ----------------------------------------------------
    function initQuestNav() {
      const box = document.getElementById("quest-nav-box");
      box.innerHTML = "";
      ALL_QUESTS.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = `q-btn ${idx === currentQuestIdx ? 'active' : ''}`;
        btn.innerText = q.label;
        btn.onclick = () => switchQuest(idx);
        box.appendChild(btn);
      });
    }

    function switchQuest(idx) {
      currentQuestIdx = idx;
      document.querySelectorAll(".q-btn").forEach((b, i) => b.classList.toggle("active", i === idx));
      loadQuestData(ALL_QUESTS[idx]);
    }

    function loadQuestData(quest) {
      chargedSet.clear();
      updateProgressUI();

      // 更新句子
      document.getElementById("target-sentence-en").innerText = quest.sentence.en;
      document.getElementById("target-sentence-zh").innerText = quest.sentence.zh;
      document.getElementById("sentence-card").classList.remove("charged");

      // 渲染單字（含音素拆解提示抽屜）
      const wordsBox = document.getElementById("words-cards-deck");
      wordsBox.innerHTML = "";
      quest.words.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "task-card-item";
        card.id = `card-word-${idx}`;
        card.innerHTML = `
          <div class="task-row-top">
            <div>
              <div class="word-main-display">${item.display}</div>
              <div class="word-zh-sub">${item.zh}</div>
            </div>
            <div class="sound-trigger-badge" onclick="handleWordClick(${idx}, '${item.en}')">🔊</div>
          </div>
          <div class="scaffold-drawer-trigger" onclick="toggleHint(this)">
            💡 音素提示與拆解
          </div>
          <div class="scaffold-drawer-content">${item.hint}</div>
        `;
        wordsBox.appendChild(card);
      });

      renderStageActor();
    }

    function toggleHint(btn) {
      const drawer = btn.nextElementSibling;
      const isOpen = drawer.classList.toggle("open");
      btn.innerText = isOpen ? "收合提示" : "💡 音素提示與拆解";
    }

    // ----------------------------------------------------
    // 4 大遊戲模式舞台渲染 (徹底拉開視覺與反饋)
    // ----------------------------------------------------
    function setMode(modeKey, btn) {
      currentMode = modeKey;
      document.querySelectorAll(".g-mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderStageActor();
    }

    function renderStageActor() {
      const actorBox = document.getElementById("stage-actor-element");
      const title = document.getElementById("stage-prompt-title");
      const sub = document.getElementById("stage-prompt-sub");
      const isReady = chargedSet.size === 4;

      if (currentMode === 'EGG') {
        actorBox.innerHTML = `<div class="actor-egg ${isReady ? 'ready' : ''}">${isReady ? '✨' : '🔒'}</div>`;
        title.innerText = isReady ? "🔥 能量充飽！快點擊開蛋！" : "幸運開蛋任務";
        sub.innerText = isReady ? "神秘神寵即將孵化！" : "點下方 3 個字＋1 個句子注滿能量！";

      } else if (currentMode === 'DOORS') {
        actorBox.innerHTML = `
          <div class="actor-door ${isReady ? 'ready' : ''}">
            <div style="font-size: 1.1rem; font-weight: 800; color: #facc15;">DOOR 0${chargedSet.size}</div>
            <div style="font-size: 1.8rem;">${isReady ? '🔓' : '🔒'}</div>
          </div>
        `;
        title.innerText = isReady ? "🚪 密碼全解開！點擊破門逃脫！" : "密室逃脫破門";
        sub.innerText = isReady ? "點擊大門衝出房間！" : `目前破鎖進度：${chargedSet.size} / 4`;

      } else if (currentMode === 'SLAP') {
        actorBox.innerHTML = `<div class="actor-monster ${isReady ? 'ready' : ''}">${isReady ? '😱' : '🤪'}</div>`;
        title.innerText = isReady ? "💥 大招蓄滿！點擊一拳揍飛！" : "巴掌大亂鬥";
        sub.innerText = isReady ? "一拳把它打飛到外太空！" : "聽讀累積怒氣值！";

      } else if (currentMode === 'SLOT') {
        actorBox.innerHTML = `
          <div class="actor-slot ${isReady ? 'ready' : ''}">
            ${isReady ? '7️⃣ 7️⃣ 7️⃣' : '💎 ❓ 💎'}
          </div>
        `;
        title.innerText = isReady ? "🎰 代幣集齊！點擊拉桿開獎！" : "幸運拉霸機";
        sub.innerText = isReady ? "大獎即將噴出！" : "湊齊 4 枚代幣啟動拉霸！";
      }
    }

    // ----------------------------------------------------
    // 點擊注能與發音邏輯
    // ----------------------------------------------------
    function handleWordClick(idx, word) {
      playCoinSound();
      speakTTS(word);

      const key = `w-${idx}`;
      if (!chargedSet.has(key)) {
        chargedSet.add(key);
        document.getElementById(`card-word-${idx}`).classList.add("charged");
        updateProgressUI();
      }
    }

    function handleSentenceClick() {
      const sentence = ALL_QUESTS[currentQuestIdx].sentence.en;
      playCoinSound();
      speakTTS(sentence);

      const key = "sentence";
      if (!chargedSet.has(key)) {
        chargedSet.add(key);
        document.getElementById("sentence-card").classList.add("charged");
        updateProgressUI();
      }
    }

    function updateProgressUI() {
      const count = chargedSet.size;
      const percent = (count / 4) * 100;
      document.getElementById("energy-progress-fill").style.width = `${percent}%`;

      renderStageActor();

      if (count === 4) {
        playFanfareSound();
      }
    }

    // 點擊中央舞台觸發開獎
    function handleStageInteract() {
      if (chargedSet.size < 4) {
        alert("請先將 3 個單字與 1 個句子點擊聽完，注滿 4 顆能量！");
        return;
      }

      // 觸發白閃光、開箱音效、全螢幕彩帶
      triggerWhiteFlash();
      playChestSound();
      launchConfetti();

      // 保底機制：70% 機率優先掉落未擁有的寵物
      let pool = PET_CATALOG;
      if (unlockedPets.length < PET_CATALOG.length) {
        const unowned = PET_CATALOG.filter(p => !unlockedPets.includes(p.id));
        if (Math.random() < 0.7 && unowned.length > 0) {
          pool = unowned;
        }
      }
      const loot = pool[Math.floor(Math.random() * pool.length)];

      if (!unlockedPets.includes(loot.id)) {
        unlockedPets.push(loot.id);
        localStorage.setItem("unlocked_pet_ids", JSON.stringify(unlockedPets));
      }

      // 渲染開獎彈窗
      const badge = document.getElementById("loot-rarity-badge");
      badge.innerText = loot.rarity;
      badge.className = `loot-rarity-badge ${loot.rClass}`;
      document.getElementById("loot-avatar-icon").innerText = loot.icon;
      document.getElementById("loot-name-title").innerText = loot.name;
      document.getElementById("loot-power-tag").innerText = loot.power;
      document.getElementById("loot-quote-box").innerText = loot.quote;

      document.getElementById("loot-modal").style.display = "flex";
    }

    function closeLootModal() {
      document.getElementById("loot-modal").style.display = "none";
    }

    // ----------------------------------------------------
    // 圖鑑背包與長輩指南
    // ----------------------------------------------------
    function openBagModal() {
      const box = document.getElementById("bag-items-container");
      box.innerHTML = "";
      document.getElementById("bag-progress-text").innerText = `${unlockedPets.length} / ${PET_CATALOG.length}`;

      PET_CATALOG.forEach(p => {
        const isUnlocked = unlockedPets.includes(p.id);
        const cell = document.createElement("div");
        cell.className = `bag-card-cell ${isUnlocked ? 'unlocked' : 'locked'}`;
        cell.innerHTML = `
          <div class="bag-icon-img">${isUnlocked ? p.icon : '❓'}</div>
          <div class="bag-name-text">${isUnlocked ? p.name.split(' ')[0] : '未解鎖'}</div>
        `;
        box.appendChild(cell);
      });

      document.getElementById("bag-modal").style.display = "flex";
    }

    function closeBagModal() {
      document.getElementById("bag-modal").style.display = "none";
    }

    function toggleElderGuide() {
      const banner = document.getElementById("elder-guide-box");
      const btn = document.getElementById("elder-btn");
      const isShow = banner.classList.toggle("show");
      btn.classList.toggle("active", isShow);
    }

    // ----------------------------------------------------
    // 音訊與特效引擎 (極致流暢，零延遲)
    // ----------------------------------------------------
    function speakTTS(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.8;
        window.speechSynthesis.speak(utter);
      }
    }

    function triggerWhiteFlash() {
      const flash = document.getElementById("flash-overlay");
      flash.style.opacity = "0.9";
      setTimeout(() => { flash.style.opacity = "0"; }, 250);
    }

    function playCoinSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(987.77, ctx.currentTime);
        osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function playFanfareSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.25);
          osc.start(ctx.currentTime + i * 0.1);
          osc.stop(ctx.currentTime + i * 0.1 + 0.25);
        });
      } catch (e) {}
    }

    function playChestSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [440, 554.37, 659.25, 880, 1108.73].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.07);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.07 + 0.3);
          osc.start(ctx.currentTime + idx * 0.07);
          osc.stop(ctx.currentTime + idx * 0.07 + 0.3);
        });
      } catch (e) {}
    }

    function launchConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ["#facc15", "#38bdf8", "#22c55e", "#ec4899", "#a855f7"];
      for (let i = 0; i < 90; i++) {
        pieces.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          r: Math.random() * 6 + 4,
          dx: (Math.random() - 0.5) * 14,
          dy: (Math.random() - 0.8) * 16,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.dx;
          p.y += p.dy;
          p.dy += 0.35;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        });
        frame++;
        if (frame < 110) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    // 啟動程序
    window.addEventListener("DOMContentLoaded", () => {
      initQuestNav();
      loadQuestData(ALL_QUESTS[0]);
    });
  </script>
</body>
</html>
